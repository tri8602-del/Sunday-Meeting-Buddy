<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game 17 — Word Search</title>
<style>
  :root{--ink:#1a2236}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e7eef6;color:var(--ink)}
  .wrap{max-width:560px;margin:0 auto;padding:14px 12px 36px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#667085;font-weight:700;margin-bottom:8px}
  .hold{min-height:48px;background:#fff8df;border:1px solid #efd27b;border-radius:14px;padding:10px;font-weight:800;text-align:center;margin-bottom:10px}
  .list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
  .list span{background:#fff;border:1px solid #d5dceb;border-radius:999px;padding:5px 9px;font-weight:800;font-size:12px}
  .list span.got{background:#e7f8ee;text-decoration:line-through}
   .grid{touch-action:none;user-select:none;display:grid;grid-template-columns:repeat(12,1fr);gap:2px;max-width:480px;margin:0 auto}
  .grid button{aspect-ratio:1;border:0;border-radius:6px;background:#fff;font-weight:900;font-size:12px}
  .grid button.on{background:#efeaff}
  .grid button.hit{background:#c7f0d6}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#efeaff;color:#4c43b8;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <h1>Game 17 — Word Search</h1>
  <div class="sub">Slide your finger along the word, then let go.</div>
  <div class="hold" id="hold">Find a word. Press the first letter, slide to the last, lift.</div>
  <div class="list" id="list"></div>
  <div class="grid" id="grid"></div>
  <button class="reset" id="reset">Reset</button>
</div>
<script>
const GRID=[["M", "M", "W", "O", "N", "K", "O", "O", "R", "M", "M", "K"], ["E", "U", "E", "L", "D", "E", "R", "S", "V", "X", "S", "I"], ["E", "B", "J", "E", "H", "O", "V", "A", "H", "C", "T", "N"], ["T", "R", "G", "T", "S", "P", "E", "E", "D", "O", "U", "G"], ["I", "Q", "M", "E", "V", "B", "E", "I", "Q", "U", "D", "D"], ["N", "U", "F", "A", "C", "T", "S", "Q", "I", "R", "E", "O"], ["G", "I", "K", "C", "Y", "D", "O", "B", "O", "S", "N", "M"], ["S", "Z", "C", "H", "V", "W", "E", "I", "O", "E", "T", "T"], ["D", "U", "R", "I", "M", "P", "W", "A", "O", "K", "S", "Y"], ["S", "L", "X", "N", "J", "W", "U", "W", "D", "F", "B", "Z"], ["D", "O", "V", "G", "W", "L", "C", "Q", "K", "E", "S", "R"], ["R", "A", "N", "S", "O", "M", "Z", "L", "A", "F", "C", "Y"]];
const WORDS=["DEAD", "RANSOM", "KINGDOM", "MEETINGS", "ELDERS", "FACTS", "KNOW", "JEHOVAH", "COURSE", "TEACHINGS", "BODY", "STUDENTS"];
let got=[], a=null, locked=false;
function hold(m){document.getElementById("hold").textContent=m}
function key(r,c){return r+","+c}
function line(r1,c1,r2,c2){
  const dr=Math.sign(r2-r1), dc=Math.sign(c2-c1);
  if(dr!==0 && dc!==0 && Math.abs(r2-r1)!==Math.abs(c2-c1)) return null;
  if(dr===0 && dc===0) return null;
  const out=[[r1,c1]];
  let r=r1,c=c1;
  while(r!==r2 || c!==c2){
    r+=dr; c+=dc;
    if(r<0||c<0||r>=12||c>=12) return null;
    out.push([r,c]);
  }
  return out;
}
function paint(){
  document.getElementById("list").innerHTML=WORDS.map(w=>'<span class="'+(got.includes(w)?"got":"")+'">'+w+"</span>").join("");
  const on=preview.map(([r,c])=>key(r,c));
  document.getElementById("grid").innerHTML=GRID.flatMap((row,r)=>row.map((ch,c)=>{
    const cls=gotCells.has(key(r,c))?"hit":(on.includes(key(r,c))?"on":"");
    return '<button class="'+cls+'" data-r="'+r+'" data-c="'+c+'">'+ch+"</button>";
  })).join("");
  const g=document.getElementById("grid");
  g.onpointerdown=startSel; g.onpointermove=moveSel; window.onpointerup=endSel;
  g.ontouchstart=startSel; g.ontouchmove=moveSel; window.ontouchend=endSel;
}
const gotCells=new Set();
let drag=null, preview=[];
function cellFromEvent(e){
  const t=(e.touches?e.touches[0]:e);
  const el=document.elementFromPoint(t.clientX,t.clientY);
  if(!el || el.dataset.r===undefined) return null;
  return [+el.dataset.r,+el.dataset.c];
}
function startSel(e){
  if(locked) return;
  e.preventDefault();
  const p=cellFromEvent(e); if(!p) return;
  drag=p; preview=[p]; paint();
}
function paintPreview(){
  document.querySelectorAll("#grid button").forEach(b=>{
    const k=b.dataset.r+","+b.dataset.c;
    const isPrev=preview.some(([r,c])=>r===+b.dataset.r && c===+b.dataset.c);
    b.className=gotCells.has(k)?"hit":(isPrev?"on":"");
  });
}
function moveSel(e){
  if(!drag||locked) return;
  e.preventDefault();
  const p=cellFromEvent(e); if(!p) return;
  const cells=line(drag[0],drag[1],p[0],p[1]);
  preview=cells||[drag];
  paintPreview();
}
function endSel(){
  if(!drag||locked) return;
  const cells=preview.slice();
  drag=null; preview=[];
  if(cells.length<2){ paint(); hold("Slide through the whole word."); return; }
  const word=cells.map(([y,x])=>GRID[y][x]).join("");
  const rev=word.split("").reverse().join("");
  const hit=WORDS.find(w=>w===word||w===rev);
  if(hit && !got.includes(hit)){
    got.push(hit);
    cells.forEach(([y,x])=>gotCells.add(key(y,x)));
    hold("Found "+hit+".");
    paint();
    if(got.length===WORDS.length) hold("Besides the facts, we want them to know Jehovah.");
  } else {
    locked=true;
    hold(hit?"Already found.":"That word is not on the list.");
    paint();
    setTimeout(()=>{locked=false; paint();},1400);
  }
}
function tap(){}
document.getElementById("reset").onclick=()=>{got=[]; a=null; locked=false; gotCells.clear(); hold("Find a word. Press the first letter, slide to the last, lift."); paint()};
paint();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-17-search", DONE="Besides the facts, we want them to know Jehovah.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
</body>
</html>
