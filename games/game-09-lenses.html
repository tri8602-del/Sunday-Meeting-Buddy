<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game 9-10 — Two Lenses</title>
<style>
  :root{--ink:#1a2236}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#1b1630;color:#f7f1dc}
  .wrap{max-width:860px;margin:0 auto;padding:14px 12px 36px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#cbb98a;font-weight:700;margin-bottom:10px}
  .hold{min-height:50px;background:#3a2f12;border:1px solid #c9a227;border-radius:14px;padding:10px;font-weight:800;text-align:center;margin-bottom:12px;color:#ffe9a0}
  .lenses{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .lens{
    min-height:210px;border-radius:50%;border:10px solid #c9a227;
    box-shadow:inset 0 0 0 6px #7a5a10,0 0 20px rgba(201,162,39,.35);
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),transparent 40%),
               conic-gradient(from 20deg,#3b1d5c,#1d4e6e,#1f5a3a,#6b3a16,#3b1d5c);
    padding:28px 16px 16px;text-align:center;
  }
  .lens h3{margin:0 0 8px;color:#ffe9a0}
  .chip{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 8px;margin:4px 0;font-weight:800}
  .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .tag{background:#fff8df;color:#1a2236;border:0;border-radius:14px;padding:10px 12px;font-weight:800}
  .tag.sel{outline:3px solid #fff}
  .den{display:none;position:relative}
  .den.show{display:block}
  .den img{width:100%;border-radius:16px;border:6px solid #c9a227}
  .spot{position:absolute;border:3px dashed #ffe9a0;border-radius:16px;background:rgba(0,0,0,.15);color:#fff8df;font-weight:900;padding:8px}
  .spot.ok{border-style:solid;background:rgba(31,157,91,.35)}
  .happy{left:38%;top:18%;width:24%;height:42%}
  .mad{left:6%;bottom:8%;width:30%;height:22%}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#3a2f12;color:#ffe9a0;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <h1>Games 9–10 — Two Lenses</h1>
  <div class="sub">Slap the right tags on the right lens. Then tag the den.</div>
  <div class="hold" id="hold">When we read Job, is it about the person — or about Jehovah?</div>
  <div id="phase1">
    <div class="lenses">
      <div class="lens" data-lens="person"><h3>About the person</h3><div id="pIn"></div></div>
      <div class="lens" data-lens="god"><h3>About Jehovah</h3><div id="gIn"></div></div>
    </div>
    <div class="tags" id="tags1"></div>
  </div>
  <div class="den" id="den">
    <img id="pic" alt="den">
    <button class="spot happy" data-spot="happy">What made Jehovah happy?</button>
    <button class="spot mad" data-spot="mad">What displeased him?</button>
  </div>
  <div class="tags" id="tags2" hidden></div>
  <button class="reset" id="reset">Reset</button>
</div>

document.getElementById("pic").src=PIC;
const L1=[
  {t:"endurance",lens:"person",why:"Job’s endurance is about the person."},
  {t:"tenderness",lens:"god",why:"James also shows Jehovah’s tenderness."},
  {t:"mercy",lens:"god",why:"And Jehovah’s mercy."},
  {t:"how many lions",lens:"no",why:"That is not the point of the reading."},
  {t:"what Job ate",lens:"no",why:"That is not why Jehovah put the account there."}
];
const L2=[
  {t:"He saved Daniel",spot:"happy",why:"Jehovah was pleased to save Daniel."},
  {t:"The accusers",spot:"mad",why:"What happened to the accusers shows what displeases him."},
  {t:"How many lions",spot:"no",why:"Counting lions is not the lesson."},
  {t:"The lantern",spot:"no",why:"The lantern is just in the picture."}
];
let sel=null, locked=false, pGot=[], gGot=[], dGot={};
function hold(m){document.getElementById("hold").textContent=m}
function mix(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
function paint1(){
  document.getElementById("pIn").innerHTML=pGot.map(t=>'<div class="chip">'+t+"</div>").join("");
  document.getElementById("gIn").innerHTML=gGot.map(t=>'<div class="chip">'+t+"</div>").join("");
  const used=[...pGot,...gGot];
  document.getElementById("tags1").innerHTML=mix(L1).filter(x=>!used.includes(x.t)).map(x=>'<button class="tag" data-t="'+x.t+'">'+x.t+"</button>").join("");
  document.querySelectorAll("#tags1 .tag").forEach(b=>b.onclick=()=>{
    if(locked) return;
    sel=b.dataset.t;
    document.querySelectorAll("#tags1 .tag").forEach(x=>x.classList.toggle("sel",x===b));
    hold("Now tap a lens.");
  });
}
document.querySelectorAll(".lens").forEach(el=>el.onclick=()=>{
  if(!sel||locked) return;
  const it=L1.find(x=>x.t===sel);
  locked=true;
  if(it.lens===el.dataset.lens){
    hold(it.why);
    if(it.lens==="person") pGot.push(sel); else gGot.push(sel);
    sel=null;
    setTimeout(()=>{
      locked=false; paint1();
      if(gGot.includes("tenderness") && gGot.includes("mercy")) openDen();
    },1600);
  } else {
    hold(it.lens==="no"?it.why:"Right idea — wrong lens.");
    setTimeout(()=>{locked=false},1600);
  }
});
function openDen(){
  document.getElementById("phase1").style.display="none";
  document.getElementById("den").classList.add("show");
  document.getElementById("tags2").hidden=false;
  hold("Now the den. Tap a tag, then tap a gold box.");
  paint2();
}
function paint2(){
  const used=Object.values(dGot);
  document.getElementById("tags2").innerHTML=mix(L2).filter(x=>!used.includes(x.t)).map(x=>'<button class="tag" data-t="'+x.t+'">'+x.t+"</button>").join("");
  document.querySelectorAll("#tags2 .tag").forEach(b=>b.onclick=()=>{
    if(locked) return;
    sel=b.dataset.t;
    document.querySelectorAll("#tags2 .tag").forEach(x=>x.classList.toggle("sel",x===b));
    hold("Tap a gold box on the picture.");
  });
}
document.querySelectorAll(".spot").forEach(s=>s.onclick=()=>{
  if(!sel||locked||dGot[s.dataset.spot]) return;
  const it=L2.find(x=>x.t===sel);
  locked=true;
  if(it.spot===s.dataset.spot){
    hold(it.why);
    dGot[s.dataset.spot]=sel;
    s.classList.add("ok");
    s.textContent=sel;
    sel=null;
    setTimeout(()=>{
      locked=false; paint2();
      if(dGot.happy && dGot.mad) hold("Yes. Every account shows what pleases Jehovah — and what does not.");
    },1600);
  } else {
    hold(it.spot==="no"?it.why:"That tag belongs on the other box.");
    setTimeout(()=>{locked=false},1600);
  }
});
document.getElementById("reset").onclick=()=>{
  sel=null; locked=false; pGot=[]; gGot=[]; dGot={};
  document.getElementById("phase1").style.display="";
  document.getElementById("den").classList.remove("show");
  document.getElementById("tags2").hidden=true;
  document.querySelectorAll(".spot").forEach(s=>{
    s.classList.remove("ok");
    s.textContent=s.dataset.spot==="happy"?"What made Jehovah happy?":"What displeased him?";
  });
  hold("When we read Job, is it about the person — or about Jehovah?");
  paint1();
};
paint1();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-09-lenses", DONE="Yes. Every account shows what pleases Jehovah — and what does not.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
