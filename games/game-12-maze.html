<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game 12-13 — Maze</title>
<style>
  :root{--ink:#1a2236}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e8eef6;color:var(--ink)}
  .wrap{max-width:520px;margin:0 auto;padding:14px 12px 36px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#667085;font-weight:700;margin-bottom:10px}
  .hold{min-height:52px;background:#fff8df;border:1px solid #efd27b;border-radius:14px;padding:10px;font-weight:800;text-align:center;margin-bottom:10px}
  .maze{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:#1a2236;padding:8px;border-radius:16px}
  .t{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:11px;text-align:center;padding:2px}
  .w{background:#2a3348}
  .p{background:#d7e6c8}
  .you{background:#6d5dfc;color:#fff;border-radius:50%}
  .gate{background:#c9a227;color:#1a2236}
  .goal{background:#49b877;color:#fff;font-size:10px}
  .dead{background:#f3d0d0;color:#7a2a2a;font-size:9px}
  .choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
  .choices button{background:#fff;border:2px solid #d5dceb;border-radius:14px;padding:10px 12px;font-weight:800}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#efeaff;color:#4c43b8;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <h1>Games 12–13 — Maze</h1>
  <div class="sub">Tap a square next to you. Open gates with what you know about Jehovah.</div>
  <div class="hold" id="hold">Stuck on a hard account? Start at S. Get to the green square.</div>
  <div class="maze" id="maze"></div>
  <div class="choices" id="choices"></div>
  <button class="reset" id="reset">Reset</button>
</div>
<script>
// 9 x 11  . path  # wall  S start  G goal  1-4 gates  D dead
const MAP=[
"S..#..D#.",
".#.#.#.#.",
".#...#.#.",
"1###.#.#.",
"...#...#.",
"##.#.###.",
"..2#..#3.",
".###.#.#.",
"...#...#.",
"##.#.##4.",
"..G#....."
];
const GATES={
  "1":{ok:"Life is precious to him", why:"Yes — life is precious to Jehovah.", junk:["Jehovah was unfair","Skip the account"]},
  "2":{ok:"He went far to save sinners", why:"Yes — he went far to save sinners.", junk:["We need every detail","Skip the account"]},
  "3":{ok:"He does not punish the innocent", why:"Yes — he does not punish the innocent.", junk:["Jehovah was unfair","We need every detail"]},
  "4":{ok:"The guilty do not just escape", why:"Yes — the guilty do not just escape.", junk:["Skip the account","Jehovah was unfair"]}
};
let you={r:0,c:0}, last={r:0,c:0}, locked=false, opened={};
function hold(m){document.getElementById("hold").textContent=m}
function ch(r,c){return MAP[r][c]}
function paint(){
  document.getElementById("maze").innerHTML=MAP.flatMap((row,r)=>row.split("").map((k,c)=>{
    let cls="t w", txt="";
    if(k===".") {cls="t p"}
    else if(k==="S") {cls="t p"; txt="S"}
    else if(k==="G") {cls="t goal"; txt="RIGHT"}
    else if("1234".includes(k)) {cls="t gate"; txt=opened[k]?"✓":k}
    else if(k==="D") {cls="t dead"; txt="skip"}
    if(you.r===r && you.c===c) {cls="t you"; txt="☺"}
    return '<button class="'+cls+'" data-r="'+r+'" data-c="'+c+'">'+txt+"</button>";
  })).join("");
  document.querySelectorAll(".t").forEach(b=>b.onclick=()=>tryMove(+b.dataset.r,+b.dataset.c));
}
function tryMove(r,c){
  if(locked) return;
  const k=ch(r,c);
  if(k==="#") return;
  if(Math.abs(r-you.r)+Math.abs(c-you.c)!==1){ hold("Tap a square next to you."); return; }
  last={...you}; you={r,c};
  if(k==="D"){
    locked=true; hold("Dead end. We do not skip the account.");
    setTimeout(()=>{you={...last}; locked=false; paint(); hold("Back a step. Try another path.");},1600);
    paint(); return;
  }
  if("1234".includes(k) && !opened[k]){
    paint(); ask(k); return;
  }
  if(k==="G"){
    if(Object.keys(opened).length<4){ hold("Open all four gold gates first."); you={...last}; paint(); return; }
    hold("We know our God. He always does what is right.");
    paint(); return;
  }
  hold("Keep going.");
  paint();
}
function ask(k){
  locked=true;
  const g=GATES[k];
  const opts=[g.ok,...g.junk].sort(()=>Math.random()-0.5);
  hold("This gate opens with a true thing about Jehovah.");
  document.getElementById("choices").innerHTML=opts.map(t=>'<button data-t="'+t+'">'+t+"</button>").join("");
  document.querySelectorAll("#choices button").forEach(b=>b.onclick=()=>{
    if(b.dataset.t===g.ok){
      opened[k]=1;
      hold(g.why);
      document.getElementById("choices").innerHTML="";
      setTimeout(()=>{locked=false; paint();},1600);
    } else {
      hold("That is a dead-end thought. Back a step.");
      you={...last};
      document.getElementById("choices").innerHTML="";
      setTimeout(()=>{locked=false; paint();},1600);
    }
  });
}
document.getElementById("reset").onclick=()=>{
  you={r:0,c:0}; last={r:0,c:0}; locked=false; opened={};
  document.getElementById("choices").innerHTML="";
  hold("Stuck on a hard account? Start at S. Get to the green square.");
  paint();
};
paint();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-12-maze", DONE="We know our God. He always does what is right.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
</body>
</html>
