<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Review — Three Questions</title>
<style>
  :root{--ink:#1a2236}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e7eef6;color:var(--ink)}
  .wrap{max-width:860px;margin:0 auto;padding:14px 12px 36px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#667085;font-weight:700;margin-bottom:10px}
  .hold{min-height:50px;background:#fff8df;border:1px solid #efd27b;border-radius:14px;padding:10px;font-weight:800;text-align:center;margin-bottom:12px}
  .bins{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .bin{background:#fff;border:3px dashed #c9a227;border-radius:16px;min-height:180px;padding:8px}
  .bin h3{margin:0 0 8px;font-size:13px}
  .in{background:#e7f8ee;border-radius:10px;padding:6px 8px;margin:4px 0;font-weight:800;font-size:12px}
  .cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .card{background:#fffaf0;border:2px solid #e3d2a8;border-radius:14px;padding:10px 12px;font-weight:800;max-width:100%}
  .card.sel{outline:3px solid #6d5dfc}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#efeaff;color:#4c43b8;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <h1>Review — How Would You Answer</h1>
  <div class="sub">Tap a card, then tap the question it answers. No junk — just sort.</div>
  <div class="hold" id="hold">Three questions. Nine answers.</div>
  <div class="bins">
    <div class="bin" data-b="0"><h3>Why know Jehovah well?</h3><div id="b0"></div></div>
    <div class="bin" data-b="1"><h3>How do we teach what he is like?</h3><div id="b1"></div></div>
    <div class="bin" data-b="2"><h3>How do we put knowledge to work?</h3><div id="b2"></div></div>
  </div>
  <div class="cards" id="cards"></div>
  <button class="reset" id="reset">Reset</button>
</div>
<script>
const CARDS=[
  {t:"So they can love him (Mark 12:30)",b:0,why:"Love is why they must know him well."},
  {t:"Love moves them to obey and stick",b:0,why:"That is still why they must know him well."},
  {t:"Then they can make decisions that please him",b:0,why:"Knowing him well helps them decide."},
  {t:"Ask questions, as Jehovah did with Job",b:1,why:"That is how we teach what he is like."},
  {t:"Use the Enjoy Life Forever! questions",b:1,why:"Those questions teach his personality."},
  {t:"Read looking for Jehovah’s qualities",b:1,why:"Not only the human in the story."},
  {t:"Recall what you know when an account is hard",b:2,why:"That puts knowledge to work."},
  {t:"Look at good qualities when someone is hard to get along with",b:2,why:"That puts knowledge to work."},
  {t:"Ask what would please Jehovah — like Jesus",b:2,why:"That puts knowledge to work."}
];
let sel=null, locked=false, put=[];
function hold(m){document.getElementById("hold").textContent=m}
function mix(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
function paint(){
  [0,1,2].forEach(i=>{
    document.getElementById("b"+i).innerHTML=put.filter(x=>x.b===i).map(x=>'<div class="in">'+x.t+"</div>").join("");
  });
  const left=mix(CARDS.filter(x=>!put.includes(x)));
  document.getElementById("cards").innerHTML=left.map(x=>'<button class="card" data-t="'+x.t+'">'+x.t+"</button>").join("");
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>{
    if(locked) return;
    sel=CARDS.find(x=>x.t===b.dataset.t);
    document.querySelectorAll(".card").forEach(x=>x.classList.toggle("sel",x===b));
    hold("Drop it in a question bin.");
  });
}
document.querySelectorAll(".bin").forEach(bin=>bin.onclick=()=>{
  if(!sel||locked) return;
  const i=+bin.dataset.b;
  locked=true;
  if(sel.b===i){
    hold(sel.why);
    put.push(sel); sel=null;
    setTimeout(()=>{
      locked=false; paint();
      if(put.length===9) hold("All three questions answered — without typing a word.");
    },1600);
  } else {
    hold("That answers a different question.");
    setTimeout(()=>{locked=false},1600);
  }
});
document.getElementById("reset").onclick=()=>{sel=null; locked=false; put=[]; hold("Three questions. Nine answers."); paint()};
paint();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-19-review", DONE="All three questions answered — without typing a word.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
</body>
</html>
