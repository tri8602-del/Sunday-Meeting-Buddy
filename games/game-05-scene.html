<title>Game 5 — Hidden Scene</title>
<style>
  :root{--ink:#1a2236;--muted:#667085}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e7eef6;color:var(--ink)}
  .wrap{max-width:900px;margin:0 auto;padding:14px 12px 36px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-weight:700;margin-bottom:10px}
  .hold{min-height:52px;background:#fff8df;border:1px solid #efd27b;border-radius:14px;padding:10px;font-weight:800;text-align:center;margin-bottom:10px}
  .need{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
  .need span{background:#fff;border:1px solid #d5dceb;border-radius:999px;padding:6px 10px;font-weight:800;font-size:13px}
  .need span.got{background:#e7f8ee;border-color:#49b877}
  .scene{position:relative;width:100%;aspect-ratio:3/2;border-radius:16px;overflow:hidden;border:2px solid #d7deea;background:#fff}
  .scene img{width:100%;height:100%;object-fit:cover;display:block}
  .hot{position:absolute;border:3px solid transparent;border-radius:18px;background:transparent}
  .hot.found{border-color:#1f9d5b;background:rgba(31,157,91,.18)}
  .hot.nope{animation:shake .4s;border-color:#d24b4b;background:rgba(210,75,75,.15)}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .love{left:2%;top:34%;width:26%;height:62%}
  .obey{left:28%;top:26%;width:22%;height:48%}
  .stick{left:52%;top:36%;width:20%;height:30%}
  .jesus{left:72%;top:10%;width:26%;height:36%}
  .prize{left:22%;top:68%;width:16%;height:28%}
  .fear{left:54%;top:66%;width:24%;height:32%}
  .hurry{left:78%;top:48%;width:20%;height:30%}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#efeaff;color:#4c43b8;font-weight:900}
</style>
</head>

<div class="wrap">

document.getElementById("pic").src=PIC;
const GOOD={
  love:{label:"love", why:"Love — that hug is how it starts."},
  obey:{label:"obey", why:"Obey — he is doing what he was asked."},
  stick:{label:"stick", why:"Stick — she stayed when she could have left."},
  jesus:{label:"doing what the Father said", why:"Jesus did what the Father said."}
};
const BAD={
  prize:{why:"Leave the prize. We do not obey for a trophy."},
  fear:{why:"Leave fear. Love is the reason, not being scared."},
  hurry:{why:"Leave hurry. Knowing Jehovah is not a stopwatch."}
};
let found=[], locked=false;
function hold(m){document.getElementById("hold").textContent=m}
function paintNeed(){
  document.getElementById("need").innerHTML=Object.keys(GOOD).map(k=>{
    const g=found.includes(k)?"got":"";
    return "<span class='"+g+"'>"+GOOD[k].label+"</span>";
  }).join("");
}
document.querySelectorAll(".hot").forEach(h=>h.onclick=()=>{
  if(locked) return;
  const id=h.dataset.id;
  if(GOOD[id]){
    if(found.includes(id)) return;
    locked=true;
    h.classList.add("found");
    found.push(id);
    hold(GOOD[id].why);
    setTimeout(()=>{
      locked=false; paintNeed();
      if(found.length===4) hold("Yes. Love, obey, stick — like Jesus doing what the Father said.");
    },1600);
  } else {
    locked=true;
    h.classList.add("nope");
    hold(BAD[id].why);
    setTimeout(()=>{locked=false; h.classList.remove("nope")},1600);
  }
});
document.getElementById("reset").onclick=()=>{
  found=[]; locked=false;
  document.querySelectorAll(".hot").forEach(h=>h.classList.remove("found","nope"));
  hold("Find love, obey, stick, and doing what the Father said.");
  paintNeed();
};
paintNeed();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-05-scene", DONE="Yes. Love, obey, stick — like Jesus doing what the Father said.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
