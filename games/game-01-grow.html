<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game 1 — Grow</title>
<style>
  :root{--ink:#1a2236;--muted:#667085;--line:#d7deea}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f8;color:var(--ink)}
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--muted);font-weight:700;margin-bottom:14px}
  .stage{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .pic{width:min(240px,58vw);aspect-ratio:2/3;object-fit:cover;object-position:50% 12%;border-radius:18px;border:3px solid #ead9a8;box-shadow:0 12px 28px rgba(40,30,10,.14);background:#f6efe4}
  .cap{font-weight:900;color:#7a5a00}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
  .tile{border:2px solid #d5dceb;background:#fff;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer}
  .tile.bad{animation:kick .45s}
  @keyframes kick{0%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(8px)}100%{transform:translateX(0)}}
  .hold{min-height:52px;background:#fff8df;border:1px solid #efd27b;border-radius:14px;padding:10px 12px;font-weight:800;text-align:center;width:100%}
  .thanks{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .thanks button{min-height:56px;border-radius:14px;border:2px solid #d5dceb;background:#fff;font-weight:900;cursor:pointer}
  .thanks button.ok{background:#e7f8ee;border-color:#49b877}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#efeaff;color:#4c43b8;font-weight:900;cursor:pointer}
  .note{font-size:13px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Game 1 — Grow</h1>
  <div class="sub">One file. Pictures are inside this page.</div>
  <div class="stage">
    <img class="pic" id="pic" alt="girl">
    <div class="cap" id="cap">A little girl</div>
    <div class="hold" id="hold">Feed a real step. Junk gets kicked back.</div>
    <div class="tiles" id="tiles"></div>
    <div class="thanks" id="thanks" hidden></div>
  </div>
  <button class="reset" id="reset">Reset</button>
  <p class="note">Four real steps age the same girl. Then thank Jehovah.</p>
</div>

const CAPS=['A little girl','First meeting','Comments','Shares her faith','Dedicated to Jehovah'];
const GOOD=[
  {t:'First meeting',why:'That is step one in the paragraph.'},
  {t:'Comments',why:'Then she begins to comment.'},
  {t:'Shares her faith',why:'Then she shares what she is learning.'},
  {t:'Dedicates herself to Jehovah',why:'Later she belongs to Jehovah.'}
];
const BAD=[
  {t:'Baptized week one',why:'The paragraph does not skip to the end.'},
  {t:'Liked a video',why:'That is not one of the steps.'},
  {t:'The teacher did it',why:'Jehovah gets the credit, not the teacher.'}
];
let stage=0, used=[], locked=false;
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
function hold(msg){document.getElementById('hold').textContent=msg}
function paint(){
  document.getElementById('pic').src=PICS[Math.min(3,stage)];
  document.getElementById('cap').textContent=CAPS[stage];
  const tiles=document.getElementById('tiles');
  const box=document.getElementById('thanks');
  if(stage>=4){
    tiles.innerHTML='';
    box.hidden=false;
    box.innerHTML='<button data-who="Jehovah">Jehovah</button><button data-who="teacher">The teacher</button><button data-who="book">The book</button><button data-who="luck">Luck</button>';
    hold('She grew. Who do we thank?');
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      if(b.dataset.who==='Jehovah'){b.classList.add('ok');hold('Yes. Jehovah gets the credit.');}
      else hold('Nice people help. The thank-you still goes to Jehovah.');
    });
    return;
  }
  box.hidden=true; box.innerHTML='';
  const pool=shuffle([...GOOD,...BAD]).filter(x=>!used.includes(x.t));
  tiles.innerHTML=pool.map(x=>'<button class="tile" data-t="'+x.t+'">'+x.t+'</button>').join('');
  tiles.querySelectorAll('.tile').forEach(btn=>{
    btn.onclick=()=>{
      if(locked) return;
      const item=[...GOOD,...BAD].find(x=>x.t===btn.dataset.t);
      const ok=GOOD.some(x=>x.t===item.t);
      locked=true;
      if(ok){
        hold(item.why);
        used.push(item.t);
        setTimeout(()=>{stage++; locked=false; paint()},1800);
      } else {
        btn.classList.add('bad');
        hold(item.why);
        setTimeout(()=>{locked=false; btn.classList.remove('bad')},1800);
      }
    };
  });
}
document.getElementById('reset').onclick=()=>{stage=0;used=[];locked=false;hold('Feed a real step. Junk gets kicked back.');paint()};
paint();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-01-grow", DONE="Yes. Jehovah gets the credit.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
