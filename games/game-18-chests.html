<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game 18 — Chests</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#241a12;color:#f7f1dc}
  .wrap{max-width:860px;margin:0 auto;padding:14px 12px 36px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#cbb98a;font-weight:700;margin-bottom:10px}
  .hold{min-height:54px;background:#3a2f12;border:1px solid #c9a227;border-radius:14px;padding:10px;font-weight:800;text-align:center;margin-bottom:12px;color:#ffe9a0}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .chest{position:relative;height:190px;cursor:pointer}
  .lid,.box{position:absolute;left:8%;right:8%;background:linear-gradient(#b6792c,#7a4a14);border:4px solid #e2b84a;box-shadow:inset 0 8px 0 rgba(255,220,120,.25)}
  .lid{top:18px;height:46px;border-radius:18px 18px 6px 6px;transform-origin:bottom center;transition:transform .6s}
  .chest.open .lid{transform:rotateX(-70deg) translateY(-8px)}
  .box{top:58px;bottom:8px;border-radius:6px 6px 14px 14px;display:flex;align-items:flex-end;justify-content:center;padding:8px}
  .holes{position:absolute;left:0;right:0;top:72px;display:flex;justify-content:center;gap:18px;z-index:2}
  .hole{width:16px;height:22px;background:#1a1208;border-radius:4px 4px 8px 8px;border:2px solid #c9a227}
  .chest.open .holes{display:none}
  .loot{display:none;font-size:28px;line-height:1}
  .chest.open .loot{display:block}
  .chest.ready .lid,.chest.ready .box{box-shadow:0 0 16px rgba(255,220,120,.45), inset 0 8px 0 rgba(255,220,120,.25)}
  .verse{font-size:11px;font-weight:800;color:#fff8d6;text-align:center;min-height:32px}
  .keys{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
  .key{
    width:150px;min-height:64px;border:0;background:transparent;color:#1a2236;font-weight:800;font-size:11px;
    padding:0 8px 0 36px;text-align:left;position:relative;filter:drop-shadow(0 2px 0 #8a7014);
  }
  .key:before{
    content:"";position:absolute;left:0;top:12px;width:28px;height:28px;border:5px solid #e2b84a;
    border-radius:50%;background:#f3e2a8;box-shadow:inset 0 0 0 6px #241a12;
  }
  .key:after{
    content:"";position:absolute;left:26px;top:24px;width:118px;height:8px;background:#e2b84a;
    clip-path:polygon(0 0,78% 0,78% 100%,70% 100%,70% 180%,62% 180%,62% 100%,54% 100%,54% 160%,46% 160%,46% 100%,0 100%);
  }
  .key span{position:relative;z-index:1;background:#f3e2a8;border-radius:8px;padding:6px 8px;display:inline-block}
  .key.sel span{outline:3px solid #fff}
  .key.gone{visibility:hidden}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#3a2f12;color:#ffe9a0;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <h1>Game 18 — Chests</h1>
  <div class="sub">Two keys each. Left to right.</div>
  <div class="hold" id="hold">Tap two keys, then tap the glowing chest.</div>
  <div class="row" id="row"></div>
  <div class="keys" id="keys"></div>
  <button class="reset" id="reset">Reset</button>
</div>
<script>
const CHESTS=[
  {need:["happiest life today","Psalm 25"], name:"Now",
   why:"Even now — the happiest life possible today.",
   verse:"“Who is the man who fears Jehovah? He will instruct him.” — Psalm 25:12"},
  {need:["eternal life","1 John 5:20"], name:"Later",
   why:"Later — eternal life for those who know the one who is true.",
   verse:"“This is the true God and life everlasting.” — 1 John 5:20"},
  {need:["known by him","1 Corinthians 8:3"], name:"Known by him",
   why:"Those who love him are known by him.",
   verse:"“If anyone loves God, this one is known by him.” — 1 Corinthians 8:3"}
];
const KEYS=["happiest life today","Psalm 25","eternal life","1 John 5:20","known by him","1 Corinthians 8:3","famous","rich","first in line","everybody notices me"];
const JUNK=["famous","rich","first in line","everybody notices me"];
function mix(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
let sel=[], used=[], opened=0, locked=false, order=mix(KEYS);
function hold(m){document.getElementById("hold").textContent=m}
function paintChests(){
  document.getElementById("row").innerHTML=CHESTS.map((ch,i)=>`
    <div class="chest ${i===opened?"ready":""} ${i<opened?"open":""}" data-i="${i}">
      <div class="lid"></div>
      <div class="holes"><div class="hole"></div><div class="hole"></div></div>
      <div class="box"><div class="loot">💎👑✨</div></div>
      <div class="verse">${i<opened?ch.verse:""}</div>
    </div>`).join("");
  document.querySelectorAll(".chest").forEach(el=>el.onclick=()=>tryChest(+el.dataset.i));
}
function paintKeys(){
  document.getElementById("keys").innerHTML=order.map(t=>`
    <button class="key ${used.includes(t)?"gone":""} ${sel.includes(t)?"sel":""}" data-t="${t}"><span>${t}</span></button>
  `).join("");
  document.querySelectorAll(".key").forEach(b=>b.onclick=()=>{
    if(locked||used.includes(b.dataset.t)) return;
    const t=b.dataset.t;
    if(sel.includes(t)) sel=sel.filter(x=>x!==t);
    else if(sel.length<2) sel.push(t);
    hold(sel.length===2?"Now tap the glowing chest.":"Tap two keys.");
    paintKeys();
  });
}
function tryChest(i){
  if(locked) return;
  if(i!==opened){ hold(i<opened?"That chest is already open.":"Open them in order — left to right."); return; }
  if(sel.length!==2){ hold("Pick two keys first."); return; }
  const need=CHESTS[i].need.slice().sort().join("|");
  const got=sel.slice().sort().join("|");
  locked=true;
  if(got===need){
    used.push(...sel); sel=[]; opened++;
    hold(CHESTS[i-1<0?0:i].why);
    hold(CHESTS[opened-1].why+" "+CHESTS[opened-1].verse);
    setTimeout(()=>{
      locked=false; paintChests(); paintKeys();
      if(opened===3) hold("Almighty God notices us and calls us friends.");
    },2000);
  } else {
    hold(sel.some(t=>JUNK.includes(t))?"That is not the blessing in this paragraph.":"Those two keys do not belong on this chest.");
    sel=[];
    setTimeout(()=>{locked=false; paintKeys();},1600);
  }
}
document.getElementById("reset").onclick=()=>{
  sel=[]; used=[]; opened=0; locked=false; order=mix(KEYS);
  hold("Tap two keys, then tap the glowing chest.");
  paintChests(); paintKeys();
};
paintChests(); paintKeys();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-18-chests", DONE="Almighty God notices us and calls us friends.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
</body>
</html>
