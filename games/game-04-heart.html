<style>
  :root{--ink:#1a2236;--muted:#667085}
  *{box-sizing:border-box}

  .wrap{max-width:720px;margin:0 auto;padding:14px 12px 36px}

  .hot{position:absolute;border-radius:50%;border:3px dashed transparent;background:transparent}
  .hot.on{border-color:#6d5dfc;background:rgba(109,93,252,.18);box-shadow:0 0 0 8px rgba(109,93,252,.12)}

  .hot .tag{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#1f9d5b;color:#fff;font-weight:900;padding:4px 8px;border-radius:999px;font-size:12px;white-space:nowrap}
  .hot.lit .tag{display:block}
  .mind{left:32%;top:3%;width:36%;height:22%}
  .heart{left:38%;top:28%;width:26%;height:16%}

  .soul{left:18%;top:2%;width:64%;height:92%;border-radius:28px;z-index:1}
  .mind,.heart,.strength{z-index:2}
  .words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .word{background:#fff;border:2px solid #d5dceb;border-radius:14px;padding:10px 12px;font-weight:800}
  .word.sel{outline:3px solid #6d5dfc}
  .word.gone{display:none}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#efeaff;color:#4c43b8;font-weight:900}

<div class="wrap">
  <h1>Game 4 — Whole Heart</h1>
  <div class="sub">Tap a word, then tap the matching part.</div>
  <div class="verse">“…you must love Jehovah your God with your whole heart and with your whole soul and with your whole mind and with your whole strength.”<small>Mark 12:30</small></div>
  <div class="hold" id="hold">Four real parts. Junk gets kicked back.</div>
  <div class="stage">
    <img id="girl" alt="girl">
    <button class="hot soul" data-part="soul"><span class="tag">soul</span></button>
    <button class="hot mind" data-part="mind"><span class="tag">mind</span></button>
    <button class="hot heart" data-part="heart"><span class="tag">heart</span></button>
    <button class="hot strength" data-part="strength"><span class="tag">strength</span></button>
  </div>
  <div class="words" id="words"></div>
  <button class="reset" id="reset">Reset</button>
</div>

document.getElementById("girl").src=PIC;
const REAL={
  heart:{why:"Heart — that is the chest, the love you feel."},
  soul:{why:"Soul — that is the whole person. All of her."},
  mind:{why:"Mind — that is the head, the thinking."},
  strength:{why:"Strength — that is the muscle, the work you put in."}
};
const JUNK={
  speed:"Speed is not in Mark 12:30.",
  "being right":"Being right is not one of the four.",
  "impressing people":"Impressing people is not how we love Jehovah.",
  "finishing the book":"Finishing the book is not in the verse."
};
let sel=null, locked=false, lit=[];
function hold(m){document.getElementById("hold").textContent=m}
function mix(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
function paintWords(){
  const all=[...Object.keys(REAL),...Object.keys(JUNK)].filter(t=>!lit.includes(t));
  document.getElementById("words").innerHTML=mix(all).map(t=>'<button class="word" data-t="'+t+'">'+t+"</button>").join("");
  document.querySelectorAll(".word").forEach(b=>b.onclick=()=>{
    if(locked) return;
    sel=b.dataset.t;
    document.querySelectorAll(".word").forEach(x=>x.classList.toggle("sel",x===b));
    document.querySelectorAll(".hot").forEach(h=>h.classList.toggle("on", !h.classList.contains("lit")));
    hold("Now tap the matching part.");
  });
}
document.querySelectorAll(".hot").forEach(h=>h.onclick=()=>{
  if(!sel||locked) return;
  locked=true;
  const part=h.dataset.part;
  if(REAL[sel] && sel===part){
    hold(REAL[sel].why);
    h.classList.add("lit"); h.classList.remove("on");
    lit.push(sel); sel=null;
    setTimeout(()=>{
      locked=false; paintWords();
      document.querySelectorAll(".hot").forEach(x=>x.classList.remove("on"));
      if(lit.length===4) hold("Yes. Whole heart, soul, mind, and strength.");
    },1800);
  } else if(JUNK[sel]){
    hold(JUNK[sel]);
    setTimeout(()=>{locked=false},1800);
  } else {
    hold("That word is in the verse, but that is the wrong part.");
    setTimeout(()=>{locked=false},1800);
  }
});
document.getElementById("reset").onclick=()=>{
  sel=null; locked=false; lit=[];
  document.querySelectorAll(".hot").forEach(h=>h.classList.remove("lit","on"));
  hold("Four real parts. Junk gets kicked back.");
  paintWords();
};
paintWords();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-04-heart", DONE="Yes. Whole heart, soul, mind, and strength.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
