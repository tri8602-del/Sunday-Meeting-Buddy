<title>Game 3 — Paradise</title>
<style>
  :root{--ink:#1a2236;--muted:#667085}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e7eef6;color:var(--ink)}
  .wrap{max-width:860px;margin:0 auto;padding:14px 12px 36px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-weight:700;margin-bottom:12px}

  .slots{display:grid;gap:8px}
  .slot{min-height:64px;border-radius:16px;border:3px dashed #c9a227;background:#fffaf0;padding:10px;font-weight:800;display:flex;align-items:center;gap:8px}
  .slot.full{border-style:solid;background:#e7f8ee}
  .num{width:28px;height:28px;border-radius:50%;background:#c9a227;color:#fff;display:grid;place-items:center;flex:0 0 auto}
  .cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .card{background:#fff;border:2px solid #d5dceb;border-radius:14px;padding:11px 12px;font-weight:800;cursor:pointer}
  .card.sel{outline:3px solid #6d5dfc}
  .colorPane{display:none;background:#fff;border-radius:18px;padding:10px;border:1px solid #d7deea}
  .colorPane.show{display:block}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .tools input[type=color]{width:56px;height:40px;border:0;background:none}
  .tools button{border:1px solid #d5dceb;background:#f6f7fb;border-radius:10px;padding:8px 10px;font-weight:800}
  .tools button.on{background:#efeaff;border-color:#6d5dfc}
  .stage{position:relative;width:100%;aspect-ratio:3/2;border-radius:12px;overflow:hidden;border:1px solid #d7deea;background:#fff;touch-action:none}
  .stage canvas,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .stage img{pointer-events:none}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#efeaff;color:#4c43b8;font-weight:900}
</style>

<body>
<div class="wrap">
  <h1>Game 3 — Paradise</h1>
  <div class="sub">Three questions, then color under the lines.</div>
  <div class="hold" id="hold">Which three questions does this article ask? Put them in order.</div>
  <div id="ask">
    <div class="slots">
      <div class="slot" data-slot="0"><span class="num">1</span><span class="lab">Question one</span></div>
      <div class="slot" data-slot="1"><span class="num">2</span><span class="lab">Question two</span></div>
      <div class="slot" data-slot="2"><span class="num">3</span><span class="lab">Question three</span></div>
    </div>
    <div class="cards" id="cards"></div>
  </div>
  <div class="colorPane" id="colorPane">
    <div class="tools">
      <input id="col" type="color" value="#7bc67e">
      <button data-tool="paint" class="on">Crayon</button>
      <button data-tool="erase">Eraser</button>
      <button data-sz="10">Thin</button>
      <button data-sz="22" class="on">Med</button>
      <button data-sz="40">Thick</button>
      <button id="clear">Clear color</button>
    </div>
    <div class="stage">
      <canvas id="cv"></canvas>
      <img id="lines" alt="paradise lines">
    </div>
  </div>
  <button class="reset" id="reset">Reset</button>
</div>

const REAL=["Why do Bible students need to get to know Jehovah well?","How can we teach them what Jehovah is like?","How can we help them put their knowledge to work?"];
const WHY=["That is the first question in the article.","That is the second question — what Jehovah is like.","That is the third — put knowledge to work."];
const JUNK=["What time is the song?","How many stars can I get?","How do I win?","Who is talking next?","What color is the songbook?"];
let sel=null, locked=false, placed=["","",""], tool="paint", sz=22, drawing=false;
document.getElementById("lines").src=LINES;
function hold(m){document.getElementById("hold").textContent=m}
function mix(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
function paintCards(){
  const used=placed.filter(Boolean);
  const left=mix([...REAL,...JUNK]).filter(t=>!used.includes(t));
  document.getElementById("cards").innerHTML=left.map(t=>'<button class="card" data-t="'+t+'">'+t+"</button>").join("");
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>{
    if(locked) return;
    sel=b.dataset.t;
    document.querySelectorAll(".card").forEach(x=>x.classList.toggle("sel",x===b));
    hold("Drop it on a numbered slot.");
  });
}
function paintSlots(){
  document.querySelectorAll(".slot").forEach(s=>{
    const i=+s.dataset.slot;
    s.classList.toggle("full",!!placed[i]);
    s.querySelector(".lab").textContent=placed[i]||("Question "+["one","two","three"][i]);
  });
}
document.querySelectorAll(".slot").forEach(s=>s.onclick=()=>{
  if(!sel||locked) return;
  const i=+s.dataset.slot;
  locked=true;
  if(sel===REAL[i]){
    hold(WHY[i]); placed[i]=sel; sel=null;
    setTimeout(()=>{
      locked=false; paintSlots(); paintCards();
      if(placed.every(Boolean)){
        document.getElementById("ask").style.display="none";
        document.getElementById("colorPane").classList.add("show");
        hold("Yay — those are the three questions to help your student get into paradise!");
        sizeCanvas();
      }
    },1800);
  } else if(REAL.includes(sel)){
    hold("Right question — wrong order.");
    setTimeout(()=>{locked=false},1800);
  } else {
    hold("That is not one of this article’s questions.");
    setTimeout(()=>{locked=false},1800);
  }
});
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
function sizeCanvas(){
  const r=cv.getBoundingClientRect();
  cv.width=Math.max(300,r.width*2);
  cv.height=Math.max(200,r.height*2);
}
function pos(e){
  const r=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return [(t.clientX-r.left)*cv.width/r.width,(t.clientY-r.top)*cv.height/r.height];
}
function start(e){e.preventDefault(); drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p[0],p[1]); stroke(p)}
function move(e){if(!drawing) return; e.preventDefault(); stroke(pos(e))}
function end(){drawing=false}
function stroke(p){
  ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=sz*(cv.width/420);
  if(tool==="erase"){ctx.globalCompositeOperation="destination-out"; ctx.strokeStyle="#000"}
  else {ctx.globalCompositeOperation="source-over"; ctx.strokeStyle=document.getElementById("col").value}
  ctx.lineTo(p[0],p[1]); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p[0],p[1]);
}
cv.addEventListener("pointerdown",start); cv.addEventListener("pointermove",move); window.addEventListener("pointerup",end);
cv.addEventListener("touchstart",start,{passive:false}); cv.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",end);
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x===b))});
document.querySelectorAll("[data-sz]").forEach(b=>b.onclick=()=>{sz=+b.dataset.sz;document.querySelectorAll("[data-sz]").forEach(x=>x.classList.toggle("on",x===b))});
document.getElementById("clear").onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);
document.getElementById("reset").onclick=()=>{
  sel=null; locked=false; placed=["","",""];
  document.getElementById("ask").style.display="";
  document.getElementById("colorPane").classList.remove("show");
  ctx.clearRect(0,0,cv.width,cv.height);
  hold("Which three questions does this article ask? Put them in order.");
  paintSlots(); paintCards();
};
paintCards();
</script>

  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
