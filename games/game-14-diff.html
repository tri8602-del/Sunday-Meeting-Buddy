document.querySelector("#R img").src=R;
const SPOTS=[{id:"face",l:"8%",t:"34%",w:"22%",h:"34%",why:'She is looking at good qualities now — a smile, not a scowl.'},{id:"together",l:"24%",t:"36%",w:"20%",h:"32%",why:'They sat together. Unity matters to Jehovah.'},{id:"bible",l:"3%",t:"68%",w:"16%",h:"22%",why:'The Bible is open.'},{id:"verse",l:"3%",t:"3%",w:"28%",h:"26%",why:'John 3:16 — look at the sacrifice Jehovah made.'},{id:"hand",l:"0%",t:"50%",w:"12%",h:"18%",why:'Someone is helping.'},{id:"child",l:"48%",t:"38%",w:"10%",h:"28%",why:'The hello is answered.'},{id:"door",l:"58%",t:"20%",w:"20%",h:"42%",why:'He came in to help, not walk out.'},{id:"light",l:"52%",t:"6%",w:"22%",h:"22%",why:'The room feels different when we look for good.'},{id:"picture",l:"80%",t:"8%",w:"16%",h:"22%",why:'Even the picture on the wall changed.'},{id:"arms",l:"8%",t:"48%",w:"14%",h:"20%",why:'Arms open, not crossed.'}];
let got=[], locked=false;
function hold(m){document.getElementById("hold").textContent=m}
function paint(){
  ["L","R"].forEach(side=>{
    const box=document.getElementById(side);
    box.querySelectorAll(".hot").forEach(h=>h.remove());
    SPOTS.forEach(s=>{
      const b=document.createElement("button");
      b.className="hot"+(got.includes(s.id)?" got":"");
      b.style.left=s.l; b.style.top=s.t; b.style.width=s.w; b.style.height=s.h;
      b.onclick=()=>{
        if(locked||got.includes(s.id)) return;
        got.push(s.id); locked=true; hold(s.why);
        setTimeout(()=>{
          locked=false; paint();
          if(got.length===10) hold("10 / 10. Jehovah is pleased when we look at good qualities, not faults.");
          else hold(got.length+" / 10 — "+s.why);
        },1400);
      };
      box.appendChild(b);
    });
  });
}
document.getElementById("reset").onclick=()=>{got=[]; hold("0 / 10"); paint()};
paint();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-14-diff", DONE="10 / 10. Jehovah is pleased when we look at good qualities, not faults.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
