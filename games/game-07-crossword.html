<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game 7 — Crossword</title>
<style>
  :root{--ink:#1a2236;--muted:#667085}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e7eef6;color:var(--ink)}
  .wrap{max-width:860px;margin:0 auto;padding:14px 12px 36px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-weight:700;margin-bottom:10px}
  .hold{min-height:50px;background:#fff8df;border:1px solid #efd27b;border-radius:14px;padding:10px;font-weight:800;text-align:center;margin-bottom:10px}
  .board{display:grid;grid-template-columns:repeat(11,26px);gap:2px;justify-content:center;margin:8px 0 12px}
  .cell{width:26px;height:26px;background:#fff;border:1px solid #c5cdd8;border-radius:4px;display:grid;place-items:center;font-weight:900;font-size:13px;position:relative}
  .cell.blk{background:transparent;border-color:transparent}
  .cell.on{outline:2px solid #6d5dfc;background:#efeaff}
  .cell.ok{background:#e7f8ee}
  .num{position:absolute;top:1px;left:2px;font-size:8px;color:#6d5dfc;font-weight:800}
  .clues{display:grid;gap:6px;margin-bottom:10px}
  .clue{text-align:left;background:#fff;border:1px solid #d5dceb;border-radius:12px;padding:8px 10px;font-weight:700;font-size:13px}
  .clue.on{outline:2px solid #6d5dfc;background:#efeaff}
  .clue.done{background:#e7f8ee}
  .bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .bank button{width:36px;height:36px;border-radius:10px;border:1px solid #d5dceb;background:#fff;font-weight:900}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#efeaff;color:#4c43b8;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <h1>Game 7 — Crossword</h1>
  <div class="sub">Tap a clue, then tap letters.</div>
  <div class="hold" id="hold">Joseph knew Jehovah. Fill the words from the paragraph.</div>
  <div class="board" id="board"></div>
  <div class="clues" id="clues"></div>
  <div class="bank" id="bank"></div>
  <button class="reset" id="reset">Reset</button>
</div>
<script>
const ROWS=13, COLS=11;
const WORDS=[
  {id:1,w:"JOSEPH",r:0,c:5,dir:"down",clue:"1 Down. He knew Jehovah well and would not sin against God."},
  {id:2,w:"KNOW",r:1,c:3,dir:"across",clue:"2 Across. Students who ___ Jehovah well can do the same."},
  {id:3,w:"SARAH",r:4,c:1,dir:"down",clue:"3 Down. Abraham’s wife — an account Joseph heard as a child."},
  {id:4,w:"ABRAHAM",r:5,c:1,dir:"across",clue:"4 Across. Account he heard: ___ and Sarah."},
  {id:5,w:"MARRIAGE",r:5,c:7,dir:"down",clue:"5 Down. From those accounts he could tell how Jehovah views ___."},
  {id:6,w:"ADAM",r:6,c:7,dir:"across",clue:"6 Across. Account from childhood: ___ and Eve."},
  {id:7,w:"HURT",r:8,c:1,dir:"across",clue:"7 Across. He knew what would ___ God."},
  {id:8,w:"GOD",r:11,c:7,dir:"across",clue:"8 Across. He would not sin against ___."},
  {id:9,w:"EVE",r:12,c:5,dir:"across",clue:"9 Across. Adam and ___."}
];
function cellsOf(w){
  return w.w.split("").map((_,i)=>({r:w.r+(w.dir==="down"?i:0), c:w.c+(w.dir==="across"?i:0), ch:w.w[i]}));
}
const used={};
WORDS.forEach(w=>cellsOf(w).forEach(p=>{
  const k=p.r+","+p.c;
  if(used[k] && used[k]!==p.ch) console.error("conflict",k,used[k],p.ch,w.w);
  used[k]=p.ch;
}));
let sel=WORDS[0], filled={}, locked=false;
function hold(m){document.getElementById("hold").textContent=m}
function key(r,c){return r+","+c}
function wordDone(w){return cellsOf(w).every(p=>filled[key(p.r,p.c)]===p.ch)}
function paint(){
  const on=new Set(cellsOf(sel).map(p=>key(p.r,p.c)));
  let html="";
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const k=key(r,c), letter=used[k];
      if(!letter){html+='<div class="cell blk"></div>'; continue}
      const num=WORDS.find(w=>w.r===r && w.c===c);
      const cls=["cell"];
      if(on.has(k)) cls.push("on");
      if(filled[k]) cls.push("ok");
      html+='<div class="'+cls.join(" ")+'">'+(num?'<span class="num">'+num.id+"</span>":"")+(filled[k]||"")+"</div>";
    }
  }
  document.getElementById("board").innerHTML=html;
  document.getElementById("clues").innerHTML=WORDS.map(w=>{
    const cls=["clue"]; if(w===sel) cls.push("on"); if(wordDone(w)) cls.push("done");
    return '<button class="'+cls.join(" ")+'" data-id="'+w.id+'">'+w.clue+"</button>";
  }).join("");
  document.querySelectorAll(".clue").forEach(b=>b.onclick=()=>{
    sel=WORDS.find(w=>w.id===+b.dataset.id);
    hold(sel.clue);
    paint();
  });
}
document.getElementById("bank").innerHTML="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(ch=>'<button data-ch="'+ch+'">'+ch+"</button>").join("");
document.getElementById("bank").onclick=e=>{
  const ch=e.target.dataset.ch; if(!ch||locked) return;
  const next=cellsOf(sel).find(p=>!filled[key(p.r,p.c)]);
  if(!next){ hold("That word is full. Pick another clue."); return; }
  if(ch===next.ch){
    filled[key(next.r,next.c)]=ch;
    hold("Yes.");
    paint();
    if(WORDS.every(wordDone)) hold("Joseph knew Jehovah — so he made the right choice.");
  } else {
    locked=true;
    hold("Not that letter. Look back at the paragraph clue.");
    setTimeout(()=>{locked=false},1600);
  }
};
document.getElementById("reset").onclick=()=>{filled={}; sel=WORDS[0]; hold("Joseph knew Jehovah. Fill the words from the paragraph."); paint()};
paint();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-07-crossword", DONE="Joseph knew Jehovah — so he made the right choice.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
</body>
</html>
