<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game 6 — Cockpit</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#141c2b;color:#e8eef8}
  .wrap{max-width:820px;margin:0 auto;padding:14px 12px 36px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#9aa6bc;font-weight:700;margin-bottom:10px}
  .hold{min-height:52px;background:#2a2410;border:1px solid #c9a227;border-radius:14px;padding:10px;font-weight:800;text-align:center;margin-bottom:12px;color:#ffe9a0}
  .panel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .gauge{
    position:relative;aspect-ratio:1;border-radius:50%;
    background:
      radial-gradient(circle at 50% 54%,#0c121c 0 46%,transparent 47%),
      repeating-conic-gradient(from -120deg,#d7deea 0 2deg,transparent 2deg 12deg);
    background-color:#1b2436;
    border:8px solid #3d4a63;
    box-shadow:inset 0 0 0 10px #0e141f;
  }
  .gauge.lit{border-color:#49b877;box-shadow:inset 0 0 0 10px #0e141f,0 0 16px rgba(73,184,119,.45)}
  .needle{position:absolute;left:50%;top:18%;width:4px;height:34%;background:#e85d4c;transform-origin:bottom center;border-radius:2px;transform:translateX(-50%) rotate(-30deg)}
  .gauge.lit .needle{transform:translateX(-50%) rotate(40deg);background:#49b877}
  .hub{position:absolute;left:50%;top:52%;width:14px;height:14px;background:#c9d2ea;border-radius:50%;transform:translate(-50%,-50%)}
  .gtitle{position:absolute;left:10%;right:10%;bottom:18%;text-align:center;font-weight:900;font-size:13px;min-height:32px;color:#b7f5d0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .chip{background:#2a3350;color:#e8eef8;border:2px solid #6b778f;border-radius:14px;padding:10px 12px;font-weight:800}
  .chip.sel{outline:3px solid #6d5dfc}
  .skyPick{display:none;position:relative;min-height:260px;border-radius:18px;overflow:hidden;background:linear-gradient(#7ec8ff 0 70%,#cfeab0 70%)}
  .skyPick.show{display:block}
  .cloudBtn{
    position:absolute;border:0;color:#1a2236;font-weight:900;padding:18px 22px;cursor:pointer;
    background:#fff;border-radius:50px;
    box-shadow:18px 10px 0 #fff, -20px 8px 0 #fff, 0 16px 0 #fff, 28px -6px 0 #eef6ff;
  }
  .c1{left:8%;top:18%} .c2{left:36%;top:48%} .c3{left:56%;top:12%}
  .fly{display:none;position:relative;height:260px;border-radius:16px;overflow:hidden;background:linear-gradient(#7ec8ff 0 78%,#c4b280 78% 82%,#6b8f4e 82%);touch-action:none}
  .runway{display:none;position:absolute;left:0;right:0;bottom:12%;height:10px;background:repeating-linear-gradient(90deg,#d7deea 0 18px,#3d4a63 18px 28px);z-index:1}
  .fly.landed .runway{display:block}
  .plane.land{transition:top .9s ease, left 1.1s ease; left:62% !important}
  .fly.show{display:block}
  .hint{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:22px;color:#1a2236;text-align:center;padding:16px;background:rgba(255,255,255,.45);z-index:3}
  .plane{position:absolute;left:28px;top:40%;width:52px;height:24px;z-index:2}
  .plane .body{width:46px;height:16px;background:#6d5dfc;border-radius:8px 16px 10px 8px;position:absolute;top:4px}
  .plane .wing{position:absolute;left:12px;top:0;width:22px;height:8px;background:#4c43b8;border-radius:4px}
  .plane .tail{position:absolute;left:2px;top:-4px;width:8px;height:14px;background:#4c43b8;border-radius:2px}
  .gate{position:absolute;width:34px;background:#2f9d5a;border:2px solid #1f7a46;z-index:1}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#2a3350;color:#c9d2ea;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <h1>Game 6 — Cockpit</h1>
  <div class="sub">Title the gauges. Then pick a cloud. Then tap the sky to fly.</div>
  <div class="hold" id="hold">Tap a name, then tap an empty gauge.</div>
  <div id="step1">
    <div class="panel">
      <div class="gauge" data-g="0"><div class="needle"></div><div class="hub"></div><div class="gtitle"></div></div>
      <div class="gauge" data-g="1"><div class="needle"></div><div class="hub"></div><div class="gtitle"></div></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="skyPick" id="skyPick">
    <button class="cloudBtn c1" data-t="Most popular">Most popular</button>
    <button class="cloudBtn c2" data-t="Matches Scripture">Matches Scripture</button>
    <button class="cloudBtn c3" data-t="Fastest route">Fastest route</button>
  </div>
  <div class="fly" id="fly">
    <div class="hint" id="hint">TAP THE SKY<br>to keep the plane up</div>
    <div class="runway" id="runway"></div>
    <div class="plane" id="plane"><div class="tail"></div><div class="wing"></div><div class="body"></div></div>
  </div>
  <button class="reset" id="retry" hidden>Fly again</button>
  <button class="reset" id="reset">Reset all</button>
</div>
<script>
const NAMES=[
  {t:"Study",ok:1,why:"Study belongs on a gauge."},
  {t:"Hours in the cockpit",ok:1,why:"Hours in the cockpit belongs on a gauge."},
  {t:"Exam only",ok:0,why:"An exam alone does not teach him to fly."},
  {t:"Regulations only",ok:0,why:"Rules on paper are not hours in the air."}
];
const WX={
  "Matches Scripture":{ok:1,why:"Safe weather. Tap the sky to take off."},
  "Fastest route":{ok:0,why:"Fastest is not the wise choice."},
  "Most popular":{ok:0,why:"Popular is not the same as Scriptural."}
};
let sel=null, locked=false, titles=["",""], flying=false, raf=0;
function hold(m){document.getElementById("hold").textContent=m}
function mix(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
function paintChips(){
  const used=titles.filter(Boolean);
  const left=mix(NAMES).filter(x=>!used.includes(x.t));
  document.getElementById("chips").innerHTML=left.map(x=>'<button class="chip" data-t="'+x.t+'">'+x.t+"</button>").join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    if(locked) return;
    sel=b.dataset.t;
    document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x===b));
    hold("Now tap a gauge.");
  });
}
document.querySelectorAll(".gauge").forEach(g=>g.onclick=()=>{
  if(!sel||locked) return;
  const i=+g.dataset.g;
  if(titles[i]) return;
  const it=NAMES.find(x=>x.t===sel);
  locked=true; hold(it.why);
  if(it.ok){
    titles[i]=sel; sel=null;
    g.classList.add("lit");
    g.querySelector(".gtitle").textContent=it.t;
    setTimeout(()=>{
      locked=false; paintChips();
      if(titles[0]&&titles[1]){
        document.getElementById("step1").style.display="none";
        document.getElementById("skyPick").classList.add("show");
        hold("Tap the cloud that is the wise weather.");
      }
    },1600);
  } else setTimeout(()=>{locked=false},1600);
});
document.querySelectorAll(".cloudBtn").forEach(b=>b.onclick=()=>{
  if(locked) return;
  const it=WX[b.dataset.t];
  locked=true; hold(it.why);
  if(it.ok) setTimeout(()=>{locked=false; startFly()},1600);
  else setTimeout(()=>{locked=false},1600);
});
function startFly(){
  document.getElementById("retry").hidden=true;
  document.getElementById("fly").classList.remove("landed");
  document.getElementById("plane").classList.remove("land");
  document.getElementById("plane").style.left="28px";
  document.getElementById("skyPick").classList.remove("show");
  const sky=document.getElementById("fly");
  sky.classList.add("show");
  document.getElementById("hint").style.display="";
  document.getElementById("plane").style.top="40%";
  hold("Tap the blue sky. The plane hops up. Pass 4 green gates.");
  const plane=document.getElementById("plane");
  const hint=document.getElementById("hint");
  const H=sky.clientHeight, W=sky.clientWidth;
  let y=H*0.42, v=0, passed=0, started=false, dead=false;
  sky.querySelectorAll(".gate").forEach(g=>g.remove());
  const gates=[];
  for(let i=0;i<4;i++){
    const gap=100, top=36+Math.random()*60;
    const a=document.createElement("div"); a.className="gate"; a.style.left=(W+80+i*200)+"px"; a.style.top="0"; a.style.height=top+"px";
    const b=document.createElement("div"); b.className="gate"; b.style.left=(W+80+i*200)+"px"; b.style.bottom="0"; b.style.height=(H-top-gap)+"px";
    sky.appendChild(a); sky.appendChild(b);
    gates.push({a,b,x:W+80+i*200, scored:false, top, gap});
  }
  function flap(){
    if(dead) return;
    if(!started){ started=true; hint.style.display="none"; flying=true; raf=requestAnimationFrame(tick); }
    v=-3.6;
  }
  sky.onpointerdown=function(e){e.preventDefault(); flap()};
  function tick(){
    if(!flying) return;
    v+=0.16; y+=v;
    if(y<0){y=0;v=0}
    if(y>H-26){crash(); return}
    plane.style.top=y+"px";
    gates.forEach(function(g){
      g.x-=2.1; g.a.style.left=g.x+"px"; g.b.style.left=g.x+"px";
      if(!g.scored && g.x+34<28){ g.scored=true; passed++; hold("Gate "+passed+" of 4 — keep tapping"); if(passed>=4) land(); }
      var hitX=28<g.x+34 && 80>g.x;
      var hitY=y<g.top || y+24>g.top+g.gap;
      if(hitX && hitY) crash();
    });
    if(flying) raf=requestAnimationFrame(tick);
  }
  function crash(){ flying=false; dead=true; hold("The plane dropped. Tap Fly again."); document.getElementById("retry").hidden=false; }
  function land(){
    flying=false; dead=true;
    sky.classList.add("landed");
    plane.classList.add("land");
    plane.style.top=(H-40)+"px";
    hold("Look — she landed. Now he can decide in any circumstance.");
    document.getElementById("retry").hidden=false;
  }
}
document.getElementById("retry").onclick=function(){ cancelAnimationFrame(raf); flying=false; startFly(); };
document.getElementById("reset").onclick=function(){
  cancelAnimationFrame(raf); flying=false; sel=null; locked=false; titles=["",""];
  document.getElementById("step1").style.display="";
  document.getElementById("skyPick").classList.remove("show");
  var sky=document.getElementById("fly");
  sky.classList.remove("show");
  sky.querySelectorAll(".gate").forEach(function(g){g.remove()});
  document.getElementById("hint").style.display="";
  document.querySelectorAll(".gauge").forEach(function(g){g.classList.remove("lit"); g.querySelector(".gtitle").textContent=""});
  document.getElementById("retry").hidden=true;
  hold("Tap a name, then tap an empty gauge.");
  paintChips();
};
paintChips();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-06-cockpit", DONE="Look — she landed. Now he can decide in any circumstance.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
</body>
</html>
