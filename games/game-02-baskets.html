<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game 2 — Baskets</title>
<style>
  :root{--ink:#1a2236;--muted:#667085}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e7eef6;color:var(--ink)}
  .wrap{max-width:820px;margin:0 auto;padding:14px 12px 36px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-weight:700;margin-bottom:12px}
  .hold{min-height:54px;background:#fff8df;border:1px solid #efd27b;border-radius:14px;padding:10px 12px;font-weight:800;text-align:center;margin-bottom:12px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .basket{
    position:relative;min-height:240px;padding:52px 10px 22px;
    border-radius:12px 12px 80px 80px;
    background:
      repeating-linear-gradient(90deg,#c48a4a 0 10px,#a86e32 10px 12px),
      repeating-linear-gradient(#d19a55 0 8px,#b57a38 8px 10px);
    background-blend-mode:multiply;
    box-shadow:inset 0 14px 0 rgba(255,255,255,.12),0 12px 18px rgba(70,40,10,.22);
    color:#fff8e8;
  }
  .basket:before{
    content:"";position:absolute;left:14%;right:14%;top:8px;height:28px;
    border:5px solid #8a5a28;border-bottom:0;border-radius:22px 22px 0 0;
  }
  .basket h3{margin:0 0 8px;text-align:center;font-size:14px;text-shadow:0 1px 0 #6b3f16}
  .yarns-in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .yarn{
    width:86px;min-height:86px;border-radius:50%;border:0;cursor:pointer;
    color:#1a2236;font-weight:800;font-size:11px;line-height:1.15;padding:10px;
    box-shadow:inset -8px -8px 0 rgba(0,0,0,.08),0 4px 0 rgba(0,0,0,.12);
    background:
      radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 36%),
      repeating-radial-gradient(circle at 40% 40%,var(--c1) 0 7px,var(--c2) 7px 10px);
  }
  .yarn.sel{outline:4px solid #6d5dfc;transform:scale(1.06)}
  .yarn.tiny{width:64px;min-height:64px;font-size:9px;cursor:default}
  .pile{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .doorWrap{margin-top:16px;display:none;text-align:center}
  .doorWrap.show{display:block}
  .scene{width:min(260px,80vw);height:280px;margin:0 auto;position:relative;perspective:700px}
  .behind{position:absolute;inset:18px 22px 8px 18px;border-radius:12px;background:linear-gradient(#9ad0ff,#c8f0b0 55%,#ffe9a0);display:grid;place-items:center;padding:12px;font-weight:900;color:#1a3a20;opacity:0;transition:opacity .4s .2s}
  .behind.show{opacity:1}
  .leaf{position:absolute;inset:0;border-radius:16px 16px 6px 6px;background:linear-gradient(#c9a227,#8a7014);border:6px solid #6b5410;box-shadow:inset 0 0 0 8px #e8c85a;display:grid;place-items:center;color:#fff8d6;font-weight:900;font-size:18px;transform-origin:left center;transition:transform .85s ease}
  .leaf.open{transform:rotateY(-72deg)}
  .yay{margin-top:10px;font-weight:900;font-size:18px;color:#1f7a46;min-height:28px}
  .reset{margin-top:14px;width:100%;min-height:44px;border:0;border-radius:12px;background:#efeaff;color:#4c43b8;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <h1>Game 2 — Baskets</h1>
  <div class="sub">Tap a yarn ball, then tap a basket.</div>
  <div class="hold" id="hold">Jehovah’s will — or not?</div>
  <div class="row">
    <div class="basket" id="willB"><h3>Jehovah’s will</h3><div class="yarns-in" id="willIn"></div></div>
    <div class="basket" id="noB"><h3>Not Jehovah’s will</h3><div class="yarns-in" id="noIn"></div></div>
  </div>
  <div class="pile" id="pile"></div>
  <div class="doorWrap" id="doorWrap">
    <div class="scene">
      <div class="behind" id="behind">☀️ 🌿 🐑<br>Everlasting life</div>
      <div class="leaf" id="leaf">Tap to open</div>
    </div>
    <div class="yay" id="yay"></div>
  </div>
  <button class="reset" id="reset">Reset</button>
</div>
<script>
const COLORS=[["#f97316","#fb923c"],["#22c55e","#86efac"],["#3b82f6","#93c5fd"],["#eab308","#fde047"],["#ec4899","#f9a8d4"],["#8b5cf6","#c4b5fd"],["#14b8a6","#99f6e4"],["#ef4444","#fca5a5"],["#0ea5e9","#7dd3fc"],["#a3e635","#d9f99d"],["#f59e0b","#fcd34d"]];
const WILL=[
  {t:"All sorts of people",why:"Jehovah wants all sorts of people."},
  {t:"Be saved",why:"His will is that they be saved."},
  {t:"Know Jehovah",why:"He wants them to know him."},
  {t:"Know his purposes",why:"And his purposes, as fully as possible."},
  {t:"Changes how you live",why:"Accurate knowledge has its full effect."},
  {t:"Everlasting life",why:"That knowledge opens everlasting life."}
];
const NO=[
  {t:"Only one kind of person",why:"That is not Jehovah’s will. He said all sorts of people."},
  {t:"Memorize the most verses",why:"That is not Jehovah’s will. A pile of facts is not the point."},
  {t:"Win a quiz",why:"That is not Jehovah’s will."},
  {t:"Make the teacher proud",why:"That is not Jehovah’s will."},
  {t:"Trivia about kings",why:"That is not Jehovah’s will."}
];
let sel=null, locked=false, willGot=[], noGot=[], colorOf={};
[...WILL,...NO].forEach((x,i)=>colorOf[x.t]=COLORS[i%COLORS.length]);
function hold(m){document.getElementById("hold").textContent=m}
function mix(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
function yarn(t,tiny){
  const c=colorOf[t];
  return '<button class="yarn '+(tiny?"tiny":"")+'" data-t="'+t+'" style="--c1:'+c[0]+';--c2:'+c[1]+'">'+t+"</button>";
}
function isWill(t){return WILL.some(x=>x.t===t)}
function why(t){return [...WILL,...NO].find(x=>x.t===t).why}
function paintBins(){
  document.getElementById("willIn").innerHTML=willGot.map(t=>yarn(t,true)).join("");
  document.getElementById("noIn").innerHTML=noGot.map(t=>yarn(t,true)).join("");
}
function paintPile(){
  const left=mix([...WILL,...NO]).filter(x=>!willGot.includes(x.t)&&!noGot.includes(x.t));
  document.getElementById("pile").innerHTML=left.map(x=>yarn(x.t,false)).join("");
  document.querySelectorAll("#pile .yarn").forEach(b=>b.onclick=()=>{
    if(locked) return;
    sel=b.dataset.t;
    document.querySelectorAll("#pile .yarn").forEach(x=>x.classList.toggle("sel",x===b));
    hold("Drop it in a basket.");
  });
}
function maybeDoor(){
  if(willGot.length===WILL.length){
    document.getElementById("doorWrap").classList.add("show");
    hold("The door is ready. Tap it.");
  }
}
function drop(intoWill){
  if(!sel||locked) return;
  const right=(intoWill && isWill(sel)) || (!intoWill && !isWill(sel));
  locked=true;
  if(right){
    hold(why(sel));
    if(intoWill) willGot.push(sel); else noGot.push(sel);
    sel=null;
    setTimeout(()=>{locked=false; paintBins(); paintPile(); maybeDoor()},1800);
  } else {
    hold(intoWill?"That ball does not belong in Jehovah’s will.":"That one is Jehovah’s will. Put it in the other basket.");
    setTimeout(()=>{locked=false},1800);
  }
}
document.getElementById("willB").onclick=()=>drop(true);
document.getElementById("noB").onclick=()=>drop(false);
document.getElementById("leaf").onclick=()=>{
  if(willGot.length<WILL.length) return;
  document.getElementById("leaf").classList.add("open");
  document.getElementById("behind").classList.add("show");
  document.getElementById("yay").textContent="Yay! You know the steps to everlasting life.";
  hold("Accurate knowledge opens everlasting life.");
};
document.getElementById("reset").onclick=()=>{
  sel=null; locked=false; willGot=[]; noGot=[];
  document.getElementById("doorWrap").classList.remove("show");
  document.getElementById("leaf").classList.remove("open");
  document.getElementById("behind").classList.remove("show");
  document.getElementById("yay").textContent="";
  hold("Jehovah’s will — or not?");
  paintBins(); paintPile();
};
paintPile();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-02-baskets", DONE="Accurate knowledge opens everlasting life.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
</body>
</html>
