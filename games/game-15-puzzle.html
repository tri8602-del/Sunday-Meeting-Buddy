let order=[], sel=null;
function hold(m){document.getElementById("hold").textContent=m}
function shuffle(){
  order=TILES.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]}

}

    if(sel===null){ sel=i; paint(); hold("Tap the piece to swap with."); return; }
    if(sel===i){ sel=null; paint(); return; }
    const t=order[sel]; order[sel]=order[i]; order[i]=t; sel=null; paint();
    if(order.every((v,idx)=>v===idx)) hold("We can make Jehovah happy when we make the right decision.");
    else hold("Keep swapping.");
  });
}
document.getElementById("reset").onclick=()=>{sel=null; shuffle(); hold("Put the picture back together."); paint()};
shuffle(); paint();
</script>
<!-- SMB-GLUE: Sunday Meeting Buddy integration only (not part of the game). When this game shows its own finish message, tell the app once so it can award the star. Does nothing when opened on its own. -->
<script>
(function(){
  var GAME="game-15-puzzle", DONE="We can make Jehovah happy when we make the right decision.";
  if(window.parent===window) return;
  var el=document.getElementById('hold'), sent=false;
  if(!el) return;
  function check(){
    if(sent||el.textContent.trim().indexOf(DONE)!==0) return;
    sent=true;
    setTimeout(function(){try{window.parent.postMessage({type:'smb-game-complete',game:GAME},'*')}catch(e){}},1200);
  }
  new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
  check();
})();
</script>
<!-- /SMB-GLUE -->
