.timerCard{position:sticky;top:74px;align-self:start}.timer{font-variant-numeric:tabular-nums;font-size:2.8rem;font-weight:900;margin:5px 0}.timer.ready{color:var(--good)}.timerLabel{font-weight:800;color:var(--muted)}.sideTools{display:grid;gap:9px;margin-top:15px}.sideTools button{width:100%;text-align:left}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}.nextnote{color:var(--muted);font-size:.9rem}
.talkGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.talkPrompt{display:grid;gap:8px}.talkPrompt textarea{min-height:110px;resize:vertical}.talkPrompt h3{margin:0}.bonus{background:#fff9e8;border:1px solid #f1dda4;border-radius:14px;padding:12px;font-weight:800;color:#7b5a00}.lock{text-align:center;padding:30px 10px}.lock .big{font-size:3.5rem}
.drawOverlay{position:fixed;inset:0;background:rgba(15,20,35,.55);z-index:100;display:none;padding:12px}.drawOverlay.open{display:flex;align-items:center;justify-content:center}.drawPanel{background:#fff;width:min(1000px,100%);height:min(90vh,850px);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}.drawHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}.drawTools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.drawTools button,.drawTools input{height:38px}.swatch{width:30px;height:30px;border-radius:50%;border:2px solid #ddd;padding:0}.drawCanvasWrap{flex:1;background:#fff;touch-action:none;overflow:hidden}#drawCanvas{width:100%;height:100%;display:block;touch-action:none;background:#fff}.drawFoot{padding:9px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e2535;color:#fff;padding:10px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:150}.toast.show{opacity:1}.testbar{background:#fff4d7;border-bottom:1px solid #f0db9a;padding:7px 12px;text-align:center;font-size:.82rem;font-weight:850;color:#765400}.finish{text-align:center;padding:50px 20px}.bigstars{font-size:3rem;letter-spacing:5px}.finishStats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.stat{background:#f4f6fa;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800}
@media(max-width:850px){.grid{grid-template-columns:1fr}.timerCard{position:static;order:-1}.talkGrid{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:12px 10px 28px}.card{padding:15px;border-radius:15px}.bottom{align-items:stretch;flex-direction:column}.bottom .primary{width:100%}.top{padding:9px 11px}.brand{font-size:.95rem}.toolBtn{padding:8px 9px}.stars{padding:6px 9px}.drawPanel{height:94vh}}
</style></head><body>
<div id="app" class="app"><section class="card hero" style="margin:20px 16px"><div class="eyebrow">Sunday Meeting</div><h1>Sunday Meeting Buddy 🌿</h1><p>Loading…</p></section></div>
<div id="drawOverlay" class="drawOverlay"><div class="drawPanel"><div class="drawHead"><strong>✏️ Drawing</strong><div class="drawTools"><button class="secondary" id="undoDraw">↩️ Undo</button><button class="secondary" id="redoDraw">↪️ Redo</button><button class="secondary" id="clearDraw">Clear</button><button class="primary" id="saveDraw">Save Image</button><button class="ghost" id="closeDraw">✕</button></div></div><div class="drawTools" style="padding:8px 14px;border-bottom:1px solid var(--line)"><span style="font-weight:800">Pen</span><button class="swatch" style="background:#182033" data-color="#182033"></button><button class="swatch" style="background:#6d5dfc" data-color="#6d5dfc"></button><button class="swatch" style="background:#d95555" data-color="#d95555"></button><button class="swatch" style="background:#2e9b62" data-color="#2e9b62"></button><button class="swatch" style="background:#f4b942" data-color="#f4b942"></button><label style="display:flex;align-items:center;gap:6px">Size <input id="penSize" type="range" min="2" max="24" value="5"></label></div><div class="drawCanvasWrap"><canvas id="drawCanvas"></canvas></div><div class="drawFoot"><span class="source">Draw anytime. Your current sketch is saved on this device.</span><button class="secondary" id="newDraw">New Drawing</button></div></div></div>

<script>
const WT='w_E_202607.pdf';
const SONGS='sjjsm_E.pdf';
const paras=[
[1,14,'We can get to know Jehovah—not merely by learning facts about him, but by learning what he is like and how he feels.','Think of knowing Jehovah like knowing a person, not just knowing facts about them. We want to learn what makes him happy and what kind of person he is.','What does it mean to come to know Jehovah?',['Knowing facts about Jehovah','Knowing the Person behind the name','Only knowing his name']],
[2,14,'Those who dedicate themselves to Jehovah never stop coming to know him. There is always more to learn about what makes him happy and how to deepen our trust in him.','Even if you have known about Jehovah for a long time, you can keep learning more about him.','What is something we can keep doing no matter how long we have served Jehovah?',['Keep getting to know Jehovah','Stop studying once we know the basics','Only learn things that help us at school']],
[3,14,'The article considers three questions: What does it mean to come to know Jehovah? Why should we continue to get to know him better? And how do we get to know him better?','This study answers three big questions about knowing Jehovah better.','Which three questions does this article discuss?',['What, why, and how','Who, where, and when','When, where, and how long']],
[4,15,'Jeremiah 24:7 shows that coming to know Jehovah involves the heart, including our feelings and motives. Knowing about God is different from knowing the Person behind the name.','Knowing Jehovah is more than memorizing facts. It involves our feelings and motives too.','What part of us is involved in coming to know Jehovah?',['Our heart, including feelings and motives','Only our memory','Only our ability to read']],
[5,15,'Josiah did more than study. He acted on what he learned by upholding justice and defending afflicted and poor people. Jehovah connected those actions with knowing Him.','Josiah showed that he knew Jehovah by putting what he learned into action and treating people fairly.','What did Josiah do with what he learned about Jehovah?',['He acted on it','He kept it secret','He stopped studying']],
[6,15,'The more we come to know Jehovah, the more we come to trust him. Paul’s experiences and what he had learned moved him to trust Jehovah even during his final imprisonment.','Learning about Jehovah and seeing his help can make our trust in him stronger.','What can grow as we come to know Jehovah?',['Trust in him','Fear of learning','Our need to know less']],
[7,16,'After many years, we might focus mostly on how Bible information benefits us or others. The Scriptures also reveal much about their Author, so we should ask what the information tells us about Jehovah.','When we study, we should not only ask, “How does this help me?” We can also ask, “What does this teach me about Jehovah?”','What question should we remember to ask when studying the Bible?',['What does this tell me about Jehovah?','How quickly can I finish?','Can I skip this part?']],
[8,16,'As we get to know Jehovah better, our friendship with him grows stronger. Learning more about him can move us to praise and thank him and deepen our gratitude.','Learning more about Jehovah can make us feel closer to him and more thankful.','What can happen to our friendship with Jehovah as we know him better?',['It can grow stronger','It becomes less important','It disappears']],
[9,16,'Taking notice of Jehovah means remembering what we have learned about him and thinking about how our actions affect him. Like remembering a mate can guide choices, thinking about Jehovah can help us make choices that please him.','Remembering Jehovah and thinking about how our choices affect him can help us make better choices.','How can thinking about Jehovah affect our decisions?',['It can help us make choices that please him','It makes decisions unnecessary','It only helps with schoolwork']],
[10,16,'We are made in Jehovah’s image and can reflect his qualities. Learning his qualities helps us understand how to imitate him, including showing justice, mercy, and faithfulness.','The more we learn about Jehovah’s qualities, the better we can copy those good qualities in our own actions.','What can learning Jehovah’s qualities help us do?',['Imitate those qualities','Ignore them','Only memorize their names']],
[11,16,'People come to know Jehovah in different ways, including through Christian parents, Bible study, and studying Scriptural accounts and creation.','Different people may first learn about Jehovah in different ways, but we can all keep learning about him.','Which is one way a person may first come to know Jehovah?',['Through parents or a Bible study','Only through a school class','Only by traveling']],
[12,17,'We can learn more about Jehovah by reading and studying his Word. Bible accounts can teach us about Jehovah’s qualities when we think about what the events reveal about him.','When you read a Bible story, look for what it teaches you about Jehovah, not just what happened in the story.','What should we look for in Bible accounts?',['What they teach us about Jehovah','Only the number of people involved','Only the location']],
[13,17,'The account involving Ebed-melech shows that we can look for qualities of Jehovah as well as qualities of faithful people. We can identify those qualities and thank and praise Jehovah for them.','A Bible story can teach us about people and about Jehovah. We can look for Jehovah’s qualities and thank him for them.','When reading a Bible account, what can we identify?',['Qualities of Jehovah reflected in the account','Only the hardest word','Only the date']],
[14,17,'We can learn about Jehovah by meditating on his creative works. Simply seeing nature is not enough; we need to think and reason about what creation reveals about its Creator.','Looking at nature can teach us about Jehovah when we stop and think about what we see.','What should we do when observing creation?',['Think about what it reveals about the Creator','Just look without thinking','Ignore small details']],
[15,18,'Patrick observed insects and birds from his city balcony and thought about what their behavior revealed about Jehovah’s care for his creatures.','Even in a city, you can notice little things in nature and think about what they show about Jehovah.','What did Patrick do that helped him learn about Jehovah?',['He observed creation and thought about what it showed','He left the city','He stopped noticing nature']],
[16,18,'Mary meditated on what her experience revealed about Jehovah, including his power, mercy, impartiality, and interest in lowly ones. We can similarly reflect on what our own experiences teach us about Jehovah.','When Jehovah helps us, we can stop and think: “What did this teach me about Jehovah?”','What can we ask ourselves after experiencing Jehovah’s help?',['What did this teach me about Jehovah?','How can I forget it?','Why should I never think about it again?']],
[17,19,'Think of how much more we will learn about Jehovah in the new world. We will receive new scrolls that reveal his requirements, interact more closely with the natural world, and deepen our understanding as we experience new things.','Jehovah will keep teaching us new things. In the new world, we will learn more through new experiences, the natural world, and the blessings we receive.','Why will we keep learning more about Jehovah?',['We will have new things to learn and experience','Because we will forget everything','Because Jehovah will stop teaching us']],
[18,19,'We will never stop getting to know Jehovah. He has lived for an eternity, and his understanding is beyond measure. Regardless of how long we have been serving him, we can keep taking every opportunity to learn more about our loving Father.','We will never reach the end of learning about Jehovah. He knows so much more than we do, so there will always be another chance to learn about our loving Father.','What should we keep doing no matter how long we have served Jehovah?',['Keep looking for opportunities to learn more about him','Decide we already know everything','Stop thinking about Jehovah']],
];
const activities={
1:{type:'mcq',prompt:'What does it mean to come to know Jehovah?',options:['Knowing facts about Jehovah','Knowing the Person behind the name','Only knowing his name'],correct:1},
2:{type:'truefalse',prompt:'We can keep getting to know Jehovah even after serving him for a long time.',correct:true},
3:{type:'mcq',prompt:'Which three questions does this article discuss?',options:['What, why, and how','Who, where, and when','When, where, and how long'],correct:0},
4:{type:'mcq',prompt:'What part of us is involved in coming to know Jehovah?',options:['Our heart, including feelings and motives','Only our memory','Only our ability to read'],correct:0},
5:{type:'truefalse',prompt:'Josiah showed what he learned by acting justly and helping others.',correct:true},
6:{type:'scenario',prompt:'You learn something new about Jehovah and then notice how he helps you. What can grow?',options:['Trust in him','Fear of learning','Our need to know less'],correct:0},
7:{type:'text',prompt:'Finish the thought: When I study the Bible, I can ask, “What does this teach me about Jehovah?”',placeholder:'Type your thought here…'},
8:{type:'match',prompt:'Match each idea with what it can lead to.',pairs:[['Knowing Jehovah better','A stronger friendship'],['Learning about him','More gratitude']]},
9:{type:'mcq',prompt:'How can thinking about Jehovah affect our decisions?',options:['It can help us make choices that please him','It makes decisions unnecessary','It only helps with schoolwork'],correct:0},
10:{type:'order',prompt:'Put these steps in a helpful order.',items:['Learn about Jehovah’s qualities','Notice those qualities','Try to imitate them'],correct:[0,1,2]},
11:{type:'mcq',prompt:'Which is one way a person may first come to know Jehovah?',options:['Through parents or a Bible study','Only through a school class','Only by traveling'],correct:0},
12:{type:'scramble',prompt:'Unscramble this word from the paragraph’s idea:',word:'QUALITIES'},
13:{type:'match',prompt:'Match the reading approach with the result.',pairs:[['Look for Jehovah’s qualities','Praise and thank him'],['Notice faithful people','See qualities reflected in their actions']]},
14:{type:'mcq',prompt:'What should we do when observing creation?',options:['Think about what it reveals about the Creator','Just look without thinking','Ignore small details'],correct:0},
15:{type:'truefalse',prompt:'We can notice things in nature even in a city and think about what they show about Jehovah.',correct:true},
16:{type:'text',prompt:'After experiencing Jehovah’s help, what could you ask yourself?',placeholder:'Type your answer…'},
17:{type:'draw',prompt:'Sketch something from nature that reminds you of Jehovah’s qualities.'},
18:{type:'mcq',prompt:'What should we keep doing no matter how long we have served Jehovah?',options:['Keep looking for opportunities to learn more about him','Decide we already know everything','Stop thinking about Jehovah'],correct:0}
};
const DEFAULT={screen:'setup',talk:'',opening:'',p:0,view:'actual',stars:0,earned:{},activityStars:{},materialAwarded:{},attempts:{},test:false,meetingStarted:null,wtUnlocked:false,talkNotes:{},questionAnswers:{}};
let state={...DEFAULT,earned:{},activityStars:{},materialAwarded:{},attempts:{},talkNotes:{},questionAnswers:{}};
let drawState={color:'#182033',size:5,drawing:null,history:[],redo:[]};
function load(){try{const raw=localStorage.getItem('smb-state-v6');if(raw){const s=JSON.parse(raw);state={...DEFAULT,...s,earned:{...(s.earned||{})},activityStars:{...(s.activityStars||{})},materialAwarded:{...(s.materialAwarded||{})},attempts:{...(s.attempts||{})},talkNotes:{...(s.talkNotes||{})},questionAnswers:{...(s.questionAnswers||{})}}}}catch(e){}}
function save(){try{localStorage.setItem('smb-state-v6',JSON.stringify(state))}catch(e){}}
load();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(ms){let s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function header(){return `<div class="top"><div class="brand">🌿 Sunday Meeting Buddy</div><div class="topActions"><button class="toolBtn" id="drawOpen">✏️ Draw</button><div class="stars">⭐ ${state.stars}</div></div></div>`}
function render(){let c='';if(state.screen==='setup')c=setup();else if(state.screen==='talk')c=talk();else if(state.screen==='transition')c=transition();else if(state.screen==='wt')c=watch();else if(state.screen==='finish')c=finish();document.getElementById('app').innerHTML=header()+(state.test?'<div class="testbar">TEST MODE — timers and the 10:30 lock are bypassed.</div>':'')+`<main class="wrap">${c}</main>`;bind()}
function setup(){return `<section class="card hero"><div class="eyebrow">Sunday Meeting</div><h1>Let’s get ready! 🌿</h1><p>Meeting starts at 10:00. Set up the public talk and opening song.</p><div class="field"><label>Public talk title</label><input id="talk" placeholder="Enter the talk title" value="${esc(state.talk)}"></div><div class="field"><label>Opening song number</label><input id="opening" inputmode="numeric" placeholder="Song number" value="${esc(state.opening)}"></div><label style="display:flex;justify-content:center;align-items:center;gap:8px;margin:16px 0;font-weight:750"><input id="testMode" type="checkbox" ${state.test?'checked':''}> Test mode</label><button class="primary" id="start">START THE MEETING</button></section>`}
function talk(){return `<section class="card"><div class="headerline"><div><div class="eyebrow">Public Talk</div><h1 style="margin:4px 0">${esc(state.talk||'Public Talk')}</h1></div><button class="secondary" onclick="song(${Number(state.opening)||12})">🎵 Opening Song ${esc(state.opening||'')}</button></div><p class="source">No public-talk timer. Listen, think, and use the notes below if they help.</p><div class="talkGrid"><div class="card talkPrompt" style="box-shadow:none"><h3>💡 Something I learned</h3><textarea data-note="learned" placeholder="Type or use dictation…">${esc(state.talkNotes.learned||'')}</textarea></div><div class="card talkPrompt" style="box-shadow:none"><h3>📖 A Bible verse I heard</h3><textarea data-note="verse" placeholder="Type or use dictation…">${esc(state.talkNotes.verse||'')}</textarea></div><div class="card talkPrompt" style="box-shadow:none"><h3>❤️ Something about Jehovah</h3><textarea data-note="jehovah" placeholder="Type or use dictation…">${esc(state.talkNotes.jehovah||'')}</textarea></div><div class="card talkPrompt" style="box-shadow:none"><h3>🤔 Something I want to remember</h3><textarea data-note="remember" placeholder="Type or use dictation…">${esc(state.talkNotes.remember||'')}</textarea></div></div><div class="bonus" style="margin-top:14px">These notes are just for her. No stars and no right or wrong answers.</div><div class="lock"><div><div class="big">⏰</div><strong>Watchtower unlocks at 10:30 AM</strong><p class="source">The next song and Watchtower appear when it is time.</p><button class="primary" id="toTrans">CONTINUE TO WATCHTOWER</button></div></div></section>`}
function transition(){const now=new Date(),u=new Date(now);u.setHours(10,30,0,0);const ready=state.test||state.wtUnlocked||now>=u;return `<section class="card hero"><div class="eyebrow">10:30 AM</div><h1>${ready?'Watchtower Study is ready! 📖':'Almost there… 🔒'}</h1><p>${ready?'Next song:':'The Watchtower portion unlocks at 10:30 AM.'} <strong>Song 28 — Gaining Jehovah’s Friendship</strong></p><button class="secondary" onclick="song(28)">🎵 View Song 28 Lead Sheet</button><br><br><button class="primary" id="beginWT" ${ready?'':'disabled'}>BEGIN WATCHTOWER STUDY</button></section>`}
function watch(){const d=paras[state.p],key=String(d[0]),earned=state.earned[key]||0,inter=state.materialAwarded[key]||0,activityScore=state.activityStars[key],a=activities[d[0]],elapsed=state.meetingStarted?Date.now()-state.meetingStarted:0,remaining=Math.max(0,150000-elapsed),ready=state.test||remaining===0,qa=state.questionAnswers[key]||'';return `<div class="grid"><section class="article"><div class="card"><div class="headerline"><div><div class="eyebrow">Watchtower Study</div><h2>Paragraph ${d[0]} of 18</h2><div class="article-meta">Are You Getting to Know Jehovah Better? · September 21–27, 2026</div></div><div class="pill">⭐ ${earned}/3 earned</div></div><div class="progress" style="margin-top:13px"><div style="width:${(state.p+1)/paras.length*100}%"></div></div></div><div class="card"><div class="toggle"><button id="actual" class="${state.view==='actual'?'active':''}">📖 Actual</button><button id="easy" class="${state.view==='easy'?'active':''}">🧒 Maddy’s words</button></div><div style="margin-top:12px">${state.view==='actual'?`<div class="easy" style="background:#f8fbff"><strong>📖 Paragraph ${d[0]}</strong><br><span class="source">Open the actual published page from the copy stored with the app.</span><div style="margin-top:12px"><button class="secondary" id="openWT">View Watchtower Page</button></div></div>`:`<div class="easy"><strong>In Maddy’s words:</strong><br>${d[3]}</div>`}</div><div class="interaction"><button class="interact ${inter?'used':''}" id="markEasy">🧒 Read Maddy’s version</button><button class="interact ${inter?'used':''}" id="markQuestion">❓ Think about the question</button><button class="interact ${inter?'used':''}" id="markScripture">📜 Explore the scriptures</button><button class="interact ${inter?'used':''}" id="markPage">🖼️ Look at the original page</button></div><div class="question"><strong>Study question</strong>${d[4]}<textarea id="questionAnswer" placeholder="Type your answer…">${esc(qa)}</textarea><button class="secondary" id="saveQuestion" style="margin-top:8px">Save answer</button></div></div>${activityHTML(d[0],a,activityScore)}<div class="bottom"><div class="nextnote">${state.test?'Test mode: advance whenever you want.':ready?'Time is up — unit complete!':'Next unlocks when this unit’s time is up.'}</div><button class="primary" id="next" ${ready?'':'disabled'}>${state.p===paras.length-1?'FINISH STUDY':'NEXT →'}</button></div></section><aside class="card timerCard"><div class="eyebrow">Unit timer</div><div class="timer ${ready?'ready':''}" id="timer">${state.test?'TEST':fmt(remaining)}</div><div class="timerLabel">2:30 default</div><p class="source">The timer controls advancement only. It never hides the material or activities.</p><div class="sideTools"><button class="secondary" onclick="song(12)">🎵 Song 12 Lead Sheet</button><button class="secondary" onclick="song(28)">🎵 Song 28 Lead Sheet</button><button class="toolBtn" id="drawOpenSide">✏️ Open Drawing Canvas</button></div></aside></div>`}
function activityHTML(n,a,score){if(!a)return '';let body='';if(a.type==='mcq'||a.type==='scenario')body=`<div class="answers">${a.options.map((x,i)=>`<button class="answer" data-i="${i}">${x}</button>`).join('')}</div>`;else if(a.type==='truefalse')body=`<div class="answers"><button class="answer" data-b="true">True</button><button class="answer" data-b="false">False</button></div>`;else if(a.type==='text')body=`<textarea id="activityText" class="answerInput" placeholder="${esc(a.placeholder)}" style="min-height:95px"></textarea><button class="secondary" id="submitActivityText" style="margin-top:9px">I’m done</button>`;else if(a.type==='match')body=a.pairs.map((p,i)=>`<div class="matchRow"><strong>${p[0]}</strong><select class="matchSelect" data-match="${i}"><option value="">Choose…</option>${a.pairs.map((q,j)=>`<option value="${j}">${q[1]}</option>`).join('')}</select></div>`).join('')+`<button class="secondary" id="checkMatch" style="margin-top:10px">Check matches</button>`;else if(a.type==='order')body=`<div id="orderList" class="answers">${a.items.map((x,i)=>`<button class="answer orderItem" data-order="${i}">${x}</button>`).join('')}</div><button class="secondary" id="checkOrder" style="margin-top:10px">Check order</button>`;else if(a.type==='scramble')body=`<p><strong>${esc(a.word.split('').sort(()=>Math.random()-.5).join(''))}</strong></p><input id="scrambleInput" class="answerInput" placeholder="Type the word"><button class="secondary" id="checkScramble" style="margin-top:9px">Check</button>`;else if(a.type==='draw')body=`<p>${a.prompt}</p><button class="toolBtn" id="activityDraw">✏️ Open drawing canvas</button><button class="secondary" id="completeDraw" style="margin-left:7px">I’m done</button>`;return `<div class="card activity"><h3>🎮 Think-It-Through</h3><p class="activityIntro">${a.type==='text'||a.type==='draw'?'Think it through, then finish when you’re ready.':'Take your time. First try = 2 stars, second try = 1, after that = 0.'}</p>${body}<div class="feedback" id="feedback"></div><div class="scoreline"><span>Activity: <span class="mini-stars">${score==null?'—':score+' / 2'}</span></span><span>Material: <span class="mini-stars">${state.materialAwarded[String(n)]?'⭐':'—'}</span></span></div></div>`}
function finish(){return `<section class="card finish"><div class="bigstars">🌟🌟🌟</div><div class="eyebrow">Study complete</div><h1>Great job, Maddy!</h1><p>You finished all 18 paragraphs and earned <strong>${state.stars} stars</strong> this session.</p><div class="finishStats"><div class="stat">54 possible stars</div><div class="stat">${Object.values(state.activityStars).reduce((a,b)=>a+b,0)} activity stars</div><div class="stat">${Object.values(state.materialAwarded).reduce((a,b)=>a+b,0)} material stars</div></div><button class="primary" id="restart">START OVER</button></section>`}
function awardMaterial(key){key=String(key);if(!state.materialAwarded[key]){state.materialAwarded[key]=1;state.earned[key]=(state.earned[key]||0)+1;state.stars+=1;save();toast('⭐ Material star earned')}}
function attemptResult(key,correct){key=String(key);if(state.activityStars[key]!==undefined)return;state.attempts[key]=(state.attempts[key]||0)+1;const n=state.attempts[key];if(correct){const score=n===1?2:n===2?1:0;state.activityStars[key]=score;state.earned[key]=(state.earned[key]||0)+score;state.stars+=score;save();render();toast(score?`⭐ ${score} activity star${score===1?'':'s'}`:'Completed — no activity stars this time')}else{save();const f=document.getElementById('feedback');if(f)f.textContent=n===1?'Not quite — try again.':n===2?'Not quite — one more thoughtful try.':'Keep thinking about the material.'}}
function bind(){
 document.getElementById('drawOpen')?.addEventListener('click',openDraw);document.getElementById('drawOpenSide')?.addEventListener('click',openDraw);
 const start=document.getElementById('start');if(start)start.onclick=()=>{state.talk=document.getElementById('talk').value.trim()||'Public Talk';state.opening=document.getElementById('opening').value.trim();state.test=!!document.getElementById('testMode')?.checked;state.screen='talk';state.meetingStarted=Date.now();state.wtUnlocked=false;state.p=0;state.view='actual';state.stars=0;state.earned={};state.activityStars={};state.materialAwarded={};state.attempts={};state.talkNotes={};state.questionAnswers={};save();render()};
 document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{state.talkNotes[t.dataset.note]=t.value;save()});
 const tr=document.getElementById('toTrans');if(tr)tr.onclick=()=>{state.screen='transition';save();render()};
 const bw=document.getElementById('beginWT');if(bw&&!bw.disabled)bw.onclick=()=>{state.wtUnlocked=true;state.screen='wt';state.p=0;state.meetingStarted=Date.now();save();render()};
 if(state.screen==='transition'&&!state.test&&!state.wtUnlocked){const check=()=>{const n=new Date(),u=new Date(n);u.setHours(10,30,0,0);if(n>=u){state.wtUnlocked=true;save();render()}else setTimeout(check,1000)};check()}
 if(state.screen==='wt'&&!state.test){const tick=()=>{const timer=document.getElementById('timer'),next=document.getElementById('next');const elapsed=state.meetingStarted?Date.now()-state.meetingStarted:0,remaining=Math.max(0,150000-elapsed);if(timer)timer.textContent=fmt(remaining);if(remaining===0&&next){next.disabled=false;next.classList.add('ready');const nn=document.querySelector('.nextnote');if(nn)nn.textContent='Time is up — unit complete!'}else setTimeout(tick,1000)};tick()}
 const ow=document.getElementById('openWT');if(ow)ow.onclick=()=>openWatchtowerPage(paras[state.p][1]);
 document.getElementById('actual')?.addEventListener('click',()=>{state.view='actual';save();render()});document.getElementById('easy')?.addEventListener('click',()=>{state.view='easy';awardMaterial(paras[state.p][0]);save();render()});
 ['markEasy','markQuestion','markScripture','markPage'].forEach(id=>document.getElementById(id)?.addEventListener('click',()=>{awardMaterial(paras[state.p][0]);save();render()}));
 document.getElementById('saveQuestion')?.addEventListener('click',()=>{const k=String(paras[state.p][0]);state.questionAnswers[k]=document.getElementById('questionAnswer').value.trim();if(state.questionAnswers[k])awardMaterial(k);save();render()});
 document.querySelectorAll('.answer').forEach(x=>x.onclick=()=>{const a=activities[paras[state.p][0]],k=String(paras[state.p][0]);if(a.type==='truefalse')attemptResult(k,String(x.dataset.b)===(a.correct?'true':'false'));else if(a.type==='mcq'||a.type==='scenario'){document.querySelectorAll('.answer').forEach(b=>b.disabled=true);const i=Number(x.dataset.i);if(i===a.correct){x.classList.add('correct');attemptResult(k,true)}else{x.classList.add('wrong');attemptResult(k,false);document.querySelectorAll('.answer').forEach(b=>b.disabled=false)}}});
 document.getElementById('submitActivityText')?.addEventListener('click',()=>{const v=document.getElementById('activityText').value.trim();if(v.length>=3)attemptResult(String(paras[state.p][0]),true);else toast('Add a little more first.')});
 document.querySelectorAll('.orderItem').forEach(b=>b.onclick=()=>{document.getElementById('orderList').appendChild(b)});document.getElementById('checkOrder')?.addEventListener('click',()=>{const seq=[...document.querySelectorAll('.orderItem')].map(x=>Number(x.dataset.order));attemptResult(String(paras[state.p][0]),JSON.stringify(seq)===JSON.stringify(activities[paras[state.p][0]].correct))});
 document.getElementById('checkScramble')?.addEventListener('click',()=>{const v=document.getElementById('scrambleInput').value.trim().toUpperCase();attemptResult(String(paras[state.p][0]),v===activities[paras[state.p][0]].word.toUpperCase())});
 document.getElementById('checkMatch')?.addEventListener('click',()=>{const sels=[...document.querySelectorAll('.matchSelect')].map(x=>x.value);attemptResult(String(paras[state.p][0]),sels.every((v,i)=>v!==''&&Number(v)===i))});
 document.getElementById('activityDraw')?.addEventListener('click',openDraw);document.getElementById('completeDraw')?.addEventListener('click',()=>{if(canvasHasInk())attemptResult(String(paras[state.p][0]),true);else toast('Draw something first.')});
 const n=document.getElementById('next');if(n)n.onclick=()=>advance();const r=document.getElementById('restart');if(r)r.onclick=()=>{state={...DEFAULT,screen:'setup'};save();render()};
}
function advance(){if(state.p===paras.length-1)state.screen='finish';else{state.p++;state.view='actual';state.meetingStarted=Date.now()}save();render()}
function songPage(n){const map={12:14,28:36,141:209};return map[n]||null}
function song(n){const page=songPage(n);window.open(`${SONGS}${page?'#page='+page:''}`,'_blank','noopener');if(!page)toast(`Opening the lead-sheet PDF. Find song ${n} there.`)}
function openWatchtowerPage(page){window.open(`${WT}#page=${page}`,'_blank','noopener')}
let canvas,ctx,drawing=false,lastX=0,lastY=0;
function openDraw(){document.getElementById('drawOverlay').classList.add('open');setupCanvas()}
function closeDraw(){document.getElementById('drawOverlay').classList.remove('open');saveDrawing()}
function setupCanvas(){canvas=document.getElementById('drawCanvas');if(!canvas)return;const r=canvas.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);if(canvas.width!==Math.round(r.width*dpr)||canvas.height!==Math.round(r.height*dpr)){const old=canvas.toDataURL();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';if(drawState.drawing)restoreDrawing(drawState.drawing);else if(old&&old!=='data:,'){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}}else if(!ctx){ctx=canvas.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';if(drawState.drawing)restoreDrawing(drawState.drawing)}canvas.onpointerdown=e=>{drawing=true;const p=pos(e);lastX=p.x;lastY=p.y;saveHistory()};canvas.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle=drawState.color;ctx.lineWidth=drawState.size;ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y};canvas.onpointerup=()=>{drawing=false;saveDrawing()};canvas.onpointercancel=()=>drawing=false}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function saveHistory(){if(!canvas)return;drawState.history.push(canvas.toDataURL('image/png'));if(drawState.history.length>15)drawState.history.shift();drawState.redo=[]}
function saveDrawing(){if(canvas){drawState.drawing=canvas.toDataURL('image/png');try{localStorage.setItem('smb-drawing-v6',drawState.drawing)}catch(e){}}}
function restoreDrawing(data){if(!canvas||!ctx)return;const im=new Image();im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);const r=canvas.getBoundingClientRect();ctx.drawImage(im,0,0,r.width,r.height)};im.src=data}
function clearDraw(){if(!canvas)return;saveHistory();const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);saveDrawing()}
function undoDraw(){if(!canvas||!drawState.history.length)return;drawState.redo.push(canvas.toDataURL('image/png'));const d=drawState.history.pop();restoreDrawing(d);drawState.drawing=d}
function redoDraw(){if(!canvas||!drawState.redo.length)return;drawState.history.push(canvas.toDataURL('image/png'));const d=drawState.redo.pop();restoreDrawing(d);drawState.drawing=d}
function canvasHasInk(){if(!canvas||!ctx)return false;const r=canvas.getBoundingClientRect();const w=Math.max(1,Math.floor(r.width)),h=Math.max(1,Math.floor(r.height));const temp=document.createElement('canvas');temp.width=w;temp.height=h;const tc=temp.getContext('2d');tc.drawImage(canvas,0,0,w,h);const data=tc.getImageData(0,0,w,h).data;for(let i=3;i<data.length;i+=4)if(data[i]>10)return true;return false}
function saveImage(){if(!canvas)return;const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=`maddy-drawing-${new Date().toISOString().slice(0,10)}.png`;a.click();toast('Saved image')}
function initDrawing(){try{drawState.drawing=localStorage.getItem('smb-drawing-v6')||null}catch(e){}document.getElementById('closeDraw').onclick=closeDraw;document.getElementById('undoDraw').onclick=undoDraw;document.getElementById('redoDraw').onclick=redoDraw;document.getElementById('clearDraw').onclick=clearDraw;document.getElementById('saveDraw').onclick=saveImage;document.getElementById('newDraw').onclick=()=>{if(confirm('Start a new drawing?')){clearDraw();drawState.history=[];drawState.redo=[]}};document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>drawState.color=b.dataset.color);document.getElementById('penSize').oninput=e=>drawState.size=Number(e.target.value);window.addEventListener('resize',()=>{if(document.getElementById('drawOverlay').classList.contains('open'))setupCanvas()})}
initDrawing();render();
if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
