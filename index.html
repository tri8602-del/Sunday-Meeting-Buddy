<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meeting Buddy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sunday Meeting Buddy</title>
<style>
:root{--bg:#eef1f8;--card:#fff;--ink:#1a2236;--muted:#667085;--accent:#6d5dfc;--gold:#e8b423;--good:#1f9d5b;--bad:#d24b4b;--line:#d7deea;--soft:#f3efff;--yellow:#fff4c4}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{overscroll-behavior:none}
button,input,textarea{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.app{height:100dvh;display:flex;flex-direction:column;min-height:100vh}
.top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);z-index:20}
.brand{font-weight:900;font-size:15px;white-space:nowrap}
.top .grow{flex:1}
.chip,.toolBtn,.stars{border-radius:999px;padding:7px 10px;font-weight:800;font-size:13px;border:1px solid #ddd8ff;background:#f3f1ff;color:#4c43b8}
.stars{background:#fff6d8;border-color:#efd27b;color:#7a5a00}
.timerChip{font-variant-numeric:tabular-nums;background:#e9f8ef;border-color:#bfe8cf;color:#1f7a46}
.timerChip.ready{background:#efeaff;border-color:#c9c2ff;color:var(--accent)}
.testBanner{background:#fff3cc;text-align:center;padding:5px;font-weight:800;font-size:12px;color:#775600}
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px;gap:8px}
.hero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 16px;text-align:center;margin:auto;width:min(560px,100%)}
.hero h1{font-size:30px;margin:6px 0 8px}
.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#6257d4;font-weight:900}
.field{text-align:left;margin:10px 0}
.field label{display:block;font-weight:800;margin-bottom:5px;font-size:13px}
.field input,textarea{width:100%;border:1px solid #cfd6e2;border-radius:12px;padding:11px;background:#fff}
.primary,.secondary{border-radius:12px;padding:11px 14px;font-weight:900}
.primary{background:var(--accent);color:#fff}
.secondary{background:#efefff;color:#4c43b8}
.ghost{background:transparent;color:var(--muted);padding:8px}
.source{color:var(--muted);font-size:13px;line-height:1.4}
.talkGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}
.talkPrompt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;min-height:0}
.talkPrompt h3{margin:0 0 6px;font-size:14px}
.talkPrompt textarea{flex:1;min-height:80px}
.lock{background:#fff;border:1px dashed #c9d1e0;border-radius:14px;padding:12px;text-align:center}

/* Watch layout: fill the screen */
.watch{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,1.05fr) auto;gap:8px}
.watchHead{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.watchHead h2{font-size:15px;margin:0}
.meta{font-size:12px;color:var(--muted)}
.progress{height:6px;background:#e7eaf1;border-radius:99px;overflow:hidden;margin-top:6px}
.progress>div{height:100%;background:var(--accent)}
.pane{background:#fff;border:1px solid var(--line);border-radius:14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.paneBar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.paneBody{flex:1;min-height:0;overflow:auto;padding:10px}
.toggle{display:flex;background:#eef0f5;border-radius:10px;padding:3px}
.toggle button{padding:6px 10px;border-radius:8px;background:transparent;color:var(--muted);font-weight:800;font-size:13px}
.toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hlTools{display:flex;gap:5px;margin-left:auto;align-items:center}
.hlDot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c5cdd8}
.hlDot.on{box-shadow:0 0 0 2px #182033}
.mark{cursor:pointer;border-radius:4px;padding:0 1px}
.mark.y{background:#ffe56a}
.mark.g{background:#b6f0c8}
.mark.p{background:#ffc2e2}
.mark.b{background:#c9dbff}
.actualText,.easy{font-size:16px;line-height:1.55}
.easy{background:var(--soft);border-radius:10px;padding:8px}
.foot{display:flex;gap:8px;align-items:stretch}
.qbar{flex:1;background:#fff8df;border:1px solid #f1dda4;border-radius:14px;padding:8px 10px;min-width:0}
.qbar strong{display:block;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#8a6a10}
.qbar .qprompt{font-weight:750;font-size:13px;line-height:1.3;margin:2px 0 6px}
.qbar textarea{min-height:44px;padding:8px;border-radius:10px}
.nextCol{display:flex;flex-direction:column;gap:6px;width:118px}
.nextCol .primary{height:100%;min-height:52px}

/* Games */

.playPrompt{font-weight:800;font-size:15px;line-height:1.35;margin:0 0 8px}
.sky{position:relative;min-height:230px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 120%,#ffe9a8 0 18%,#9ec7ff 18% 55%,#3a4d9a 55%)}
.floater{position:absolute;border:0;border-radius:18px;padding:9px 11px;font-weight:900;background:#fff;box-shadow:0 8px 18px rgba(20,30,50,.18);animation:drift 3.4s ease-in-out infinite;touch-action:manipulation}
.floater.got{background:#fff4a8;box-shadow:0 0 18px 6px rgba(255,220,80,.75);animation:none}
.floater.boom{background:#ffd0d0}
.floater.boom{background:#ffd0d0;animation:shake .35s}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(10px,-16px) rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.gridTap{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bigHit{min-height:58px;border-radius:16px;border:2px solid #d5dceb;background:#fff;font-weight:900;font-size:15px;padding:10px}
.bigHit.on{background:#ece8ff;border-color:#8b82e8}
.sortStage{display:grid;gap:8px}
.sortCard{min-height:88px;border-radius:18px;border:2px solid #cfd6ea;background:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;padding:12px}
.sortBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sortBtns button{min-height:72px;border-radius:16px;font-weight:900;font-size:16px}
.factBtn{background:#eef3ff;border:2px solid #b9c7ee;color:#2a3d86}
.heartBtn{background:#fff0f4;border:2px solid #f3b4c4;color:#9b2c4a}
.path{position:relative;min-height:150px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:linear-gradient(#cfe8ff,#d9efc8);border-radius:16px;padding:12px}
.stone{width:96px;min-height:96px;border-radius:50%;border:4px solid #c4b48a;background:#f3e6b8;font-weight:900;font-size:12px;padding:8px;line-height:1.2}
.stone .ico{font-size:26px;display:block}
.stone.lit{background:#ffe56a;border-color:#d4a000;transform:scale(1.05)}
.towerBox{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:end}
.tower{display:flex;flex-direction:column-reverse;align-items:center;min-height:200px;padding-bottom:8px;background:linear-gradient(#f4f7ff,#e4ebf8);border-radius:14px;border:1px solid #d5dceb}
.brick{color:#fff;font-weight:900;text-align:center;padding:10px 8px;margin-top:4px;border-radius:6px;background:linear-gradient(#c27a4a,#8b4b28);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 #6a3418;font-size:13px}
.brick.b0{width:118px}.brick.b1{width:100px}.brick.b2{width:84px}.brick.b3{width:70px}
.pile{display:grid;gap:6px}
.lensDesk{display:grid;grid-template-columns:1.2fr .8fr;gap:8px}
.pageFake{background:#fffaf0;border:1px solid #e3d6b3;border-radius:8px;padding:10px;font-size:13px;line-height:1.45;min-height:120px}
.lenses{display:grid;gap:8px}
.lens{border-radius:50%;width:100%;aspect-ratio:1;max-height:84px;border:8px solid #333;background:radial-gradient(circle at 35% 30%,#fff,#7db7ff 35%,#1d3b73);color:#fff;font-weight:900;font-size:11px;text-shadow:0 1px 2px #000}
.lens.on{outline:4px solid #6d5dfc}
.mags{display:flex;flex-direction:column;gap:10px;align-items:center}
.mag{width:118px;min-height:118px;border-radius:50%;border:10px solid #6b4423;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.8),rgba(140,200,255,.35) 42%,rgba(60,110,170,.28));color:#123;font-weight:900;font-size:11px;line-height:1.2;padding:16px;position:relative}
.mag:after{content:"";position:absolute;width:16px;height:40px;background:#6b4423;border-radius:8px;right:-16px;bottom:-26px;transform:rotate(-38deg)}
.mag.on{box-shadow:0 0 0 4px #6d5dfc}
.pageOn{position:relative}
.pageOn .magSit{position:absolute;right:8px;bottom:8px;transform:scale(.7)}
.rocketPad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.rocketHole{min-height:86px;border:2px dashed #c9d1e0;border-radius:16px;background:#f4f7ff;padding:8px;font-weight:800;text-align:center}
.decide{display:flex;gap:8px;margin-top:8px}
.decide button{flex:1;min-height:48px;border-radius:14px;font-weight:900}
.yesT{background:#e5f8ea;color:#16653c}
.noT{background:#fff1f1;color:#8a3030}
.jeans{display:grid;grid-template-columns:1fr 160px;gap:10px;align-items:start}
.polaroid{background:#fff;border:1px solid #ddd;box-shadow:0 4px 10px rgba(0,0,0,.08);padding:8px 8px 18px;font-weight:800;font-size:13px;text-align:center;transform:rotate(var(--r,0deg))}
.polaroid .pic{font-size:28px;display:block;margin-bottom:4px}
.jeanPocket{height:180px;border-radius:12px 12px 40px 40px;background:linear-gradient(#3c5a86,#2a4064);border:3px dashed #c9d6ea;color:#e8eef8;padding:12px;position:relative}
.jeanPocket:before{content:"";position:absolute;left:12px;right:12px;top:34px;height:8px;border-top:2px dashed #9fb3d1}
.tossBin{margin-top:8px;min-height:44px;border-radius:12px;border:2px dashed #d9b0b0;background:#fff5f5;padding:8px;font-weight:800;color:#8a3030}
.mirrorScene{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center}
.oval{width:150px;height:190px;border-radius:50%;border:10px solid #c9a227;background:linear-gradient(180deg,#eef7ff,#c8d8e8);box-shadow:inset 0 0 20px rgba(30,50,80,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px}
.sticker{border-radius:14px;padding:8px;background:#fff;border:2px solid #d5dceb;font-weight:800}
.sticker.on{background:#d9f6e4;border-color:#49b877}
.sticker.no{background:#ffe1e1}
.mapScene{position:relative;height:220px;border-radius:16px;background:linear-gradient(#b5e0a8 0 55%,#8ecf7a 55%);overflow:hidden;border:1px solid #c3ddb8}
.mapScene .road{position:absolute;left:0;right:0;top:52%;height:18px;background:#e8d9a8}
.pin{position:absolute;padding:6px 8px;border-radius:14px;background:#fff;font-weight:800;font-size:12px;border:2px solid #d5dceb}
.pin.on{background:#ffe56a;border-color:#e0b000}
.pin.bad{background:#ffe1e1}
.well{position:relative;height:230px;border-radius:16px;background:linear-gradient(#6b7c8d,#2b3640);overflow:hidden}
.wellWall{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 12px,transparent 12px 24px)}
.rope{position:absolute;left:50%;width:6px;background:#c9a36a;top:0;height:20%;transform:translateX(-50%)}
.person{position:absolute;left:calc(50% - 16px);bottom:10px;font-size:28px;filter:brightness(.7)}
.hideTok{position:absolute;background:rgba(255,255,255,.16);border:0;border-radius:10px;padding:4px 6px;font-size:16px;color:#fff}
.hideTok.found{background:#d9f6e4;color:#16653c}
.quadDraw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pad{border:1px solid #d5dceb;border-radius:12px;padding:6px;background:#fafbff}
.pad canvas{width:100%;height:88px;background:#fff;border-radius:8px;border:1px dashed #c9d1e0;touch-action:none}
.trackRow{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.trackIco{font-size:28px;text-align:center}
.slot{min-height:48px;border:2px dashed #c9d1e0;border-radius:12px;padding:8px;font-weight:800;background:#f7f8fc}
.slot.filled{background:#ece8ff;border-color:#8b82e8}
.picCard{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;background:#fff;border:1px solid #d5dceb;font-weight:800;margin:4px}
.garden{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.plant{min-height:100px;border-radius:16px;background:#e7f6ea;border:2px dashed #b7d8bf;font-weight:900}
.plant.up{background:#b9ecc6;border-style:solid}
.tile{min-height:58px;border-radius:12px;border:2px solid #d5dceb;background:#fff;font-weight:900}
.tile.flip{background:#6d5dfc;color:#fff}
.tile.found{background:#d9f6e4;border-color:#49b877;color:#16653c}
.small{font-size:12px;color:var(--muted)}


.sheet{position:fixed;inset:0;background:#111;z-index:80;display:none;flex-direction:column}
.sheet.open{display:flex}
.sheetBar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#1a2236;color:#fff}
.sheetBar strong{flex:1;font-size:16px}
.sheetBar button{min-height:48px;min-width:96px;border-radius:14px;font-weight:900;background:#fff;color:#1a2236}
.sheetFrame{flex:1;border:0;width:100%;background:#333}
.holdBtn{width:100%;min-height:52px;border-radius:14px;background:#efeaff;color:#4c43b8;font-weight:900;position:relative;overflow:hidden}
.holdBtn span{position:relative;z-index:1}
.holdBtn .fill{position:absolute;inset:0 auto 0 0;width:0;background:#c9c2ff}
.jumpSel{border:1px solid #cfd6e2;border-radius:12px;padding:10px 12px;font-weight:800;background:#fff;min-height:44px}
.watchHead .jumpSel{min-height:40px;padding:6px 8px;font-size:13px}

/* Brutus dock + chat */
.brutusDock{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid #d9d2ff;padding:0;background:#efeaff;flex:0 0 auto}
.brutusDock img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.chat{position:fixed;inset:auto 8px 8px 8px;max-width:520px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(20,30,50,.2);z-index:80;display:none;flex-direction:column;max-height:52dvh}
.chat.open{display:flex}
.chatHead{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.chatHead img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 18%}
.chatLog{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:90%;padding:8px 10px;border-radius:14px;font-size:14px;line-height:1.35}
.bubble.me{align-self:flex-end;background:#6d5dfc;color:#fff}
.bubble.dog{align-self:flex-start;background:#f3efff}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 8px}
.chipAsk{background:#f3f1ff;border-radius:999px;padding:6px 10px;font-weight:800;font-size:12px;color:#4c43b8}
.chatForm{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.chatForm input{flex:1;border:1px solid #cfd6e2;border-radius:12px;padding:10px}

/* Draw */
.drawOverlay,.pop{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:100;display:none;padding:10px}
.drawOverlay.open,.pop.open{display:flex}
.drawPanel{background:#fff;border-radius:16px;max-width:1100px;width:100%;height:100%;margin:auto;display:flex;flex-direction:column;overflow:hidden}
.drawHead,.drawFoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drawFoot{border-top:1px solid var(--line);border-bottom:0}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccd2dd}
.drawCanvasWrap{flex:1;background:#fff;touch-action:none}
.drawCanvasWrap canvas{display:block;width:100%;height:100%;touch-action:none}
.popCard{background:#fff;border-radius:20px;max-width:420px;width:100%;margin:auto;padding:22px 18px;text-align:center}
.popCard h2{margin:8px 0}
.popFace{width:88px;height:88px;border-radius:50%;object-fit:cover;object-position:50% 18%;margin:0 auto}

.finish{background:#fff;border-radius:16px;padding:28px 16px;text-align:center;margin:auto;width:min(560px,100%)}
.finishStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:#f7f8fb;border-radius:12px;padding:12px;font-weight:850}

@media(max-width:700px){.talkGrid{grid-template-columns:1fr}.watch{grid-template-rows:auto minmax(0,.9fr) minmax(0,1.2fr) auto}.nextCol{width:96px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="sheet" class="sheet" aria-hidden="true">
  <iframe class="sheetFrame" id="sheetFrame" title="Lead sheet"></iframe>
  <div class="sheetBar">
    <strong id="sheetTitle">Song</strong>
    <button type="button" id="closeSheet">Close</button>
  </div>
</div>

<div id="chat" class="chat">
  <div class="chatHead">
    <img src="brutus.png" alt="Brutus">
    <div><strong>Brutus</strong><div class="small">Ask him anything. He is a dog. He tries.</div></div>
    <button class="ghost" id="closeChat" style="margin-left:auto">✕</button>
  </div>
  <div class="chatLog" id="chatLog"></div>
  <div class="chips" id="chatChips"></div>
  <form class="chatForm" id="chatForm"><input id="chatInput" placeholder="Ask Brutus…" autocomplete="off"><button class="primary" type="submit">Send</button></form>
</div>
<div id="pop" class="pop"><div class="popCard" id="popCard"></div></div>
<div id="drawOverlay" class="drawOverlay">
  <div class="drawPanel">
    <div class="drawHead">
      <strong>✏️ Drawing</strong>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <button class="secondary" id="undoDraw">↩️</button>
        <button class="secondary" id="redoDraw">↪️</button>
        <button class="secondary" id="eraseDraw">Eraser</button>
        <button class="secondary" id="clearDraw">Clear</button>
        <button class="primary" id="saveDraw">Save</button>
        <button class="ghost" id="closeDraw">✕</button>
      </div>
    </div>
    <div style="padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <label style="font-weight:800;font-size:13px">Color <input id="fullColor" type="color" value="#182033"></label>
      <div id="swatches" style="display:flex;flex-wrap:wrap;gap:5px"></div>
      <label style="display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px">Size <input id="penSize" type="range" min="2" max="28" value="6"></label>
    </div>
    <div class="drawCanvasWrap"><canvas id="drawCanvas"></canvas></div>
    <div class="drawFoot"><span class="source">Stays on this iPad.</span><button class="secondary" id="newDraw">New drawing</button></div>
  </div>
</div>

const WT='w_E_202607.pdf', SONGS='sjjsm_E.pdf';

const pTexts={
1:`Have you ever thought about the depth of Jehovah’s knowledge, the vastness of his wisdom, or the scope of his accomplishments? We are humbled when we think about our Creator. You may feel as did the apostle Paul, who wrote: “O the depth of God’s riches and wisdom and knowledge! How unsearchable his judgments are and beyond tracing out his ways are!”—Rom. 11:33, 34.`,
2:`Although we will never know everything there is to know about Jehovah, it is possible, to a certain extent, to get to know what he is like. King David told his son Solomon: “Know the God of your father and serve him with a complete heart . . . If you search for him, he will let himself be found by you.” (1 Chron. 28:9) And the apostle John reminded his fellow Christians that we have “insight so that we may gain the knowledge of the one who is true.” (1 John 5:20) Jesus himself said that knowledge of Jehovah is available to “anyone to whom the Son is willing to reveal him.”—Matt. 11:27.`,
3:`All who dedicated themselves to Jehovah have already learned many things about him. Yet, we never stop “coming to know” Jehovah. (John 17:3; see study note.) We can always learn more about what makes him happy and how to deepen our trust in him. Let us discuss three questions that all of us should consider no matter how long we have served Jehovah: What does it mean to come to know Jehovah? Why should we continue to get to know him better? And how do we get to know him better?`,
4:`We learn what is involved in coming to know Jehovah by considering what he said about the Jews who would return from exile. Jehovah promised: “I will give them a heart to know me, that I am Jehovah.” (Jer. 24:7) Surely those who returned from Babylon already knew basic facts about Jehovah. But their efforts to come to know Jehovah would need to involve their heart, including their feelings and motives. One reference work puts it this way: “There is a marked difference between knowing about God and knowing God. It is comparable to the difference between reading about love and falling in love.” We need to know more than the fact that Jehovah has a name and that he is God. We want to come to know the Person behind the name.`,
5:`As we come to know Jehovah, we learn what makes him happy and what displeases him. To illustrate, consider the example of King Josiah. The Bible says: “In the 8th year of his reign, while he was still a boy, he started to search for the God of David his forefather.” (2 Chron. 34:3) But Josiah did more than study. He acted on what he was learning. Through the prophet Jeremiah, Jehovah said that Josiah “upheld justice and righteousness” and that he defended the afflicted and the poor. Then Jehovah added: “Is that not what it means to know me?”—Jer. 22:15, 16.`,
6:`Read Psalm 9:10. The more we come to know Jehovah, the more we come to trust in him. That principle proved true for the apostle Paul. During his final imprisonment and not long before his death, he wrote: “I am not ashamed. For I know the One whom I have believed.” (2 Tim. 1:12) What Paul had learned and experienced during his life moved him to trust in his God implicitly.`,
7:`Over time, we may not put as much effort into getting to know Jehovah as we did when we first learned about him. When reading the Bible on our own or along with others at congregation meetings, we may tend to focus on how the information can help us personally in practical ways or how we can use it to help others. The Scriptures encourage us to do that. (2 Tim. 3:16, 17) But the Bible also reveals much about its Author. (Ps. 25:8-10) We should never be so absorbed in how the Bible’s message benefits us or others that we fail to ask ourselves, “What does this tell me about Jehovah God?”`,
8:`As we get to know Jehovah better, our friendship with him will grow stronger. For example, how do you feel about Jehovah after you do your daily Bible reading, watch a monthly broadcast, or attend an assembly or a convention? We often feel closer to our heavenly Father because we have learned more about him. As a result, we are moved to praise and thank him. We feel like the psalmist who meditated on Jehovah’s care for him and said: “God is the rock of my heart and my portion forever.” (Read Psalm 73:24-28.) Every effort we make to get to know Jehovah deepens our gratitude for our priceless friendship with him.`,
9:`When we “take notice of” Jehovah—recalling what we have learned about him and thinking about how our actions affect him—we will make better decisions. To illustrate: Many brothers and sisters keep a photograph of their mate on their desk, in their wallet, or on their phone. This helps them to think fondly and often about their mate, to make decisions that they know will please their mate, and to avoid anything that would hurt that person. Similarly, the more often we think about Jehovah, the more likely we will be to make choices that please him.—Ps. 19:13, 14.`,
10:`We are made in Jehovah’s image, which gives us the ability to reflect his qualities. (Gen. 1:26) And the more we learn about Jehovah’s qualities, the better we will understand how to imitate him. Jesus condemned the scribes and Pharisees for their failure to show godly qualities. Although they paid close attention to the minor details of the Law, they “disregarded the weightier matters of the Law, namely, justice and mercy and faithfulness.” (Matt. 23:23) Unlike those religious leaders, let us do our best to understand how Jehovah’s qualities are reflected in his laws and principles. Doing so will help us to demonstrate those very qualities.—1 John 4:8, 11.`,
11:`Who introduced you to Jehovah? Perhaps you were raised by Christian parents. They likely related Bible accounts that reveal God’s qualities and taught you how the things he created reflect his personality. Or you may have accepted a Bible study from one of Jehovah’s Witnesses. Using a study aid, such as the Enjoy Life Forever! book, your Bible teacher helped you to analyze Scriptural accounts and to learn about Jehovah’s appealing qualities by studying the natural world. (Neh. 8:8; Acts 14:17) Let us consider how we can continue learning about Jehovah.`,
12:`First, we can learn more about Jehovah by reading and studying his Word. Sometimes, the Bible specifically identifies God’s qualities. (Ex. 34:6, 7) More often, though, it relates events involving humans and the decisions they made. When you read such accounts, think about what they can teach you about Jehovah.`,
13:`Consider the example of Ebed-melech, who rescued the prophet Jeremiah. (Jer. 38:6-13) Doubtless, you quickly identify ways that you can imitate Ebed-melech’s self-sacrifice, courage, and love for his fellow worshippers. But you can also look for what the account teaches you about Jehovah. Do you also see what qualities of Jehovah are revealed in this account? (Read Jeremiah 39:15-18.) For instance, what verse indicates that Jehovah is appreciative? Fair? Impartial? What other aspects of Jehovah’s personality do you discern in this account? Whenever you read a passage in God’s Word, identify Jehovah’s qualities that are reflected, and then thank and praise him for those qualities.`,
14:`Second, we can learn more about Jehovah by meditating on his creative works. (Ps. 145:9, 10) Of course, simply observing the natural world is not enough. Some spend their entire lives studying nature but fail to acknowledge God’s qualities or even his existence! The apostle Paul wrote that God’s “invisible qualities are clearly seen from the world’s creation onward, because they are perceived by the things made.” (Rom. 1:20) One translation of this verse says that we can perceive God’s qualities because they are “visible . . . to the eye of reason.” So we must think about and reason on what we see in order to discern the qualities of our Creator.`,
15:`Many of us live in urban areas that seem distant from the natural world. If this is your situation, can you still learn lessons from creation? Consider Patrick, who lives in Brazzaville, a large city in the Republic of the Congo. He relates: “I strive to observe creation from my balcony. I often see tiny insects or small birds busily looking for food or for a place to live. Once, I observed some birds making their nest. They found and used materials in our neighborhood that were perfectly suited for welcoming small chicks.” Patrick did not stop there; he thought deeply about the Creator. He says: “I learned that Jehovah cares about the well-being of his creatures, even those that seem insignificant. This assures me that he also cares about me and will not fail to provide me with what I need.”`,
16:`A third way we can get to know Jehovah better is by meditating on our own experiences. That is what Jesus’ mother, Mary, did. She already knew Jehovah well, and she had “found favor with [him].” (Luke 1:30) But then she was given a weighty assignment—to be the mother of God’s Son. Through the angel Gabriel and Mary’s relative Elizabeth, Jehovah strengthened Mary and reassured her. She later meditated on what her experience had revealed about Jehovah—including his power, mercy, impartiality, and interest in even the lowly ones. (Luke 1:46-55) Just as Mary was appreciative of God’s support, we are grateful when Jehovah gives us help “at the right time.” (Heb. 4:16) When you receive this help, ask yourself: “What has this taught me about Jehovah? Which qualities of Jehovah has this help revealed?”`,
17:`Think of how much more we will learn about Jehovah in the new world. We will receive new scrolls that reveal his requirements for us. (Rev. 20:12) We will be able to interact more closely with the natural world. (Isa. 11:6-9) And we will deepen our understanding as we experience new things, including our loved ones being resurrected and our getting closer to perfection every day.`,
18:`We will never stop getting to know Jehovah. He has already lived for an eternity, so “his understanding is beyond measure.” (Ps. 90:2; 147:5) We “will never find out the work that the true God has made from start to finish.” (Eccl. 3:11) Therefore, regardless of how long we have been in the truth, may we seize every opportunity to learn more about our loving Father.`

const STORE='smb-sunday-2026-09-21-v5';
const DEFAULT={screen:'setup',talk:'',opening:'',unit:0,view:'actual',stars:0,earned:{},activityStars:{},materialAwarded:{},attempts:{},test:false,meetingStarted:null,wtUnlocked:false,talkDone:false,talkNotes:{},questionAnswers:{},game:{},marks:{},hl:'y',chat:[]};
let state={...DEFAULT};
let drawState={color:'#182033',size:6,drawing:null,history:[],redo:[],erase:false};
let canvas,ctx,drawing=false,lastX=0,lastY=0;

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s)state={...DEFAULT,...s}}catch(e){}}
function fmt(ms){let t=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function unit(){return units[state.unit]}
function unitLabel(u){return u.ps.length>1?`¶ ${u.ps[0]}–${u.ps[u.ps.length-1]}`:`¶ ${u.ps[0]}`}
function unitOptions(sel){return units.map((u,i)=>`<option value="${i}" ${i===sel?'selected':''}>${unitLabel(u)}</option>`).join('')}
function jumpTo(i){
  const n=Math.max(0,Math.min(units.length-1,Number(i)||0));
  state.screen='wt'; state.unit=n; state.view='actual'; state.talkDone=true; state.wtUnlocked=true; state.meetingStarted=Date.now();
  save(); render();
}

function wtPage(p){return p<=3?14:p<=7?15:p<=11?16:p<=14?17:p<=16?18:19}
function songPage(n){return SONG_PAGES[Number(n)]||null}
const WT_BUDGET_MS=48*60*1000; // 48 minutes of unit minimums inside a ~60 minute study
function unitPts(u){return (u&&u.pts)||0}
function lessonPts(){return units.reduce((n,u)=>n+unitPts(u),0)||100}
function unitBudget(u){return Math.round(WT_BUDGET_MS*unitPts(u)/lessonPts())}
function remaining(){
  if(state.test||state.screen!=='wt') return 0;
  const e=state.meetingStarted?Date.now()-state.meetingStarted:0;
  return Math.max(0,unitBudget(unit())-e);
}


function header(){
  const ready=!remaining();
  return `<div class="top">
    <button class="brutusDock" id="openChat" title="Talk to Brutus"><img src="brutus.png" alt="Brutus"></button>
    <div class="brand">Sunday Buddy</div>
    <div class="grow"></div>
    ${state.screen==='wt'?`<div class="chip timerChip ${ready?'ready':''}" id="timer">${state.test?'TEST':fmt(remaining())}</div>`:''}
    <button class="toolBtn" id="drawOpen">✏️</button>
    <div class="stars">⭐ ${state.stars}</div>
  </div>`;
}

function render(){
  const main=state.screen==='setup'?setup():state.screen==='talk'?talk():state.screen==='transition'?transition():state.screen==='wt'?watch():finish();
  document.getElementById('app').innerHTML=`${header()}${state.test?'<div class="testBanner">TEST MODE — locks off</div>':''}<div class="wrap">${main}</div>`;
  bind();
}

function setup(){
  return `<section class="hero">
    <div class="eyebrow">Sep 21–27 · 2026</div>
    <h1>Ready, Maddy?</h1>
    <p class="source">Are You Getting to Know Jehovah Better?</p>
    <div class="field"><label>Public talk title</label><input id="talk" value="${esc(state.talk)}" placeholder="Talk title"></div>
    <div class="field"><label>Opening song</label><input id="opening" inputmode="numeric" value="${esc(state.opening)}" placeholder="Song number"></div>
    <label style="display:flex;gap:8px;justify-content:center;font-weight:800;margin:10px 0"><input id="testMode" type="checkbox" ${state.test?'checked':''}> Test mode</label>
    <button class="primary" id="start">START</button>
  </section>`;
}
function talk(){
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <div><div class="eyebrow">Public talk</div><h2 style="margin:0">${esc(state.talk||'Public Talk')}</h2></div>
    <button class="secondary" id="openOpening">🎵 ${esc(state.opening||'')}</button>
  </div>
  <div class="talkGrid">
    ${[['learned','💡 I learned'],['verse','📖 A verse'],['jehovah','❤️ About Jehovah'],['remember','🤔 Remember']].map(([k,l])=>`<div class="talkPrompt"><h3>${l}</h3><textarea data-note="${k}" placeholder="Type or dictate…">${esc(state.talkNotes[k]||'')}</textarea></div>`).join('')}
  </div>
  <div class="lock"><div class="small">Stay here for the public talk. Watchtower unlocks at 10:30.</div>
    <button class="holdBtn" id="endTalk" type="button"><i class="fill"></i><span>Hold to end the talk</span></button>
    <button class="secondary" id="openOpening2" style="margin-top:8px">🎵 Opening song lead sheet</button>
    <div class="field" style="margin-top:12px;text-align:left"><label>Oops — jump into the study</label><select class="jumpSel" id="oopsUnit">${unitOptions(0)}</select></div>
    <button class="secondary" id="oopsJump" style="margin-top:6px">Open that paragraph</button>
  </div>`;
}
function transition(){
  const now=new Date(),u=new Date(now);u.setHours(10,30,0,0);
  const ready=state.test||state.wtUnlocked||now>=u;
  return `<section class="hero">
    <div class="eyebrow">Transition</div>
    <h1>${ready?'Song 12, then study':'Locked until 10:30'}</h1>
    <p><strong>Song 12 — Great God, Jehovah</strong></p>
    <button class="secondary" id="song12">🎵 Song 12 lead sheet</button>
    <div style="height:10px"></div>
    <p class="small">Study hour: units are weighted out of 100 and spread over 48 minutes of minimum time. Short paragraphs unlock sooner. Long ones (two questions, an account, a picture) hold longer.</p>
    <div class="field"><label>Start at</label><select class="jumpSel" id="startUnit">${unitOptions(state.unit||0)}</select></div>
    <button class="primary" id="beginWT" ${ready?'':'disabled'}>Begin Watchtower</button>
    <button class="ghost" id="backTalk" style="margin-top:8px">← Back to the public talk</button>
  </section>`;
}

function sentences(text){
  const parts=text.split(/(?<=[.!?—”])\s+/);
  return parts.filter(Boolean);
}
function markedHTML(u){
  const key=u.id, marks=state.marks[key]||{};
  const blocks=u.ps.map(n=>{
    const raw=state.view==='easy'?easy[n]:pTexts[n];
    const bits=sentences(raw).map((s,i)=>{
      const idx=n+':'+i;
      const cls=marks[idx]?` mark ${marks[idx]}`:' mark';
      return `<span class="${cls.trim()}" data-mark="${idx}">${esc(s)}</span>`;
    }).join(' ');
    return `<p style="margin:0 0 10px"><b>¶ ${n}</b> ${bits}</p>`;
  }).join('');
  return `<div class="${state.view==='easy'?'easy':'actualText'}">${blocks}</div>`;
}

  if(a.type==='stamp'){

function makeDeck(words){
  const all=[...words,...words].sort(()=>Math.random()-.5).map(w=>({w,up:false,found:false}));
  return all;
}

    <h2>${esc(title)}</h2>

function awardMaterial(key){
  if(state.materialAwarded[key]) return;
  state.materialAwarded[key]=1;
  state.earned[key]=(state.earned[key]||0)+1;
  state.stars++;
  save();
}
function attemptResult(key,correct){
  if(state.activityStars[key]!==undefined){
    popup(true,'Already finished','You already did this one.');
    return;
  }
  state.attempts[key]=(state.attempts[key]||0)+1;
  const n=state.attempts[key];
  if(correct){
    const score=n===1?2:n===2?1:0;
    state.activityStars[key]=score;
    state.earned[key]=(state.earned[key]||0)+score;
    state.stars+=score;
    save();
    popup(true, score?`Yes! ${'⭐'.repeat(score)}`:'Got it', score?`First-try energy.`:`You figured it out.`);
    render();
  }else{
    save();
    popup(false, n===1?'Not yet':'Almost', n===1?'Look back at the paragraph and try again.':'One more careful try.');
  }
}

function gobj(key){state.game[key]=state.game[key]||{};return state.game[key]}

function bindPlay(a,key){
  if(a.type==='burst'){
    document.querySelectorAll('[data-burst]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.burst, it=a.items[i], g=gobj(key);
      g.got=g.got||[];
      if(!it.ok){b.classList.add('boom');return}
      if(!g.got.includes(i)) g.got.push(i);
      b.classList.add('got'); save();
      if(a.items.every((x,idx)=>!x.ok||g.got.includes(idx))) attemptResult(key,true);
    });
  }
  if(a.type==='flip'){
    document.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>{
      const g=gobj(key); if(!g.deck) return;
      const card=g.deck[+b.dataset.flip];
      if(card.found||card.up) return;
      card.up=true; save(); render();
      const after=()=>{
        const open=g.deck.filter(c=>c.up&&!c.found);
        if(open.length<2) return;
        if(open[0].w===open[1].w){open[0].found=open[1].found=true;open[0].up=open[1].up=false}
        else open.forEach(c=>c.up=false);
        save();
        if(a.words.every(w=>g.deck.some(c=>c.w===w&&c.found))) attemptResult(key,true);
        else render();
      };
      if(g.deck.filter(c=>c.up&&!c.found).length>=2) setTimeout(after,450);
    });
  }
  if(a.type==='rockets'){
    let sel=null;
    document.querySelectorAll('[data-fuel]').forEach(el=>el.onclick=()=>{sel=+el.dataset.fuel;document.querySelectorAll('[data-fuel]').forEach(x=>x.style.outline=x===el?'3px solid #6d5dfc':'')});
    document.querySelectorAll('[data-rock]').forEach(z=>z.onclick=()=>{
      if(sel===null) return;
      const g=gobj(key); g.load=g.load||[];
      const slot=+z.dataset.rock;
      g.load[slot]=sel;
      save(); render();
    });
    document.getElementById('checkGame')?.addEventListener('click',()=>{
      const load=(gobj(key).load||[]).filter(x=>x!==undefined);
      const ok=load.length===3 && load.every(i=>a.qs[i].ok) && new Set(load).size===3;
      attemptResult(key,ok);
    });
  }
  if(a.type==='swipe'){
    document.querySelectorAll('[data-swipe]').forEach(b=>b.onclick=()=>{
      const g=gobj(key);
      if(!g.queue) g.queue=a.cards.map((_,i)=>i);
      const cur=g.queue[0]; if(cur===undefined) return;
      const card=a.cards[cur];
      if(b.dataset.swipe===card[1]) g.queue.shift();
      else g.queue.push(g.queue.shift());
      save();
      if(!g.queue.length) attemptResult(key,true);
      else render();
    });
  }
  if(a.type==='stones'){
    document.querySelectorAll('[data-stone]').forEach(b=>b.onclick=()=>{
      const g=gobj(key); g.path=g.path||[];
      const i=+b.dataset.stone;
      if(i!==g.path.length){b.classList.add('boom');return}
      g.path.push(i); save();
      if(g.path.length===a.steps.length) attemptResult(key,true);
      else render();
    });
  }
  if(a.type==='stack'){
    document.querySelectorAll('[data-stack]').forEach(b=>b.onclick=()=>{
      const g=gobj(key); g.n=g.n||0; const i=+b.dataset.stack;
      if(i!==g.n){b.classList.add('boom');return}
      g.n++; save();
      if(g.n>=a.blocks.length) attemptResult(key,true);
      else render();
    });
  }
  if(a.type==='lens'){
    document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
      gobj(key).pick=+b.dataset.pick; save();
      attemptResult(key,+b.dataset.pick===a.correct);
    });
  }
  if(a.type==='grow'){
    document.querySelectorAll('[data-grow]').forEach(b=>b.onclick=()=>{
      const g=gobj(key); g.n=g.n||0; const i=+b.dataset.grow;
      if(i!==g.n){b.classList.add('boom');return}
      g.n++; save();
      if(g.n===a.steps.length) attemptResult(key,true);
      else render();
    });
  }
  if(a.type==='pocket'){
    let sel=null;
    document.querySelectorAll('[data-bit]').forEach(el=>el.onclick=()=>{sel=+el.dataset.bit;document.querySelectorAll('[data-bit]').forEach(x=>x.style.outline=x===el?'3px solid #6d5dfc':'')});
    document.querySelector('[data-pocket]')?.addEventListener('click',()=>{
      if(sel===null) return;
      const g=gobj(key); g.pocket=sel;
      document.getElementById('pocketItems').textContent=document.querySelector(`[data-bit="${sel}"]`).innerText;
    });
    document.querySelector('[data-toss]')?.addEventListener('click',()=>{
      if(sel===null) return;
      const g=gobj(key); g.toss=g.toss||[]; if(!g.toss.includes(sel)) g.toss.push(sel);
      document.querySelector(`[data-bit="${sel}"]`).style.opacity='.35';
    });
    document.getElementById('checkGame')?.addEventListener('click',()=>{
      const g=gobj(key);
      if(g.pocket===undefined){popup(false,'Empty pocket','Tap the keeper photo, then tap the jeans.');return}
      attemptResult(key,g.pocket===0);
    });
  }
  if(a.type==='mirror'){
    document.querySelectorAll('[data-mir]').forEach(b=>b.onclick=()=>{
      const g=gobj(key); g.mir=g.mir||[]; const i=+b.dataset.mir;
      if(!a.items[i].ok){b.classList.add('no','boom');return}
      if(!g.mir.includes(i)) g.mir.push(i);
      save(); render();
    });
    document.getElementById('checkGame')?.addEventListener('click',()=>{
      const got=gobj(key).mir||[];
      const need=a.items.map((it,i)=>it.ok?i:-1).filter(i=>i>=0);
      attemptResult(key,need.every(i=>got.includes(i)) && got.every(i=>a.items[i].ok));
    });
  }
  if(a.type==='pins'){
    document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{
      const g=gobj(key); g.pins=g.pins||[]; const i=+b.dataset.pin;
      if(!a.pins[i].ok){b.classList.add('bad','boom');return}
      if(!g.pins.includes(i)) g.pins.push(i);
      b.classList.add('on'); save();
      const need=a.pins.map((x,idx)=>x.ok?idx:-1).filter(x=>x>=0);
      if(need.every(n=>g.pins.includes(n))) attemptResult(key,true);
    });
  }
  if(a.type==='rescue'){
    const toks=[...a.good.map(t=>({t,ok:1})),...a.fake.map(t=>({t,ok:0}))];
    document.getElementById('lowerRope')?.addEventListener('click',()=>{
      const g=gobj(key); g.low=Math.min(3,(g.low||0)+1); save(); render();
    });
    document.querySelectorAll('[data-tok]').forEach(b=>b.onclick=()=>{
      const g=gobj(key); g.peek=g.peek||[];
      const i=+b.dataset.tok;
      if(!g.peek.includes(i)) g.peek.push(i);
      g.act=i; save(); render();
    });
    document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{
      const g=gobj(key); if(g.act===undefined) return;
      const tk=toks[g.act];
      g.found=g.found||[]; g.tossed=g.tossed||[];
      const keep=b.dataset.dec==='keep';
      if(keep===!!tk.ok){
        if(tk.ok && !g.found.includes(g.act)) g.found.push(g.act);
        if(!tk.ok && !g.tossed.includes(g.act)) g.tossed.push(g.act);
        g.act=undefined; save();
        const needG=a.good.length, needF=a.fake.length;
        if((g.found||[]).length===needG && (g.tossed||[]).length===needF) attemptResult(key,true);
        else render();
      } else {
        popup(false,'Not that one', keep?'That is junk. Toss it.':'That is a real quality. Keep it.');
      }
    });
  }
  if(a.type==='tools'){
    document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
    document.getElementById('checkGame')?.addEventListener('click',()=>{
      const chosen=[...document.querySelectorAll('[data-tool].on')].map(x=>+x.dataset.tool);
      const need=a.tools.map((t,i)=>t.ok?i:-1).filter(i=>i>=0);
      attemptResult(key,chosen.length===need.length&&need.every(i=>chosen.includes(i)));
    });
  }
  if(a.type==='hunt'){
    document.querySelectorAll('[data-hunt]').forEach(b=>b.onclick=()=>{
      const g=gobj(key); g.found=g.found||[]; const i=+b.dataset.hunt;
      if(!a.items[i].ok){b.classList.add('boom');return}
      if(!g.found.includes(i)) g.found.push(i);
      save();
const need=a.items.map((it,idx)=>it.ok?idx:-1).filter(x=>x>=0);
      if(need.every(n=>g.found.includes(n))) attemptResult(key,true);
      else render();
    });
  }
  if(a.type==='stamp'){
    const g=gobj(key); g.dood=g.dood||{}; g.ink=g.ink||{};
    document.querySelectorAll('[data-mini]').forEach(cv=>{
      const i=+cv.dataset.mini;
      const r=cv.getBoundingClientRect();
      const dpr=Math.max(1,devicePixelRatio||1);
      cv.width=Math.round(r.width*dpr); cv.height=Math.round(88*dpr);
      const c=cv.getContext('2d'); c.scale(dpr,dpr); c.lineCap='round'; c.strokeStyle='#182033'; c.lineWidth=3;
      if(g.dood[i]){const im=new Image(); im.onload=()=>c.drawImage(im,0,0,r.width,88); im.src=g.dood[i]}
      let down=false,lx=0,ly=0;
      const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
      cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);const p=pos(e);lx=p.x;ly=p.y;g.ink[i]=1};
      cv.onpointermove=e=>{if(!down)return;const p=pos(e);c.beginPath();c.moveTo(lx,ly);c.lineTo(p.x,p.y);c.stroke();lx=p.x;ly=p.y;g.dood[i]=cv.toDataURL()};
      cv.onpointerup=()=>{down=false;g.dood[i]=cv.toDataURL();save()};
    });
    document.getElementById('checkGame')?.addEventListener('click',()=>{
      const ink=gobj(key).ink||{};
      attemptResult(key,a.choices.every((_,i)=>ink[i]));
    });
  }
  if(a.type==='track'){
    let sel=null;
    document.querySelectorAll('[data-trk]').forEach(el=>el.onclick=()=>{sel=+el.dataset.trk;document.querySelectorAll('[data-trk]').forEach(x=>x.style.outline=x===el?'3px solid #6d5dfc':'')});
    document.querySelectorAll('[data-slot]').forEach(z=>z.onclick=()=>{
      if(sel===null) return;
      const g=gobj(key); g.map=g.map||{}; g.map[sel]=+z.dataset.slot;
      const it=a.items[sel];
      z.textContent=''; z.classList.add('filled'); z.innerHTML=`${it.ico} ${esc(it.t)}`;
      document.querySelector(`[data-trk="${sel}"]`).style.visibility='hidden';
      sel=null; save();
    });
    document.getElementById('checkGame')?.addEventListener('click',()=>{
      const map=gobj(key).map||{};
      attemptResult(key,a.items.every((_,i)=>map[i]===i));
    });
  }
}

function finish(){
  return `<section class="finish">
    <img src="brutus.png" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 18%">
    <div class="eyebrow">Done</div>
    <h1>Great job, Maddy</h1>
    <div class="finishStats"><div class="stat">⭐ ${state.stars}</div><div class="stat">${units.length*3} possible</div><div class="stat">${Object.values(state.questionAnswers).filter(Boolean).length} answers</div></div>
    <p><button class="secondary" id="end28">🎵 Song 28</button></p>
    <div class="field" style="text-align:left"><label>Jump back to a paragraph</label><select class="jumpSel" id="startUnit">${unitOptions(0)}</select></div>
    <button class="secondary" id="oopsJump">Open that paragraph</button>
    <button class="primary" id="restart">New meeting</button>
  </section>`;
}
function advance(){if(state.unit===units.length-1)state.screen='finish';else{state.unit++;state.view='actual';state.meetingStarted=Date.now()}save();render()}
function openSong(n){const p=songPage(n);openSheet(`${SONGS}${p?'#page='+p:''}`,`Song ${n}`)}
function openWT(para){openSheet(`${WT}#page=${wtPage(para)}`,`Watchtower ¶${para}`)}
function openSheet(src,title){
  const wrap=document.getElementById('sheet');
  const frame=document.getElementById('sheetFrame');
  document.getElementById('sheetTitle').textContent=title;
  frame.src=src;
  wrap.classList.add('open');
  wrap.setAttribute('aria-hidden','false');
}
function closeSheet(){
  const wrap=document.getElementById('sheet');
  const frame=document.getElementById('sheetFrame');
  wrap.classList.remove('open');
  wrap.setAttribute('aria-hidden','true');
  frame.src='about:blank';
}
function bindHoldEndTalk(){
  const btn=document.getElementById('endTalk');
  if(!btn) return;
  const fill=btn.querySelector('.fill');
  let t=null, start=0;
  const down=e=>{
    e.preventDefault();
    start=Date.now();
    fill.style.transition='width 1.1s linear';
    fill.style.width='100%';
    t=setTimeout(()=>{
      state.talkDone=true; state.screen='transition'; save(); render();
    },1100);
  };
  const up=()=>{
    clearTimeout(t); t=null;
    fill.style.transition='width .15s ease';
    fill.style.width='0';
  };
  btn.addEventListener('pointerdown',down);
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointercancel',up);
  btn.addEventListener('pointerleave',up);
}

/* Brutus */
const CHIPS=['What should I do?','I’m bored','What’s this about?','Can I draw?','Good boy','I don’t get it'];
function brutusReply(q){
  const s=q.toLowerCase();
  const lines=[
    [/bored|adhd|wiggle|sit/, 'Woof. Hands first. Tap the Play half. Two minutes. Then we can talk snacks that do not exist.'],
    [/what should|do now|help me/, 'Read the yellow Think box. Highlight one sentence. Then smash the game. I believe in you. I am a dog, but still.'],
    [/about|paragraph|study|watchtower|article/, 'This week is: getting to know Jehovah like a friend. Not a list. A Person.'],
    [/draw|color|pencil/, 'Yes. Purple button up top. Whole rainbow. Draw Jehovah’s qualities. Or draw me with a bigger snout. I would allow it.'],
    [/good boy|cute|love you|hi brutus|hello/, 'Tail = yes. I am staying on this screen so you are not alone. Also I would like a biscuit that is imaginary.'],
    [/don’t get|dont get|confused|hard/, 'Switch to Maddy words. Highlight the sentence that feels sticky. Ask the Think question out loud. Whisper is fine. I have excellent ears.'],
    [/jehovah|know|friend/, 'Knowing Jehovah is like knowing me, only infinitely better and with no shedding. Name on a tag is not the same as a real friend.'],
    [/star|point|win/, 'Stars are a nudge, not a report card. Think, then tap. First try gets two.'],
    [/timer|next|unlock/, 'Timer only unlocks Next. You can read, highlight, draw, and pester me the whole time.'],
    [/song/, 'Song 12 to start the study. Song 28 at the end. I cannot sing. I can hum in my throat. It is not good.'],
    [/josiah/, 'Boy king. Searched. Then did something. That is the whole trick.'],
    [/patrick|balcony|bird/, 'City balcony. Tiny birds. Tiny bugs. Big God. Look out a window later and steal Patrick’s move.'],
    [/mary/, 'Mary kept things in her heart and thought about them. That is allowed during a meeting.'],
    [/ebed|jeremiah|cistern|well/, 'Someone was stuck in a hole. Someone else got a rope. Jehovah noticed. Tag the real qualities, not “famous.”']
  ];
  for(const [re,ans] of lines){if(re.test(s)) return ans}
  const fallbacks=[
    'I heard you. I do not have thumbs, so you have to tap the game.',
    'Hmm. Try highlighting the sentence that made your brain itch.',
    'Woof woof, which in Brutus means: look at Maddy words, then play.',
    'That is a good question. The paragraph probably already answered it. I checked with my nose.'
  ];
  return fallbacks[Math.floor(Math.random()*fallbacks.length)];
}
function paintChat(){
  const log=document.getElementById('chatLog');
  const chips=document.getElementById('chatChips');
  if(!log) return;
  log.innerHTML=(state.chat.length?state.chat:[{who:'dog',t:'Hi. I am Brutus. Ask me a question. I have a few answers and a lot of fur.'}]).map(m=>`<div class="bubble ${m.who==='me'?'me':'dog'}">${esc(m.t)}</div>`).join('');
  log.scrollTop=log.scrollHeight;
  chips.innerHTML=CHIPS.map(c=>`<button class="chipAsk" data-chip="${esc(c)}">${esc(c)}</button>`).join('');
  chips.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>askBrutus(b.dataset.chip));
}
function askBrutus(text){
  text=String(text||'').trim(); if(!text) return;
  state.chat.push({who:'me',t:text});
  state.chat.push({who:'dog',t:brutusReply(text)});
  if(state.chat.length>24) state.chat=state.chat.slice(-24);
  save(); paintChat();
}
document.getElementById('chatForm').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('chatInput');askBrutus(i.value);i.value=''});
document.getElementById('closeChat').addEventListener('click',()=>document.getElementById('chat').classList.remove('open'));

/* Draw */
function openDraw(){document.getElementById('drawOverlay').classList.add('open');setupCanvas()}
function closeDraw(){document.getElementById('drawOverlay').classList.remove('open');saveDrawing()}
function setupCanvas(){
  canvas=document.getElementById('drawCanvas'); if(!canvas) return;
  const r=canvas.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);
  if(canvas.width!==Math.round(r.width*dpr)||canvas.height!==Math.round(r.height*dpr)){
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    canvas.style.width=r.width+'px'; canvas.style.height=r.height+'px';
    ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineCap='round'; ctx.lineJoin='round';
    if(drawState.drawing){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=drawState.drawing}
  }
  canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=pos(e);lastX=p.x;lastY=p.y;saveHistory();stroke(p.x,p.y,p.x,p.y)};
  canvas.onpointermove=e=>{if(!drawing)return;const p=pos(e);stroke(lastX,lastY,p.x,p.y);lastX=p.x;lastY=p.y;saveDrawing()};
  canvas.onpointerup=()=>drawing=false; canvas.onpointercancel=()=>drawing=false;
}
function stroke(x1,y1,x2,y2){
  if(!ctx) return;
  ctx.globalCompositeOperation=drawState.erase?'destination-out':'source-over';
  ctx.strokeStyle=drawState.color; ctx.lineWidth=drawState.erase?Math.max(10,drawState.size*2):drawState.size;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function saveHistory(){if(canvas){drawState.history.push(canvas.toDataURL('image/png'));if(drawState.history.length>20)drawState.history.shift();drawState.redo=[]}}
function saveDrawing(){if(canvas){drawState.drawing=canvas.toDataURL('image/png');try{localStorage.setItem('smb-drawing-sunday',drawState.drawing)}catch(e){}}}
function clearDraw(){if(!canvas||!ctx)return;saveHistory();ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,canvas.width,canvas.height);saveDrawing()}
function undoDraw(){if(!canvas||!drawState.history.length)return;drawState.redo.push(canvas.toDataURL('image/png'));const d=drawState.history.pop();restoreDrawing(d);drawState.drawing=d}
function redoDraw(){if(!canvas||!drawState.redo.length)return;drawState.history.push(canvas.toDataURL('image/png'));const d=drawState.redo.pop();restoreDrawing(d);drawState.drawing=d}
function restoreDrawing(d){const im=new Image();im.onload=()=>{const r=canvas.getBoundingClientRect();ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,r.width,r.height)};im.src=d}
function saveImage(){if(!canvas)return;const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='maddys-meeting-drawing.png';a.click()}

const sw=document.getElementById('swatches');
PALETTE.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.style.background=c;b.onclick=()=>{drawState.color=c;drawState.erase=false;document.getElementById('fullColor').value=c.startsWith('#')&&c.length===7?c:'#182033'};sw.appendChild(b)});
document.getElementById('fullColor').oninput=e=>{drawState.color=e.target.value;drawState.erase=false};
document.getElementById('penSize').oninput=e=>drawState.size=Number(e.target.value);
document.getElementById('eraseDraw').onclick=()=>{drawState.erase=!drawState.erase;document.getElementById('eraseDraw').textContent=drawState.erase?'Pen':'Eraser'};
document.getElementById('closeDraw').onclick=closeDraw;
document.getElementById('undoDraw').onclick=undoDraw;
document.getElementById('redoDraw').onclick=redoDraw;
document.getElementById('clearDraw').onclick=clearDraw;
document.getElementById('saveDraw').onclick=saveImage;
document.getElementById('newDraw').onclick=()=>{if(confirm('New drawing?')){clearDraw();drawState.history=[];drawState.redo=[]}};
window.addEventListener('resize',()=>{if(document.getElementById('drawOverlay').classList.contains('open'))setupCanvas()});
try{drawState.drawing=localStorage.getItem('smb-drawing-sunday')||null}catch(e){}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
load();
if(state.screen==='transition' && !state.talkDone && !state.test){state.screen='talk'; save()}
paintChat(); render();
document.getElementById('closeSheet').addEventListener('click',closeSheet);
window.addEventListener('popstate',closeSheet);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && location.pathname.toLowerCase().endsWith('.pdf')){
    location.replace('./');
  }
});
</script>
