<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sunday Meeting Buddy</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182033;--muted:#687089;--accent:#6d5dfc;--accent2:#4f46c5;--gold:#f4b942;--good:#2e9b62;--bad:#d95555;--line:#e3e7ef;--shadow:0 10px 30px rgba(25,35,65,.09)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)} button,input{font:inherit} button{border:0;cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:800}.stars{font-weight:800;color:#9b6b00;background:#fff6d8;border:1px solid #f3df9a;padding:7px 11px;border-radius:999px}.wrap{width:min(1120px,100%);margin:0 auto;padding:22px 18px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px}.hero{text-align:center;padding:38px 24px}.eyebrow{color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hero h1{font-size:clamp(2rem,6vw,3.4rem);margin:8px 0}.hero p{color:var(--muted);max-width:620px;margin:0 auto 26px;line-height:1.55}.field{display:grid;gap:7px;text-align:left;margin:12px auto;max-width:620px}.field label{font-weight:700}.field input{width:100%;padding:13px 14px;border:1px solid #ccd3e0;border-radius:12px;background:#fff}.primary{background:var(--accent);color:white;padding:13px 18px;border-radius:12px;font-weight:800}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eef0ff;color:var(--accent2);padding:11px 14px;border-radius:11px;font-weight:750}.ghost{background:transparent;color:var(--muted);padding:9px}.danger{color:var(--bad)}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:18px}.headerline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.headerline h2{margin:4px 0}.pill{padding:7px 10px;border-radius:999px;background:#f0f2f8;color:var(--muted);font-size:.82rem;font-weight:700}.talkbox{text-align:center;padding:44px 24px}.talkbox .mic{font-size:4rem}.talkbox h1{font-size:clamp(2rem,6vw,4rem);margin:8px 0}.lock{display:grid;place-items:center;text-align:center;min-height:260px}.lock .big{font-size:4rem}.timer{font-variant-numeric:tabular-nums;font-size:2rem;font-weight:900}.timer.ready{color:var(--good)}.progress{height:10px;background:#e9ecf3;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:width .3s}.article{display:grid;gap:16px}.article h2{margin:0}.article-meta{color:var(--muted);font-size:.9rem}.toggle{display:flex;gap:6px;background:#eef0f5;border-radius:12px;padding:4px;width:max-content}.toggle button{padding:8px 12px;border-radius:9px;background:transparent;color:var(--muted);font-weight:800}.toggle button.active{background:#fff;color:var(--ink);box-shadow:0 2px 7px rgba(0,0,0,.08)}.actualbox{min-height:230px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#f8f9fc}.actualbox iframe{width:100%;height:420px;border:0;display:block}.easy{font-size:1.12rem;line-height:1.65;background:#f4f1ff;border:1px solid #ddd7ff;border-radius:16px;padding:20px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#f4f6fa;border:1px solid var(--line);padding:8px 10px;border-radius:999px;font-size:.88rem}.question{background:#fff9e8;border:1px solid #f1dda4;border-radius:16px;padding:18px}.question strong{display:block;margin-bottom:7px}.activity{border:2px solid #e2e5ef;border-radius:18px;padding:18px}.activity h3{margin-top:0}.answers{display:grid;gap:9px}.answer{padding:12px 14px;border:1px solid #ccd3e0;border-radius:12px;background:white;text-align:left;font-weight:700}.answer.correct{border-color:#75c79b;background:#edf9f2}.answer.wrong{border-color:#ef9999;background:#fff0f0}.feedback{min-height:25px;margin-top:10px;font-weight:750}.scoreline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}.mini-stars{color:#9b6b00;font-weight:900}.interaction{display:flex;flex-wrap:wrap;gap:8px}.interact{background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:11px;font-weight:750;color:var(--ink)}.interact.used{background:#eef9f2;border-color:#a6d8bb;color:#26794d}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.nextnote{color:var(--muted);font-size:.9rem}.source{font-size:.82rem;color:var(--muted);line-height:1.45}.testbar{background:#fff4d7;border-bottom:1px solid #f0db9a;padding:7px 12px;text-align:center;font-size:.82rem;font-weight:800;color:#765400}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e2535;color:white;padding:10px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1}.finish{text-align:center;padding:50px 20px}.bigstars{font-size:3rem;letter-spacing:5px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.actualbox iframe{height:360px}}@media(max-width:560px){.wrap{padding:14px 10px 30px}.card{padding:16px;border-radius:16px}.actualbox iframe{height:300px}.top{padding:10px 12px}.bottom{align-items:stretch;flex-direction:column}.bottom button{width:100%}}
</style></head>
<body>
<div id="app" class="app">
<section class="card hero" style="margin:22px 18px;">
<div class="eyebrow">Sunday Meeting</div>
<h1>Sunday Meeting Buddy 🌿</h1>
<p>Loading the meeting buddy… If this message stays here, this browser is not running the app’s interactive JavaScript.</p>
</section>
</div><div id="toast" class="toast"></div>
<script>
const WT='https://cfp2.jw-cdn.org/a/ef57a1/2/o/w_E_202607.pdf';
const SONGS='https://cfp2.jw-cdn.org/a/ee6bac/1/o/sjjsm_E.pdf';
// PDF viewer page numbers are 1-based. The article occupies PDF pages 14–18.
const paras=[
[1,14,'We can get to know Jehovah—not merely by learning facts about him, but by learning what he is like and how he feels.','Think of knowing Jehovah like knowing a person, not just knowing facts about them. We want to learn what makes him happy and what kind of person he is.','What does it mean to come to know Jehovah?',['Knowing facts about Jehovah','Knowing the Person behind the name','Only knowing his name']],
[2,14,'Those who dedicate themselves to Jehovah never stop coming to know him. There is always more to learn about what makes him happy and how to deepen our trust in him.','Even if you have known about Jehovah for a long time, you can keep learning more about him.','What is something we can keep doing no matter how long we have served Jehovah?',['Keep getting to know Jehovah','Stop studying once we know the basics','Only learn things that help us at school']],
[3,14,'The article considers three questions: What does it mean to come to know Jehovah? Why should we continue to get to know him better? And how do we get to know him better?','This study answers three big questions about knowing Jehovah better.','Which three questions does this article discuss?',['What, why, and how','Who, where, and when','When, where, and how long']],
[4,14,'Jeremiah 24:7 shows that coming to know Jehovah involves the heart, including our feelings and motives. Knowing about God is different from knowing the Person behind the name.','Knowing Jehovah is more than memorizing facts. It involves our feelings and motives too.','What part of us is involved in coming to know Jehovah?',['Our heart, including feelings and motives','Only our memory','Only our ability to read']],
[5,14,'Josiah did more than study. He acted on what he learned by upholding justice and defending afflicted and poor people. Jehovah connected those actions with knowing Him.','Josiah showed that he knew Jehovah by putting what he learned into action and treating people fairly.','What did Josiah do with what he learned about Jehovah?',['He acted on it','He kept it secret','He stopped studying']],
[6,14,'The more we come to know Jehovah, the more we come to trust him. Paul’s experiences and what he had learned moved him to trust Jehovah even during his final imprisonment.','Learning about Jehovah and seeing his help can make our trust in him stronger.','What can grow as we come to know Jehovah?',['Trust in him','Fear of learning','Our need to know less']],
[7,15,'After many years, we might focus mostly on how Bible information benefits us or others. The Scriptures also reveal much about their Author, so we should ask what the information tells us about Jehovah.','When we study, we should not only ask, “How does this help me?” We can also ask, “What does this teach me about Jehovah?”','What question should we remember to ask when studying the Bible?',['What does this tell me about Jehovah?','How quickly can I finish?','Can I skip this part?']],
[8,15,'As we get to know Jehovah better, our friendship with him grows stronger. Learning more about him can move us to praise and thank him and deepen our gratitude.','Learning more about Jehovah can make us feel closer to him and more thankful.','What can happen to our friendship with Jehovah as we know him better?',['It can grow stronger','It becomes less important','It disappears']],
[9,15,'Taking notice of Jehovah means remembering what we have learned about him and thinking about how our actions affect him. Like remembering a mate can guide choices, thinking about Jehovah can help us make choices that please him.','Remembering Jehovah and thinking about how our choices affect him can help us make better choices.','How can thinking about Jehovah affect our decisions?',['It can help us make choices that please him','It makes decisions unnecessary','It only helps with schoolwork']],
[10,15,'We are made in Jehovah’s image and can reflect his qualities. Learning his qualities helps us understand how to imitate him, including showing justice, mercy, and faithfulness.','The more we learn about Jehovah’s qualities, the better we can copy those good qualities in our own actions.','What can learning Jehovah’s qualities help us do?',['Imitate those qualities','Ignore them','Only memorize their names']],
[11,15,'People come to know Jehovah in different ways, including through Christian parents, Bible study, and studying Scriptural accounts and creation.','Different people may first learn about Jehovah in different ways, but we can all keep learning about him.','Which is one way a person may first come to know Jehovah?',['Through parents or a Bible study','Only through a school class','Only by traveling']],
[12,16,'We can learn more about Jehovah by reading and studying his Word. Bible accounts can teach us about Jehovah’s qualities when we think about what the events reveal about him.','When you read a Bible story, look for what it teaches you about Jehovah, not just what happened in the story.','What should we look for in Bible accounts?',['What they teach us about Jehovah','Only the number of people involved','Only the location']],
[13,16,'The account involving Ebed-melech shows that we can look for qualities of Jehovah as well as qualities of faithful people. We can identify those qualities and thank and praise Jehovah for them.','A Bible story can teach us about people and about Jehovah. We can look for Jehovah’s qualities and thank him for them.','When reading a Bible account, what can we identify?',['Qualities of Jehovah reflected in the account','Only the hardest word','Only the date']],
[14,16,'We can learn about Jehovah by meditating on his creative works. Simply seeing nature is not enough; we need to think and reason about what creation reveals about its Creator.','Looking at nature can teach us about Jehovah when we stop and think about what we see.','What should we do when observing creation?',['Think about what it reveals about the Creator','Just look without thinking','Ignore small details']],
[15,17,'Patrick observed insects and birds from his city balcony and thought about what their behavior revealed about Jehovah’s care for his creatures.','Even in a city, you can notice little things in nature and think about what they show about Jehovah.','What did Patrick do that helped him learn about Jehovah?',['He observed creation and thought about what it showed','He left the city','He stopped noticing nature']],
[16,17,'Mary meditated on what her experience revealed about Jehovah, including his power, mercy, impartiality, and interest in lowly ones. We can similarly reflect on what our own experiences teach us about Jehovah.','When Jehovah helps us, we can stop and think: “What did this teach me about Jehovah?”','What can we ask ourselves after experiencing Jehovah’s help?',['What did this teach me about Jehovah?','How can I forget it?','Why should I never think about it again?']],
[17,18,'We will never stop learning about Jehovah. His understanding is beyond measure, and we will continue to learn through new experiences and what he does.','There will always be more to learn about Jehovah. We never reach the end of learning about our loving Father.','Why will we never stop learning about Jehovah?',['There is always more to learn about him','Because learning is impossible','Because we forget everything']],
];
const DEFAULT_STATE={screen:'setup',talk:'',opening:'',p:0,view:'actual',stars:0,earned:{},activityStars:{},materialAwarded:{},attempts:{},test:true,meetingStarted:null,wtUnlocked:false};
let state={...DEFAULT_STATE,earned:{},activityStars:{},materialAwarded:{},attempts:{}};
function load(){try{const raw=localStorage.getItem('smb-state');if(raw){const saved=JSON.parse(raw);state={...DEFAULT_STATE,...saved,earned:{...DEFAULT_STATE.earned,...(saved.earned||{})},activityStars:{...DEFAULT_STATE.activityStars,...(saved.activityStars||{})},materialAwarded:{...DEFAULT_STATE.materialAwarded,...(saved.materialAwarded||{})},attempts:{...DEFAULT_STATE.attempts,...(saved.attempts||{})}}}}catch(e){console.warn('Could not restore saved session',e)}}
function save(){try{localStorage.setItem('smb-state',JSON.stringify(state))}catch(e){console.warn('Could not save session',e)}}
load();
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)};
function top(){return `<div class="top"><div class="brand">🌿 Sunday Meeting Buddy</div><div class="stars">⭐ ${state.stars}</div></div>`}
function render(){let c=''; if(state.screen==='setup')c=setup(); if(state.screen==='talk')c=talk(); if(state.screen==='transition')c=transition(); if(state.screen==='wt')c=watch(); if(state.screen==='finish')c=finish(); document.getElementById('app').innerHTML=top()+(state.test?'<div class="testbar">TEST MODE — timers are bypassed so you can explore the whole meeting.</div>':'')+`<main class="wrap">${c}</main>`; bind();}
function setup(){return `<section class="card hero"><div class="eyebrow">Sunday Meeting</div><h1>Let's get ready! 🌿</h1><p>The meeting starts at 10:00. Set up today's public talk, then the app will transition to Watchtower Study when it unlocks at 10:30.</p><div class="field"><label>Public talk title</label><input id="talk" placeholder="Enter the talk title" value="${esc(state.talk||'')}"></div><div class="field"><label>Opening song number</label><input id="opening" inputmode="numeric" placeholder="Song number" value="${esc(state.opening||'')}"></div><label style="display:flex;align-items:center;justify-content:center;gap:9px;margin:16px 0;font-weight:750"><input id="testMode" type="checkbox" ${state.test?'checked':''}> Test mode — let me click through everything without waiting</label><button class="primary" id="start">START THE MEETING</button><p class="source">Watchtower source: July 2026 study issue. Lead sheets open from the supplied “Sing Out Joyfully” PDF.</p></section>`}
function talk(){return `<section class="card talkbox"><div class="mic">🎤</div><div class="eyebrow">Public Talk</div><h1>${esc(state.talk||'Public Talk')}</h1><p>Listen, think, and enjoy the talk. There is no public-talk countdown here.</p><div class="card" style="margin:24px auto;max-width:520px;box-shadow:none"><strong>Opening Song ${esc(state.opening||'—')}</strong><br><button class="secondary" style="margin-top:10px" onclick="song(${Number(state.opening)||12})">View Lead Sheet</button></div><div class="lock"><div><div class="big">🔒</div><strong>Watchtower unlocks at 10:30 AM</strong><p>In test mode, you can unlock it now.</p><button class="primary" id="toTrans">GO TO WATCHTOWER TRANSITION</button></div></div></section>`}
function transition(){const now=new Date();const unlock=new Date(now);unlock.setHours(10,30,0,0);const ready=state.test||now>=unlock||state.wtUnlocked;return `<section class="card hero"><div class="eyebrow">10:30 AM</div><h1>${ready?'Watchtower Study is ready! 📖':'Watchtower Study is not ready yet 🔒'}</h1><p>${ready?'Next song: ':'The Watchtower portion unlocks at 10:30 AM. In test mode, you can bypass the clock.'}<strong>Song 28 — Gaining Jehovah’s Friendship</strong></p><button class="secondary" onclick="song(28)">View Song 28 Lead Sheet</button><br><br><button class="primary" id="beginWT" ${ready?'':'disabled'}>BEGIN WATCHTOWER STUDY</button></section>`}
function watch(){const d=paras[state.p];const key=d[0];const earned=state.earned[key]||0;const inter=state.materialAwarded[key]||0;const att=state.attempts[key]||0;const activityScore=state.activityStars[key]??null;const elapsed=state.meetingStarted?Date.now()-state.meetingStarted:0;const remaining=Math.max(0,150000-elapsed);const ready=state.test||remaining===0;return `<div class="grid"><section class="article"><div class="card"><div class="headerline"><div><div class="eyebrow">Watchtower Study</div><h2>Paragraph ${d[0]} of 17</h2><div class="article-meta">Are You Getting to Know Jehovah Better? · September 21–27, 2026</div></div><div class="pill">⭐ ${earned}/3 earned</div></div><div class="progress" style="margin-top:15px"><div style="width:${(d[0]/17)*100}%"></div></div></div><div class="card"><div class="toggle"><button class="${state.view==='actual'?'active':''}" id="actual">📖 Actual</button><button class="${state.view==='easy'?'active':''}" id="easy">🧒 Maddy's words</button></div><div style="margin-top:14px">${state.view==='actual'?`<div class="actualbox"><iframe title="Watchtower source page" src="${WT}#page=${d[1]}" loading="lazy"></iframe></div>`:`<div class="easy"><strong>In Maddy's words:</strong><br>${d[3]}</div>`}</div><div class="interaction" style="margin-top:12px"><button class="interact ${inter?'used':''}" id="markEasy">🧒 Read Maddy's version</button><button class="interact ${inter?'used':''}" id="markQuestion">❓ Think about the question</button><button class="interact ${inter?'used':''}" id="markScripture">📜 Explore the scriptures</button><button class="interact ${inter?'used':''}" id="markPage">🖼️ Look at the original page</button></div><div class="question" style="margin-top:14px"><strong>Study question</strong>${d[4]}</div></div><div class="card activity"><h3>🎮 Think-It-Through Activity</h3><p>Choose the answer you think is right. You get <strong>2 activity stars</strong> for a first-try answer, 1 for a second try, and 0 after that.</p><div class="answers">${d[5].map((x,i)=>`<button class="answer" data-i="${i}">${x}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="scoreline"><span>Activity stars: <span class="mini-stars">${activityScore==null?'—':activityScore+' / 2'}</span></span><span>Material star: <span class="mini-stars">${inter?'⭐':'—'}</span></span></div></div><div class="bottom"><div class="nextnote">${state.test?'Test mode: you can advance now.':ready?'Time is up — paragraph complete!':'Next unlocks when this paragraph’s time is up.'}</div><button class="primary" id="next" ${ready?'':'disabled'}>${state.p===16?'FINISH STUDY':'NEXT PARAGRAPH →'}</button></div></section><aside class="card"><div class="eyebrow">Paragraph timer</div><div class="timer ${ready?'ready':''}" id="timer">${state.test?'TEST':fmt(remaining)}</div><p class="source">Default meeting allotment: 2:30 per paragraph. The timer controls advancement only; it does not hide the content or activities.</p><hr style="border:0;border-top:1px solid var(--line)"><button class="secondary" onclick="song(12)">🎵 Song 12 Lead Sheet</button><br><br><button class="secondary" onclick="song(28)">🎵 Song 28 Lead Sheet</button></aside></div>`}
function finish(){return `<section class="card finish"><div class="bigstars">⭐⭐⭐</div><div class="eyebrow">Study complete</div><h1>Great job, Maddy!</h1><p>You finished all 17 paragraphs and earned <strong>${state.stars} stars</strong> this session.</p><button class="primary" id="restart">START OVER</button></section>`}
function fmt(ms){let s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bind(){
 const start=document.getElementById('start');if(start)start.onclick=()=>{state.talk=document.getElementById('talk').value.trim()||'Public Talk';state.opening=document.getElementById('opening').value.trim();state.test=!!document.getElementById('testMode')?.checked;state.screen='talk';state.meetingStarted=Date.now();state.wtUnlocked=false;state.p=0;state.view='actual';state.stars=0;state.earned={};state.activityStars={};state.materialAwarded={};state.attempts={};save();render()};
 const tr=document.getElementById('toTrans');if(tr)tr.onclick=()=>{state.screen='transition';save();render()};
 const bw=document.getElementById('beginWT');if(bw&&!bw.disabled)bw.onclick=()=>{state.wtUnlocked=true;state.screen='wt';state.p=0;state.meetingStarted=Date.now();save();render()};
 if(state.screen==='transition'&&!state.test&&!state.wtUnlocked){const check=()=>{const n=new Date(),u=new Date(n);u.setHours(10,30,0,0);if(n>=u){state.wtUnlocked=true;save();render()}else setTimeout(check,1000)};check()}
 if(state.screen==='wt'&&!state.test){const tick=()=>{const timer=document.getElementById('timer');const next=document.getElementById('next');const elapsed=state.meetingStarted?Date.now()-state.meetingStarted:0;const remaining=Math.max(0,150000-elapsed);if(timer)timer.textContent=fmt(remaining);if(remaining===0&&next){next.disabled=false;next.classList.add('ready');document.querySelector('.nextnote').textContent='Time is up — paragraph complete!'}else setTimeout(tick,1000)};tick()}
 const a=document.getElementById('actual');if(a)a.onclick=()=>{state.view='actual';save();render()};const e=document.getElementById('easy');if(e)e.onclick=()=>{state.view='easy';awardMaterial(paras[state.p][0]);save();render()};
 ['markEasy','markQuestion','markScripture','markPage'].forEach(id=>{const x=document.getElementById(id);if(x)x.onclick=()=>{awardMaterial(paras[state.p][0]);save();render()}});
 document.querySelectorAll('.answer').forEach(x=>x.onclick=()=>answer(Number(x.dataset.i),x));
 const n=document.getElementById('next');if(n)n.onclick=()=>advance();const r=document.getElementById('restart');if(r)r.onclick=()=>{state={...DEFAULT_STATE,screen:'setup',talk:'',opening:'',p:0,view:'actual',stars:0,earned:{},activityStars:{},materialAwarded:{},attempts:{},test:true,meetingStarted:null,wtUnlocked:false};save();render()};
}
function awardMaterial(key){if(!state.materialAwarded[key]){state.materialAwarded[key]=1;state.earned[key]=(state.earned[key]||0)+1;state.stars+=1}}
function answer(i,el){const key=paras[state.p][0];if(state.activityStars[key]!==undefined)return;state.attempts[key]=(state.attempts[key]||0)+1;const attempts=state.attempts[key];document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(i===0){el.classList.add('correct');const score=attempts===1?2:attempts===2?1:0;document.getElementById('feedback').textContent=score?`Correct! You earned ${score} activity star${score===1?'':'s'}. ⭐`:'Correct! Nice persistence.';state.activityStars[key]=score;state.earned[key]=(state.earned[key]||0)+score;state.stars+=score;}else{el.classList.add('wrong');document.getElementById('feedback').textContent=attempts===1?'Not quite — try again!':attempts===2?'Not quite — one more thoughtful try.':'Keep thinking about the paragraph.';document.querySelectorAll('.answer').forEach(b=>b.disabled=false);return}save();render()}
function advance(){const key=paras[state.p][0]; if(state.p===16){state.screen='finish'}else{state.p++;state.view='actual';state.meetingStarted=Date.now()}save();render()}
function song(n){let page=n===12?14:n===28?36:14;window.open(`${SONGS}#page=${page}`,'_blank','noopener');}
render();
</script></body></html>
