<div id="brutusOverlay" class="drawOverlay"><div class="card" style="max-width:520px;width:100%;margin:auto;text-align:center"><div style="font-size:90px">🐕</div><div class="eyebrow">Brutus</div><h2 style="margin:6px 0 10px">Your meeting buddy is here. 🐾</h2><p class="source">Brutus is ready to keep you company while you listen, think, draw, and play.</p><button class="primary" id="closeBrutus">OK, Brutus!</button></div></div><div id="drawOverlay" class="drawOverlay"><div class="drawPanel"><div class="drawHead"><strong>✏️ Drawing</strong><div class="drawTools"><button class="secondary" id="undoDraw">↩️</button><button class="secondary" id="redoDraw">↪️</button><button class="secondary" id="clearDraw">Clear</button><button class="primary" id="saveDraw">Save Image</button><button class="ghost" id="closeDraw">✕</button></div></div><div class="drawTools" style="padding:8px 14px;border-bottom:1px solid var(--line)"><span style="font-weight:800">Pen</span><button class="swatch" style="background:#182033" data-color="#182033"></button><button class="swatch" style="background:#6d5dfc" data-color="#6d5dfc"></button><button class="swatch" style="background:#d95555" data-color="#d95555"></button><button class="swatch" style="background:#2e9961" data-color="#2e9961"></button><button class="swatch" style="background:#f3b73f" data-color="#f3b73f"></button><label style="display:flex;align-items:center;gap:6px">Size <input id="penSize" type="range" min="2" max="24" value="5"></label></div><div class="drawCanvasWrap"><canvas id="drawCanvas"></canvas></div><div class="drawFoot"><span class="source">Your sketch stays on this device.</span><button class="secondary" id="newDraw">New Drawing</button></div></div></div>
<script>
const WT='w_E_202607.pdf', SONGS='sjjsm_E.pdf';
const pTexts={
1:`Have you ever thought about the depth of Jehovah’s knowledge, the vastness of his wisdom, or the scope of his accomplishments? We are humbled when we think about our Creator, as the apostle Paul was.`,
2:`Although we will never know everything there is to know about Jehovah, it is possible, to a certain extent, to get to know what he is like. King David told his son Solomon: “Know the God of your father and serve him with a complete heart . . . If you search for him, he will let himself be found by you.” We can gain knowledge of the One who is true, and Jesus showed that knowledge of Jehovah is available to those to whom he reveals him.`,
3:`All who dedicated themselves to Jehovah have already learned many things about him. Yet, we never stop “coming to know” Jehovah. We can always learn more about what makes him happy and how to deepen our trust in him. Let us consider three questions: What does it mean to come to know Jehovah? Why should we continue to get to know him better? And how do we get to know him better?`,
4:`We learn what is involved in coming to know Jehovah by considering what he said about the Jews who would return from exile. Jehovah promised: “I will give them a heart to know me, that I am Jehovah.” Surely those who returned from Babylon already knew basic facts about Jehovah. But their efforts to come to know Jehovah would need to involve their heart, including their feelings and motives. There is a marked difference between knowing about God and knowing God. We need to know more than the fact that Jehovah has a name and that he is God. We want to come to know the Person behind the name.`,
5:`As we come to know Jehovah, we learn what makes him happy and what displeases him. Consider the example of King Josiah. The Bible says that while he was still a boy, he started to search for the God of David his forefather. But Josiah did more than study. He acted on what he was learning. Jehovah said that Josiah upheld justice and righteousness and defended the afflicted and the poor. Then Jehovah asked: “Is that not what it means to know me?”`,
6:`Read Psalm 9:10. The more we come to know Jehovah, the more we come to trust in him. That principle proved true for the apostle Paul. During his final imprisonment and not long before his death, he wrote: “I am not ashamed. For I know the One whom I have believed.” What Paul had learned and experienced during his life moved him to trust in his God implicitly.`,
7:`Over time, we may not put as much effort into getting to know Jehovah as we did when we first learned about him. When reading the Bible on our own or along with others at congregation meetings, we may tend to focus on how the information can help us personally or how we can use it to help others. The Scriptures encourage us to do that. But the Bible also reveals much about its Author. We should never be so absorbed in how the Bible’s message benefits us or others that we fail to ask ourselves, “What does this tell me about Jehovah God?”`,
8:`As we get to know Jehovah better, our friendship with him will grow stronger. For example, how do you feel about Jehovah after you do your daily Bible reading, watch a monthly broadcast, or attend an assembly or a convention? We often feel closer to our heavenly Father because we have learned more about him. As a result, we are moved to praise and thank him. Every effort we make to get to know Jehovah deepens our gratitude for our priceless friendship with him.`,
9:`When we “take notice of” Jehovah—recalling what we have learned about him and thinking about how our actions affect him—we will make better decisions. Many brothers and sisters keep a photograph of their mate on their desk, in their wallet, or on their phone. This helps them to think fondly and often about their mate, to make decisions that they know will please their mate, and to avoid anything that would hurt that person. Similarly, the more often we think about Jehovah, the more likely we will be to make choices that please him.`,
10:`We are made in Jehovah’s image, which gives us the ability to reflect his qualities. And the more we learn about Jehovah’s qualities, the better we will understand how to imitate him. Jesus condemned the scribes and Pharisees for their failure to show godly qualities. Unlike those religious leaders, let us do our best to understand how Jehovah’s qualities are reflected in his laws and principles. Doing so will help us to demonstrate those very qualities.`,
11:`Who introduced you to Jehovah? Perhaps you were raised by Christian parents. They likely related Bible accounts that reveal God’s qualities and taught you how the things he created reflect his personality. Or you may have accepted a Bible study from one of Jehovah’s Witnesses. Using a study aid, your Bible teacher helped you to analyze the Scriptures and apply what you learned. Regardless of how we were introduced to Jehovah, we can continue learning about him.`,
12:`First, we can learn more about Jehovah by studying his Word. As you read a Bible account, look for what it can teach you about Jehovah. For example, when reading about a faithful servant, notice qualities that Jehovah values and qualities that Jehovah himself shows.`,
13:`Consider the account of Ebed-melech, who rescued the prophet Jeremiah. Doubtless, you quickly identify ways that you can imitate Ebed-melech’s self-sacrifice, courage, and love for his fellow worshippers. But you can also look for what the account teaches you about Jehovah. Identify qualities reflected in the account and thank and praise Jehovah for them.`,
14:`Second, we can learn more about Jehovah by meditating on his creative works. Simply observing the natural world is not enough. We must think and reason on what we see in order to discern the qualities of our Creator. God’s invisible qualities are clearly seen from the world’s creation onward, because they are perceived by the things made.`,
15:`Many of us live in urban areas that seem distant from the natural world. If this is your situation, can you still learn lessons from creation? Consider Patrick, who lives in Brazzaville, a large city in the Republic of the Congo. He strives to observe creation from his balcony. He often sees tiny insects or small birds looking for food or a place to live. Once, he observed some birds making their nest. He thought deeply about what this revealed about the Creator and learned that Jehovah cares about the well-being of his creatures.`,
16:`A third way we can get to know Jehovah better is by meditating on our own experiences. That is what Jesus’ mother, Mary, did. She already knew Jehovah well, but she had found favor with him. When she was given the weighty assignment of becoming the mother of God’s Son, Jehovah strengthened and reassured her through the angel Gabriel and her relative Elizabeth. She later meditated on what her experience had revealed about Jehovah—including his power, mercy, impartiality, and interest in even the lowly ones. When you receive help from Jehovah, ask yourself: “What has this taught me about Jehovah? Which qualities of Jehovah has this help revealed?”`,
17:`Think of how much more we will learn about Jehovah in the new world. We will have new things to learn and experience. Our understanding will deepen as we experience new things, including our loved ones being resurrected and our getting closer to perfection every day.`,
18:`We will never stop getting to know Jehovah. He has already lived for an eternity, so his understanding is beyond measure. We will never find out the work that the true God has made from start to finish. Therefore, regardless of how long we have been in the truth, may we seize every opportunity to learn more about our loving Father.`
};
const easy={1:`We can learn facts about Jehovah, but we also want to learn what he is like and what matters to him.`,2:`You can keep learning about Jehovah your whole life. There is always more to discover about him.`,3:`The article asks three big questions: What does it mean to know Jehovah? Why keep learning about him? And how can we learn more?`,4:`Knowing Jehovah is more than knowing facts. We want to know the Person behind his name, including his feelings and motives.`,5:`Josiah showed that he knew Jehovah by doing what he learned—being fair and helping people who needed help.`,6:`Paul learned from his experiences and trusted Jehovah deeply. Knowing Jehovah better can make our trust stronger.`,7:`When we study the Bible, we can ask not only “How does this help me?” but also “What does this teach me about Jehovah?”`,8:`Learning more about Jehovah can make us feel closer to him and more thankful.`,9:`Remembering Jehovah and thinking about what would please him can help us make better choices.`,10:`Learning Jehovah’s qualities helps us copy those qualities in the way we treat people.`,11:`People meet Jehovah in different ways—through family, Bible study, meetings, and learning from the Scriptures.`,12:`When you read a Bible account, look for what it teaches you about Jehovah, not only what happened.`,13:`Ebed-melech’s story teaches us about good qualities in people and can also help us notice qualities Jehovah values.`,14:`Nature can teach us about Jehovah when we stop and think about what his creations show us.`,15:`Even in a city, Patrick noticed small things in nature and thought about what they showed him about Jehovah.`,16:`When Jehovah helps us, we can stop and ask what that experience taught us about him.`,17:`In the new world, there will still be wonderful things to learn and experience.`,18:`We will never finish learning about Jehovah. There will always be more to discover about our loving Father.`};
const questions={1:`What does it mean to come to know Jehovah?`,2:`What proves that we can get to know Jehovah?`,3:`What will we discuss in this article?`,4:`What is involved in coming to know Jehovah?`,5:`What can we learn from King Josiah regarding what it means to come to know Jehovah?`,6:`As indicated at Psalm 9:10, how will coming to know Jehovah affect us?`,7:`After we have been serving Jehovah for many years, what could happen?`,8:`What impact will getting to know Jehovah better have on our friendship with him?`,9:`When we “take notice” of Jehovah, how will this affect our decisions?`,10:`How will knowing Jehovah’s appealing qualities help us?`,11:`Who introduced you to Jehovah?`,12:`What can we learn about Jehovah from reading the Bible?`,13:`What can we learn about Jehovah from reading the Bible? Give an example.`,14:`What can we do to benefit fully from what we observe in creation?`,15:`What has Patrick done to get to know Jehovah better, and how can you do something similar?`,16:`What helped Mary, Jesus’ mother, come to know Jehovah better, and how can we imitate her?`,17:`Why will we keep learning more about Jehovah?`,18:`Why can we say that we will never stop getting to know Jehovah?`};
const units=[{id:'1',ps:[1],activity:{type:'drag',prompt:'Sort the two ideas. Which one means really knowing a person?',items:[['Know facts about Jehovah',0],['Know the Person behind the name',1]],targets:['Knowing about Jehovah','Knowing Jehovah as a Person']}},{id:'2',ps:[2],activity:{type:'wordsearch',prompt:'Find four words connected to getting to know Jehovah.',words:['SEARCH','HEART','TRUST','KNOW'] }},{id:'3',ps:[3],activity:{type:'crossword',prompt:'Fill in the three words that describe the article’s big questions.',answers:['WHAT','WHY','HOW']}},{id:'4',ps:[4],activity:{type:'picture',prompt:'Tap the three ideas that belong to knowing the Person behind the name.',tiles:['📚 Facts','❤️ Feelings','🧠 Motives','🏷️ Name only','🔢 Numbers','📝 Memorizing'],correct:[1,2,0]}},{id:'5',ps:[5],activity:{type:'order',prompt:'Put Josiah’s example in order.',items:['He learned about Jehovah','He acted on what he learned','He upheld justice and helped others'],correct:[0,1,2]}},{id:'6',ps:[6],activity:{type:'match',prompt:'Match each person or idea with the result.',pairs:[['Paul','Trusted Jehovah'],['Knowing Jehovah','Builds trust'],['Experience','Can strengthen faith']]}},{id:'7',ps:[7],activity:{type:'drag',prompt:'Drag the question that belongs beside Bible study.',items:[['How does this help me?',0],['What does this teach me about Jehovah?',1]],targets:['Questions we might ask','Questions we should remember']}},{id:'8',ps:[8],activity:{type:'picture',prompt:'Reveal the four pieces that show what can grow as we know Jehovah better.',tiles:['🤝 Friendship','🙏 Gratitude','❤️ Love','👏 Praise'],correct:[0,1,2,3]}},{id:'9',ps:[9],activity:{type:'match',prompt:'Match the thought with the result.',pairs:[['Remember Jehovah','Think about him often'],['Think about him','Make better choices'],['Want to please him','Avoid choices that hurt him']]}},{id:'10',ps:[10],activity:{type:'drag',prompt:'Put the learning process in the right places.',items:[['Learn Jehovah’s qualities','Learn'],['Notice how they appear in his principles','Notice'],['Imitate those qualities','Imitate']],targets:['Learn','Notice','Imitate']}},{id:'11',ps:[11],activity:{type:'wordsearch',prompt:'Find four ways people may be introduced to Jehovah.',words:['PARENTS','STUDY','BIBLE','MEETINGS']}},{id:'12-13',ps:[12,13],activity:{type:'hidden',prompt:'Find the four hidden clues in this Bible-study scene. Each clue points to a quality or lesson.',items:['📖','❤️','🛡️','🙏']}},{id:'14',ps:[14],activity:{type:'picture',prompt:'Tap the ideas that help us learn from creation.',tiles:['👀 Observe','🧠 Think','🔎 Reason','🚫 Ignore','🏃 Rush past','❓ Ask what it shows'],correct:[0,1,2,5]}},{id:'15',ps:[15],activity:{type:'wordsearch',prompt:'Find words connected with Patrick’s observation of creation.',words:['BIRDS','INSECTS','NEST','CARE']}},{id:'16',ps:[16],activity:{type:'halfdraw',prompt:'Draw the other half. Then think about what your experiences can teach you about Jehovah.'}},{id:'17-18',ps:[17,18],activity:{type:'crossword',prompt:'Complete the three ideas from the ending: LEARN, FOREVER, FATHER.',answers:['LEARN','FOREVER','FATHER']}}];

function save(){try{localStorage.setItem('smb-state-v7',JSON.stringify(state))}catch(e){}}function load(){try{const s=JSON.parse(localStorage.getItem('smb-state-v7')||'null');if(s)state={...DEFAULT,...s}}catch(e){}}function fmt(ms){let t=Math.ceil(ms/1000),m=Math.floor(t/60),s=t%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function header(){return `<div class="top"><div class="brand">🌿 Sunday Meeting Buddy</div><div class="topActions"><button class="toolBtn" id="brutusOpen">🐕 Brutus</button><button class="toolBtn" id="drawOpen">✏️ Draw</button><div class="stars">⭐ ${state.stars}</div></div></div>`}
function render(){load();let html=header();if(state.test)html+=`<div class="testBanner">TEST MODE — timers and the 10:30 lock are bypassed.</div>`;html+=`<main class="wrap">${state.screen==='setup'?setup():state.screen==='talk'?talk():state.screen==='transition'?transition():state.screen==='wt'?watch():finish()}</main>`;document.getElementById('app').innerHTML=html;bind()}
function setup(){return `<section class="card hero"><div class="eyebrow">Sunday Meeting</div><h1>Let’s get ready! 🌿</h1><p>Meeting starts at 10:00. Set up the public talk and opening song.</p><div class="field"><label>Public talk title</label><input id="talk" placeholder="Enter the talk title" value="${esc(state.talk)}"></div><div class="field"><label>Opening song number</label><input id="opening" inputmode="numeric" placeholder="Song number" value="${esc(state.opening)}"></div><label style="display:flex;justify-content:center;align-items:center;gap:8px;margin:16px 0;font-weight:750"><input id="testMode" type="checkbox" ${state.test?'checked':''}> Test mode</label><button class="primary" id="start">START THE MEETING</button></section>`}
function talk(){return `<section class="card"><div class="headerline"><div><div class="eyebrow">Public Talk</div><h1 style="margin:4px 0">${esc(state.talk||'Public Talk')}</h1></div><button class="secondary" onclick="song(${Number(state.opening)||12})">🎵 Opening Song ${esc(state.opening||'')}</button></div><p class="source">Listen, think, and use any of these if they help.</p><div class="talkGrid"><div class="card talkPrompt"><h3>💡 Something I learned</h3><textarea data-note="learned" placeholder="Type or use dictation…">${esc(state.talkNotes.learned||'')}</textarea></div><div class="card talkPrompt"><h3>📖 A Bible verse I heard</h3><textarea data-note="verse" placeholder="Type or use dictation…">${esc(state.talkNotes.verse||'')}</textarea></div><div class="card talkPrompt"><h3>❤️ Something about Jehovah</h3><textarea data-note="jehovah" placeholder="Type or use dictation…">${esc(state.talkNotes.jehovah||'')}</textarea></div><div class="card talkPrompt"><h3>🤔 Something I want to remember</h3><textarea data-note="remember" placeholder="Type or use dictation…">${esc(state.talkNotes.remember||'')}</textarea></div></div><div class="lock"><strong>Watchtower Study unlocks at 10:30 AM</strong><br><br><button class="primary" id="toTrans">CONTINUE</button></div></section>`}
function transition(){const now=new Date(),u=new Date(now);u.setHours(10,30,0,0);const ready=state.test||state.wtUnlocked||now>=u;return `<section class="card hero"><div class="eyebrow">10:30 AM</div><h1>${ready?'Watchtower Study is ready! 📖':'Almost there… 🔒'}</h1><p>${ready?'Next song:':'The next song and Watchtower unlock at 10:30 AM.'} <strong>Song 28 — Gaining Jehovah’s Friendship</strong></p><button class="secondary" onclick="song(28)">🎵 Song 28 Lead Sheet</button><br><br><button class="primary" id="beginWT" ${ready?'':'disabled'}>BEGIN WATCHTOWER STUDY</button></section>`}
function unit(){return units[state.unit]}
function actualText(u){return u.ps.map(n=>`Paragraph ${n}\n${pTexts[n]}`).join('\n\n')}
function watch(){const u=unit(),key=u.id,earned=state.earned[key]||0,mat=state.materialAwarded[key]||0,score=state.activityStars[key],a=u.activity,elapsed=state.meetingStarted?Date.now()-state.meetingStarted:0,remaining=Math.max(0,150000-elapsed),ready=state.test||remaining===0,qa=state.questionAnswers[key]||'';return `<div class="grid"><section><div class="card"><div class="headerline"><div><div class="eyebrow">Watchtower Study</div><h2>${u.ps.length>1?`Paragraphs ${u.ps[0]}–${u.ps[u.ps.length-1]}`:`Paragraph ${u.ps[0]}`} · Unit ${state.unit+1} of ${units.length}</h2><div class="article-meta">Are You Getting to Know Jehovah Better? · September 21–27, 2026</div></div><div class="pill">⭐ ${earned}/3</div></div><div class="progress" style="margin-top:13px"><div style="width:${(state.unit+1)/units.length*100}%"></div></div></div><div class="card"><div class="toggle"><button id="actual" class="${state.view==='actual'?'active':''}">📖 Actual</button><button id="easy" class="${state.view==='easy'?'active':''}">🧒 Maddy’s words</button></div><div style="margin-top:12px">${state.view==='actual'?`<div class="actualText">${esc(actualText(u))}</div>`:`<div class="easy"><strong>In Maddy’s words:</strong><br>${u.ps.map(n=>easy[n]).join('<br><br>')}</div>`}</div><div class="materialTools"><button class="interact" id="openWT">🖼️ Original page</button><button class="interact" id="scriptureBtn">📜 Scriptures & references</button></div><div class="question"><strong>Think about it</strong><div class="qprompt">${esc(u.ps.map(n=>questions[n]).join(' '))}</div><textarea id="questionAnswer" placeholder="Type your answer…">${esc(qa)}</textarea><button class="secondary" id="saveQuestion" style="margin-top:8px">Save answer</button></div></div>${activityHTML(a,key,score)}<div class="bottom"><div class="nextnote">${state.test?'Test mode: advance whenever you want.':ready?'Unit complete — you can move on.':'Next unlocks when this unit’s time is up.'}</div><button class="primary" id="next" ${ready?'':'disabled'}>${state.unit===units.length-1?'FINISH STUDY':'NEXT →'}</button></div></section><aside class="card timerCard"><div class="eyebrow">Unit timer</div><div class="timer ${ready?'ready':''}" id="timer">${state.test?'TEST':fmt(remaining)}</div><div class="timerLabel">2:30 default</div><p class="source">The timer controls advancement only.</p><div class="sideTools"><button class="secondary" onclick="song(12)">🎵 Song 12 Lead Sheet</button><button class="secondary" onclick="song(28)">🎵 Song 28 Lead Sheet</button></div></aside></div>`}
function activityHTML(a,key,score){let body='';if(a.type==='drag')body=dragHTML(a,key);else if(a.type==='wordsearch')body=wordSearchHTML(a,key);else if(a.type==='crossword')body=crosswordHTML(a,key);else if(a.type==='picture')body=pictureHTML(a,key);else if(a.type==='order')body=orderHTML(a,key);else if(a.type==='match')body=matchHTML(a,key);else if(a.type==='hidden')body=hiddenHTML(a,key);else if(a.type==='halfdraw')body=halfDrawHTML(a,key);return `<div class="card activity"><h3>🎮 ${activityTitle(a.type)}</h3><div class="activityPrompt">${esc(a.prompt)}</div>${body}<div class="feedback" id="feedback"></div><div class="scoreline"><span>Activity: <span class="mini-stars">${score==null?'—':score+' / 2'}</span></span><span>Material: <span class="mini-stars">${state.materialAwarded[key]?'⭐':'—'}</span></span></div></div>`}
function activityTitle(t){return ({drag:'Drag & Drop',wordsearch:'Word Search',crossword:'Mini Crossword',picture:'Picture Puzzle',order:'Put It In Order',match:'Match It',hidden:'Find It',halfdraw:'Draw the Other Half'})[t]||'Game'}
function dragHTML(a,key){return `<div class="dropBoard">${a.targets.map((t,i)=>`<div class="dropZone" data-target="${i}"><h4>${esc(t)}</h4><div class="zoneItems"></div></div>`).join('')}</div><div style="margin-top:10px">${a.items.map((it,i)=>`<div class="dragCard" draggable="true" data-drag="${i}">${esc(it[0])}</div>`).join('')}</div><button class="secondary" id="checkGame" style="margin-top:10px">Check it</button>`}
function wordSearchHTML(a,key){const letters='JEHOVAH' + 'QWERTYUIOPASDFGHJKLZXCVBNM';let seed=key.split('').reduce((x,c)=>x+c.charCodeAt(0),0);let grid=[];for(let i=0;i<64;i++){seed=(seed*9301+49297)%233280;grid.push(letters[Math.floor(seed/233280*letters.length)])}return `<div class="wordsearch">${grid.map((c,i)=>`<button class="wsCell" data-ws="${i}">${c}</button>`).join('')}</div><div class="smallNote" style="margin-top:10px">Find: ${a.words.map(esc).join(' · ')}</div><button class="secondary" id="checkGame" style="margin-top:10px">I found them</button>`}
function crosswordHTML(a,key){return `<div class="crossword">${Array.from({length:49},(_,i)=>{const block=[0,1,2,7,9,14,15,21,27,28,35,36,42,43,44,45,46,47,48].includes(i);return block?'<div class="cwCell block"></div>':`<div class="cwCell"><input maxlength="1" data-cw="${i}"></div>`}).join('')}</div><div class="clueList" style="margin-top:14px">${a.answers.map((x,i)=>`<div class="clue"><strong>${i+1}.</strong> ${esc(i===0?'The question that asks for a thing or idea':i===1?'The question that asks for a reason':'The question that asks for a method')}</div>`).join('')}</div><button class="secondary" id="checkGame" style="margin-top:10px">Check crossword</button>`}
function pictureHTML(a,key){return `<div class="picturePuzzle">${a.tiles.map((x,i)=>`<button class="picturePiece" data-piece="${i}">${x}</button>`).join('')}</div><button class="secondary" id="checkGame" style="margin-top:12px">Check my choices</button>`}
function orderHTML(a,key){return `<div id="orderList" class="answers">${a.items.map((x,i)=>`<button class="answer orderItem" data-order="${i}">${esc(x)}</button>`).join('')}</div><div class="smallNote">Tap an item to move it to the bottom.</div><button class="secondary" id="checkGame" style="margin-top:10px">Check order</button>`}
function matchHTML(a,key){return `<div class="matchCards">${a.pairs.map((p,i)=>`<button class="matchCard" data-match="${i}">${esc(p[0])}</button>`).join('')}</div><div id="matchTargets" style="margin-top:12px"></div><button class="secondary" id="checkGame" style="margin-top:10px">Check matches</button>`}
function hiddenHTML(a,key){return `<div class="hiddenScene">${a.items.map((x,i)=>`<button class="hiddenItem" style="left:${12+i*19}%;top:${22+(i%3)*24}%" data-hidden="${i}">${x}</button>`).join('')}</div><div class="smallNote" style="margin-top:10px">Find all four hidden clues.</div><button class="secondary" id="checkGame" style="margin-top:10px">I found them</button>`}
function halfDrawHTML(a,key){return `<div class="halfWrap"><div class="halfSide"><canvas id="halfCanvas" class="halfCanvas"></canvas></div><div class="halfSide" style="font-size:100px">💚</div></div><div class="smallNote" style="margin-top:10px">Draw on the left to make your own matching half.</div><button class="secondary" id="checkGame" style="margin-top:10px">I’m done</button>`}
function finish(){return `<section class="card finish"><div class="bigstars">🌟🌟🌟</div><div class="eyebrow">Study complete</div><h1>Great job, Maddy!</h1><p>You finished all ${units.length} study units and earned <strong>${state.stars} stars</strong>.</p><div class="finishStats"><div class="stat">${units.length*3} possible stars</div><div class="stat">${Object.values(state.activityStars).reduce((a,b)=>a+b,0)} activity stars</div><div class="stat">${Object.values(state.materialAwarded).reduce((a,b)=>a+b,0)} material stars</div></div><button class="primary" id="restart">START OVER</button></section>`}
function awardMaterial(key){if(!state.materialAwarded[key]){state.materialAwarded[key]=1;state.earned[key]=(state.earned[key]||0)+1;state.stars++;save();toast('⭐ Material star earned')}}
function attemptResult(key,correct){if(state.activityStars[key]!==undefined)return;state.attempts[key]=(state.attempts[key]||0)+1;let n=state.attempts[key];if(correct){let score=n===1?2:n===2?1:0;state.activityStars[key]=score;state.earned[key]=(state.earned[key]||0)+score;state.stars+=score;save();render();toast(score?`⭐ ${score} activity star${score===1?'':'s'}`:'Completed — no activity stars this time')}else{save();let f=document.getElementById('feedback');if(f)f.textContent=n===1?'Not quite — try again.':n===2?'One more thoughtful try.':'Keep thinking about the material.'}}
function bind(){document.getElementById('drawOpen')?.addEventListener('click',openDraw);document.getElementById('brutusOpen')?.addEventListener('click',()=>document.getElementById('brutusOverlay').classList.add('open'));document.getElementById('closeBrutus')?.addEventListener('click',()=>document.getElementById('brutusOverlay').classList.remove('open'));const start=document.getElementById('start');if(start)start.onclick=()=>{state={...DEFAULT,talk:document.getElementById('talk').value.trim()||'Public Talk',opening:document.getElementById('opening').value.trim(),test:!!document.getElementById('testMode')?.checked,screen:'talk',meetingStarted:Date.now()};save();render()};document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{state.talkNotes[t.dataset.note]=t.value;save()});document.getElementById('toTrans')?.addEventListener('click',()=>{state.screen='transition';save();render()});if(state.screen==='transition'&&!state.test&&!state.wtUnlocked){const c=()=>{let n=new Date(),u=new Date(n);u.setHours(10,30,0,0);if(n>=u){state.wtUnlocked=true;save();render()}else setTimeout(c,1000)};c()}document.getElementById('beginWT')?.addEventListener('click',()=>{state.screen='wt';state.unit=0;state.meetingStarted=Date.now();save();render()});if(state.screen==='wt'&&!state.test){const tick=()=>{let t=document.getElementById('timer'),n=document.getElementById('next'),e=state.meetingStarted?Date.now()-state.meetingStarted:0,r=Math.max(0,150000-e);if(t)t.textContent=fmt(r);if(n&&r===0){n.disabled=false;document.querySelector('.nextnote').textContent='Unit complete — you can move on.'}else setTimeout(tick,1000)};tick()}
let u=unit();if(state.screen==='wt'&&u){document.getElementById('actual')?.addEventListener('click',()=>{state.view='actual';awardMaterial(u.id);render()});document.getElementById('easy')?.addEventListener('click',()=>{state.view='easy';awardMaterial(u.id);render()});document.getElementById('openWT')?.addEventListener('click',()=>{awardMaterial(u.id);openWatchtowerPage(u.ps[0])});document.getElementById('scriptureBtn')?.addEventListener('click',()=>{awardMaterial(u.id);toast('Use the references in the published page.')});document.getElementById('saveQuestion')?.addEventListener('click',()=>{let v=document.getElementById('questionAnswer').value.trim();state.questionAnswers[u.id]=v;if(v)awardMaterial(u.id);save();render()});bindActivity(u.activity,u.id);document.getElementById('next')?.addEventListener('click',advance)}document.getElementById('restart')?.addEventListener('click',()=>{state={...DEFAULT,screen:'setup'};save();render()})}
function bindActivity(a,key){if(a.type==='drag'){let dragged=null;document.querySelectorAll('[data-drag]').forEach(el=>{el.addEventListener('dragstart',()=>dragged=el);});document.querySelectorAll('.dropZone').forEach(z=>{z.addEventListener('dragover',e=>e.preventDefault());z.addEventListener('drop',()=>{if(dragged)z.querySelector('.zoneItems').appendChild(dragged)})});document.getElementById('checkGame')?.addEventListener('click',()=>{let ok=true;document.querySelectorAll('.dragCard').forEach(el=>{let parent=el.closest('.dropZone');let i=Number(el.dataset.drag),target=Number(a.items[i][1]),zone=parent?.dataset.target;ok=ok&&(target===Number(zone))});attemptResult(key,ok)})}else if(a.type==='wordsearch'){document.querySelectorAll('.wsCell').forEach(c=>c.onclick=()=>c.classList.toggle('selected'));document.getElementById('checkGame')?.addEventListener('click',()=>attemptResult(key,document.querySelectorAll('.wsCell.selected').length>=4))}else if(a.type==='crossword'){document.getElementById('checkGame')?.addEventListener('click',()=>{let filled=[...document.querySelectorAll('[data-cw]')].filter(x=>x.value.trim()).length;attemptResult(key,filled>=Math.min(8,a.answers.join('').length))})}else if(a.type==='picture'){document.querySelectorAll('[data-piece]').forEach(c=>c.onclick=()=>c.classList.toggle('selected'));document.getElementById('checkGame')?.addEventListener('click',()=>{let chosen=[...document.querySelectorAll('.picturePiece.selected')].map(x=>Number(x.dataset.piece));let ok=a.correct.every(i=>chosen.includes(i))&&chosen.length===a.correct.length;attemptResult(key,ok)})}else if(a.type==='order'){document.querySelectorAll('.orderItem').forEach(b=>b.onclick=()=>document.getElementById('orderList').appendChild(b));document.getElementById('checkGame')?.addEventListener('click',()=>{let seq=[...document.querySelectorAll('.orderItem')].map(x=>Number(x.dataset.order));attemptResult(key,JSON.stringify(seq)===JSON.stringify(a.correct))})}else if(a.type==='match'){let selected=[];document.querySelectorAll('.matchCard').forEach(c=>c.onclick=()=>{let i=Number(c.dataset.match);selected.push(i);document.getElementById('matchTargets').insertAdjacentHTML('beforeend',`<div class="clue">${esc(a.pairs[i][0])} → ${esc(a.pairs[i][1])}</div>`);c.disabled=true});document.getElementById('checkGame')?.addEventListener('click',()=>attemptResult(key,selected.length===a.pairs.length))}else if(a.type==='hidden'){document.querySelectorAll('[data-hidden]').forEach(c=>c.onclick=()=>c.style.opacity=.25);document.getElementById('checkGame')?.addEventListener('click',()=>attemptResult(key,[...document.querySelectorAll('[data-hidden]')].filter(x=>x.style.opacity==='0.25').length===a.items.length))}else if(a.type==='halfdraw'){initHalfCanvas();document.getElementById('checkGame')?.addEventListener('click',()=>attemptResult(key,halfInk()))}}
function initHalfCanvas(){let c=document.getElementById('halfCanvas');if(!c)return;let r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;let x=c.getContext('2d');x.scale(dpr,dpr);x.strokeStyle='#6d5dfc';x.lineWidth=5;x.lineCap='round';let on=false,last=null;c.onpointerdown=e=>{on=true;last=halfPos(e,c)};c.onpointermove=e=>{if(!on)return;let p=halfPos(e,c);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p};c.onpointerup=()=>on=false;c.onpointercancel=()=>on=false}function halfPos(e,c){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function halfInk(){let c=document.getElementById('halfCanvas');if(!c)return false;let d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;for(let i=3;i<d.length;i+=4)if(d[i]>10)return true;return false}
function advance(){if(state.unit===units.length-1)state.screen='finish';else{state.unit++;state.view='actual';state.meetingStarted=Date.now()}save();render()}
function songPage(n){return ({12:14,28:36,141:209}[Number(n)]||null)}function song(n){let p=songPage(n);window.open(`${SONGS}${p?'#page='+p:''}`,'_blank','noopener');if(!p)toast(`Opening the lead-sheet PDF. Find song ${n} there.`)}function openWatchtowerPage(page){window.open(`${WT}#page=${page}`,'_blank','noopener')}
function toast(msg){let t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:#182033;color:#fff;padding:11px 16px;border-radius:12px;font-weight:850;box-shadow:0 8px 24px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function openDraw(){document.getElementById('drawOverlay').classList.add('open');setupCanvas()}function closeDraw(){document.getElementById('drawOverlay').classList.remove('open');saveDrawing()}function setupCanvas(){canvas=document.getElementById('drawCanvas');if(!canvas)return;let r=canvas.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);if(canvas.width!==Math.round(r.width*dpr)||canvas.height!==Math.round(r.height*dpr)){canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';if(drawState.drawing){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=drawState.drawing}}canvas.onpointerdown=e=>{drawing=true;let p=pos(e);lastX=p.x;lastY=p.y;saveHistory()};canvas.onpointermove=e=>{if(!drawing)return;let p=pos(e);ctx.strokeStyle=drawState.color;ctx.lineWidth=drawState.size;ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;saveDrawing()};canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false}function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function saveHistory(){if(canvas){drawState.history.push(canvas.toDataURL('image/png'));if(drawState.history.length>20)drawState.history.shift();drawState.redo=[]}}function saveDrawing(){if(canvas){drawState.drawing=canvas.toDataURL('image/png');try{localStorage.setItem('smb-drawing-v7',drawState.drawing)}catch(e){}}}function clearDraw(){if(!canvas)return;saveHistory();ctx.clearRect(0,0,canvas.width,canvas.height);saveDrawing()}function undoDraw(){if(!canvas||!drawState.history.length)return;drawState.redo.push(canvas.toDataURL('image/png'));let d=drawState.history.pop();restoreDrawing(d);drawState.drawing=d}function redoDraw(){if(!canvas||!drawState.redo.length)return;drawState.history.push(canvas.toDataURL('image/png'));let d=drawState.redo.pop();restoreDrawing(d);drawState.drawing=d}function restoreDrawing(d){let im=new Image();im.onload=()=>{let r=canvas.getBoundingClientRect();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,r.width,r.height)};im.src=d}function saveImage(){if(!canvas)return;let a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='maddys-meeting-drawing.png';a.click()}function initDrawing(){try{drawState.drawing=localStorage.getItem('smb-drawing-v7')||null}catch(e){}document.getElementById('closeDraw').onclick=closeDraw;document.getElementById('undoDraw').onclick=undoDraw;document.getElementById('redoDraw').onclick=redoDraw;document.getElementById('clearDraw').onclick=clearDraw;document.getElementById('saveDraw').onclick=saveImage;document.getElementById('newDraw').onclick=()=>{if(confirm('Start a new drawing?')){clearDraw();drawState.history=[];drawState.redo=[]}};document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>drawState.color=b.dataset.color);document.getElementById('penSize').oninput=e=>drawState.size=Number(e.target.value);window.addEventListener('resize',()=>{if(document.getElementById('drawOverlay').classList.contains('open'))setupCanvas()})}
initDrawing();render();
</script>
</body></html>
