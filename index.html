const WT='w_E_202607.pdf', SONGS='sjjsm_E.pdf';
const pTexts={
1:`Have you ever thought about the depth of Jehovah’s knowledge, the vastness of his wisdom, or the scope of his accomplishments? We are humbled when we think about our Creator. You may feel as did the apostle Paul, who wrote: “O the depth of God’s riches and wisdom and knowledge! How unsearchable his judgments are and beyond tracing out his ways are!”—Rom. 11:33, 34.`,
2:`Although we will never know everything there is to know about Jehovah, it is possible, to a certain extent, to get to know what he is like. King David told his son Solomon: “Know the God of your father and serve him with a complete heart . . . If you search for him, he will let himself be found by you.” (1 Chron. 28:9) And the apostle John reminded his fellow Christians that we have “insight so that we may gain the knowledge of the one who is true.” (1 John 5:20) Jesus himself said that knowledge of Jehovah is available to “anyone to whom the Son is willing to reveal him.”—Matt. 11:27.`,
3:`All who dedicated themselves to Jehovah have already learned many things about him. Yet, we never stop “coming to know” Jehovah. (John 17:3; see study note.) We can always learn more about what makes him happy and how to deepen our trust in him. Let us discuss three questions that all of us should consider no matter how long we have served Jehovah: What does it mean to come to know Jehovah? Why should we continue to get to know him better? And how do we get to know him better?`,
4:`We learn what is involved in coming to know Jehovah by considering what he said about the Jews who would return from exile. Jehovah promised: “I will give them a heart to know me, that I am Jehovah.” (Jer. 24:7) Surely those who returned from Babylon already knew basic facts about Jehovah. But their efforts to come to know Jehovah would need to involve their heart, including their feelings and motives. One reference work puts it this way: “There is a marked difference between knowing about God and knowing God. It is comparable to the difference between reading about love and falling in love.” We need to know more than the fact that Jehovah has a name and that he is God. We want to come to know the Person behind the name.`,
5:`As we come to know Jehovah, we learn what makes him happy and what displeases him. To illustrate, consider the example of King Josiah. The Bible says: “In the 8th year of his reign, while he was still a boy, he started to search for the God of David his forefather.” (2 Chron. 34:3) But Josiah did more than study. He acted on what he was learning. Through the prophet Jeremiah, Jehovah said that Josiah “upheld justice and righteousness” and that he defended the afflicted and the poor. Then Jehovah added: “Is that not what it means to know me?”—Jer. 22:15, 16.`,
6:`Read Psalm 9:10. The more we come to know Jehovah, the more we come to trust in him. That principle proved true for the apostle Paul. During his final imprisonment and not long before his death, he wrote: “I am not ashamed. For I know the One whom I have believed.” (2 Tim. 1:12) What Paul had learned and experienced during his life moved him to trust in his God implicitly.`,
7:`Over time, we may not put as much effort into getting to know Jehovah as we did when we first learned about him. When reading the Bible on our own or along with others at congregation meetings, we may tend to focus on how the information can help us personally in practical ways or how we can use it to help others. The Scriptures encourage us to do that. (2 Tim. 3:16, 17) But the Bible also reveals much about its Author. (Ps. 25:8-10) We should never be so absorbed in how the Bible’s message benefits us or others that we fail to ask ourselves, “What does this tell me about Jehovah God?”`,
8:`As we get to know Jehovah better, our friendship with him will grow stronger. For example, how do you feel about Jehovah after you do your daily Bible reading, watch a monthly broadcast, or attend an assembly or a convention? We often feel closer to our heavenly Father because we have learned more about him. As a result, we are moved to praise and thank him. We feel like the psalmist who meditated on Jehovah’s care for him and said: “God is the rock of my heart and my portion forever.” (Read Psalm 73:24-28.) Every effort we make to get to know Jehovah deepens our gratitude for our priceless friendship with him.`,
9:`When we “take notice of” Jehovah—recalling what we have learned about him and thinking about how our actions affect him—we will make better decisions. To illustrate: Many brothers and sisters keep a photograph of their mate on their desk, in their wallet, or on their phone. This helps them to think fondly and often about their mate, to make decisions that they know will please their mate, and to avoid anything that would hurt that person. Similarly, the more often we think about Jehovah, the more likely we will be to make choices that please him.—Ps. 19:13, 14.`,
10:`We are made in Jehovah’s image, which gives us the ability to reflect his qualities. (Gen. 1:26) And the more we learn about Jehovah’s qualities, the better we will understand how to imitate him. Jesus condemned the scribes and Pharisees for their failure to show godly qualities. Although they paid close attention to the minor details of the Law, they “disregarded the weightier matters of the Law, namely, justice and mercy and faithfulness.” (Matt. 23:23) Unlike those religious leaders, let us do our best to understand how Jehovah’s qualities are reflected in his laws and principles. Doing so will help us to demonstrate those very qualities.—1 John 4:8, 11.`,
11:`Who introduced you to Jehovah? Perhaps you were raised by Christian parents. They likely related Bible accounts that reveal God’s qualities and taught you how the things he created reflect his personality. Or you may have accepted a Bible study from one of Jehovah’s Witnesses. Using a study aid, such as the Enjoy Life Forever! book, your Bible teacher helped you to analyze Scriptural accounts and to learn about Jehovah’s appealing qualities by studying the natural world. (Neh. 8:8; Acts 14:17) Let us consider how we can continue learning about Jehovah.`,
12:`First, we can learn more about Jehovah by reading and studying his Word. Sometimes, the Bible specifically identifies God’s qualities. (Ex. 34:6, 7) More often, though, it relates events involving humans and the decisions they made. When you read such accounts, think about what they can teach you about Jehovah.`,
13:`Consider the example of Ebed-melech, who rescued the prophet Jeremiah. (Jer. 38:6-13) Doubtless, you quickly identify ways that you can imitate Ebed-melech’s self-sacrifice, courage, and love for his fellow worshippers. But you can also look for what the account teaches you about Jehovah. Do you also see what qualities of Jehovah are revealed in this account? (Read Jeremiah 39:15-18.) For instance, what verse indicates that Jehovah is appreciative? Fair? Impartial? What other aspects of Jehovah’s personality do you discern in this account? Whenever you read a passage in God’s Word, identify Jehovah’s qualities that are reflected, and then thank and praise him for those qualities.`,
14:`Second, we can learn more about Jehovah by meditating on his creative works. (Ps. 145:9, 10) Of course, simply observing the natural world is not enough. Some spend their entire lives studying nature but fail to acknowledge God’s qualities or even his existence! The apostle Paul wrote that God’s “invisible qualities are clearly seen from the world’s creation onward, because they are perceived by the things made.” (Rom. 1:20) One translation of this verse says that we can perceive God’s qualities because they are “visible . . . to the eye of reason.” So we must think about and reason on what we see in order to discern the qualities of our Creator.`,
15:`Many of us live in urban areas that seem distant from the natural world. If this is your situation, can you still learn lessons from creation? Consider Patrick, who lives in Brazzaville, a large city in the Republic of the Congo. He relates: “I strive to observe creation from my balcony. I often see tiny insects or small birds busily looking for food or for a place to live. Once, I observed some birds making their nest. They found and used materials in our neighborhood that were perfectly suited for welcoming small chicks.” Patrick did not stop there; he thought deeply about the Creator. He says: “I learned that Jehovah cares about the well-being of his creatures, even those that seem insignificant. This assures me that he also cares about me and will not fail to provide me with what I need.”`,
16:`A third way we can get to know Jehovah better is by meditating on our own experiences. That is what Jesus’ mother, Mary, did. She already knew Jehovah well, and she had “found favor with [him].” (Luke 1:30) But then she was given a weighty assignment—to be the mother of God’s Son. Through the angel Gabriel and Mary’s relative Elizabeth, Jehovah strengthened Mary and reassured her. She later meditated on what her experience had revealed about Jehovah—including his power, mercy, impartiality, and interest in even the lowly ones. (Luke 1:46-55) Just as Mary was appreciative of God’s support, we are grateful when Jehovah gives us help “at the right time.” (Heb. 4:16) When you receive this help, ask yourself: “What has this taught me about Jehovah? Which qualities of Jehovah has this help revealed?”`,
17:`Think of how much more we will learn about Jehovah in the new world. We will receive new scrolls that reveal his requirements for us. (Rev. 20:12) We will be able to interact more closely with the natural world. (Isa. 11:6-9) And we will deepen our understanding as we experience new things, including our loved ones being resurrected and our getting closer to perfection every day.`,
18:`We will never stop getting to know Jehovah. He has already lived for an eternity, so “his understanding is beyond measure.” (Ps. 90:2; 147:5) We “will never find out the work that the true God has made from start to finish.” (Eccl. 3:11) Therefore, regardless of how long we have been in the truth, may we seize every opportunity to learn more about our loving Father.`
};
const easy={1:`We can learn facts about Jehovah, but we also want to learn what he is like and what matters to him.`,2:`You can keep learning about Jehovah your whole life. There is always more to discover about him.`,3:`The article asks three big questions: What does it mean to know Jehovah? Why keep learning about him? And how can we learn more?`,4:`Knowing Jehovah is more than knowing facts. We want to know the Person behind his name, including his feelings and motives.`,5:`Josiah showed that he knew Jehovah by doing what he learned—being fair and helping people who needed help.`,6:`Paul learned from his experiences and trusted Jehovah deeply. Knowing Jehovah better can make our trust stronger.`,7:`When we study the Bible, we can ask not only “How does this help me?” but also “What does this teach me about Jehovah?”`,8:`Learning more about Jehovah can make us feel closer to him and more thankful.`,9:`Remembering Jehovah and thinking about what would please him can help us make better choices.`,10:`Learning Jehovah’s qualities helps us copy those qualities in the way we treat people.`,11:`People meet Jehovah in different ways—through family, Bible study, meetings, and learning from the Scriptures.`,12:`When you read a Bible account, look for what it teaches you about Jehovah, not only what happened.`,13:`Ebed-melech’s story teaches us about good qualities in people and can also help us notice qualities Jehovah values.`,14:`Nature can teach us about Jehovah when we stop and think about what his creations show us.`,15:`Even in a city, Patrick noticed small things in nature and thought about what they showed him about Jehovah.`,16:`When Jehovah helps us, we can stop and ask what that experience taught us about him.`,17:`In the new world, there will still be wonderful things to learn and experience.`,18:`We will never finish learning about Jehovah. There will always be more to discover about our loving Father.`};
const questions={1:`What does it mean to come to know Jehovah?`,2:`What proves that we can get to know Jehovah?`,3:`What will we discuss in this article?`,4:`What is involved in coming to know Jehovah?`,5:`What can we learn from King Josiah regarding what it means to come to know Jehovah?`,6:`As indicated at Psalm 9:10, how will coming to know Jehovah affect us?`,7:`After we have been serving Jehovah for many years, what could happen?`,8:`What impact will getting to know Jehovah better have on our friendship with him?`,9:`When we “take notice” of Jehovah, how will this affect our decisions?`,10:`How will knowing Jehovah’s appealing qualities help us?`,11:`Who introduced you to Jehovah?`,12:`What can we learn about Jehovah from reading the Bible?`,13:`What can we learn about Jehovah from reading the Bible? Give an example.`,14:`What can we do to benefit fully from what we observe in creation?`,15:`What has Patrick done to get to know Jehovah better, and how can you do something similar?`,16:`What helped Mary, Jesus’ mother, come to know Jehovah better, and how can we imitate her?`,17:`Why will we keep learning more about Jehovah?`,18:`Why can we say that we will never stop getting to know Jehovah?`};

const DEFAULT={screen:'setup',talk:'',opening:'',unit:0,view:'actual',stars:0,earned:{},activityStars:{},materialAwarded:{},attempts:{},test:false,meetingStarted:null,wtUnlocked:false,talkNotes:{},questionAnswers:{},game:{},completedDraw:{}};

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){try{localStorage.setItem('smb-state-v7',JSON.stringify(state))}catch(e){}}function load(){try{const s=JSON.parse(localStorage.getItem('smb-state-v7')||'null');if(s)state={...DEFAULT,...s}}catch(e){}}function fmt(ms){let t=Math.ceil(ms/1000),m=Math.floor(t/60),s=t%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function header(){return `<div class="top"><div class="brand">🌿 Sunday Meeting Buddy</div><div class="topActions"><button class="toolBtn" id="drawOpen">✏️ Draw</button><div class="stars">⭐ ${state.stars}</div></div></div>`}

function setup(){return `<section class="card hero"><div class="eyebrow">Sunday Meeting</div><h1>Let’s get ready! 🌿</h1><p>Meeting starts at 10:00. Set up the public talk and opening song.</p><div class="field"><label>Public talk title</label><input id="talk" placeholder="Enter the talk title" value="${esc(state.talk)}"></div><div class="field"><label>Opening song number</label><input id="opening" inputmode="numeric" placeholder="Song number" value="${esc(state.opening)}"></div><label style="display:flex;justify-content:center;align-items:center;gap:8px;margin:16px 0;font-weight:750"><input id="testMode" type="checkbox" ${state.test?'checked':''}> Test mode</label><button class="primary" id="start">START THE MEETING</button></section>`}
function talk(){return `<section class="card"><div class="headerline"><div><div class="eyebrow">Public Talk</div><h1 style="margin:4px 0">${esc(state.talk||'Public Talk')}</h1></div><button class="secondary" onclick="song(${Number(state.opening)||12})">🎵 Opening Song ${esc(state.opening||'')}</button></div><p class="source">Listen, think, and use any of these if they help.</p><div class="talkGrid"><div class="card talkPrompt"><h3>💡 Something I learned</h3><textarea data-note="learned" placeholder="Type or use dictation…">${esc(state.talkNotes.learned||'')}</textarea></div><div class="card talkPrompt"><h3>📖 A Bible verse I heard</h3><textarea data-note="verse" placeholder="Type or use dictation…">${esc(state.talkNotes.verse||'')}</textarea></div><div class="card talkPrompt"><h3>❤️ Something about Jehovah</h3><textarea data-note="jehovah" placeholder="Type or use dictation…">${esc(state.talkNotes.jehovah||'')}</textarea></div><div class="card talkPrompt"><h3>🤔 Something I want to remember</h3><textarea data-note="remember" placeholder="Type or use dictation…">${esc(state.talkNotes.remember||'')}</textarea></div></div><div class="lock"><strong>Watchtower Study unlocks at 10:30 AM</strong><br><br><button class="primary" id="toTrans">CONTINUE</button></div></section>`}
function transition(){const now=new Date(),u=new Date(now);u.setHours(10,30,0,0);const ready=state.test||state.wtUnlocked||now>=u;return `<section class="card hero"><div class="eyebrow">10:30 AM</div><h1>${ready?'Watchtower Study is ready! 📖':'Almost there… 🔒'}</h1><p>${ready?'Next song:':'The next song and Watchtower unlock at 10:30 AM.'} <strong>Song 28 — Gaining Jehovah’s Friendship</strong></p><button class="secondary" onclick="song(28)">🎵 Song 28 Lead Sheet</button><br><br><button class="primary" id="beginWT" ${ready?'':'disabled'}>BEGIN WATCHTOWER STUDY</button></section>`}

function watch(){const u=unit(),key=u.id,earned=state.earned[key]||0,score=state.activityStars[key],elapsed=state.meetingStarted?Date.now()-state.meetingStarted:0,remaining=Math.max(0,150000-elapsed),ready=state.test||remaining===0,qa=state.questionAnswers[key]||'';return `<div class="grid"><section><div class="card"><div class="headerline"><div><div class="eyebrow">Watchtower Study</div><h2>${u.ps.length>1?`Paragraphs ${u.ps[0]}–${u.ps[1]}`:`Paragraph ${u.ps[0]}`} · Unit ${state.unit+1} of ${units.length}</h2><div class="article-meta">Are You Getting to Know Jehovah Better? · September 21–27, 2026</div></div><div class="pill">⭐ ${earned}/3</div></div><div class="progress" style="margin-top:13px"><div style="width:${(state.unit+1)/units.length*100}%"></div></div></div><div class="card"><div class="toggle"><button id="actual" class="${state.view==='actual'?'active':''}">📖 Actual</button><button id="easy" class="${state.view==='easy'?'active':''}">🧒 Maddy’s words</button></div><div style="margin-top:12px">${state.view==='actual'?`<div class="actualText">${esc(actualText(u))}</div>`:`<div class="easy"><strong>In Maddy’s words:</strong><br>${u.ps.map(n=>easy[n]).join('<br><br>')}</div>`}</div><div class="materialTools"><button class="interact" id="openWT">📖 Original page</button><button class="interact" id="scriptureBtn">📜 References</button></div><div class="question"><strong>Think about it</strong><div class="qprompt">${esc(u.ps.length===2?'What can we learn about Jehovah from reading the Bible? Give an example.':questions[u.ps[0]])}</div><textarea id="questionAnswer" placeholder="Type your answer…">${esc(qa)}</textarea><button class="secondary" id="saveQuestion" style="margin-top:8px">Save answer</button></div></div>${activityHTML(u.activity,key,score)}<div class="bottom"><div class="nextnote">${state.test?'Test mode: advance whenever you want.':ready?'Unit complete — you can move on.':'Next unlocks when this unit’s time is up.'}</div><button class="primary" id="next function activityHTML(a,key,score){let body='';if(a.type==='sort')body=sortHTML(a,key);else if(a.type==='wordsearch')body=wordSearchHTML(a,key);else if(a.type==='crossword')body=crosswordHTML(a,key);else if(a.type==='choose'||a.type==='lens'||a.type==='scenario'||a.type==='evidence')body=chooseHTML(a,key);else if(a.type==='order'||a.type==='timeline')body=sequenceHTML(a,key);else if(a.type==='match')body=matchHTML(a,key);else if(a.type==='path')body=pathHTML(a,key);else if(a.type==='picture')body=pictureHTML(a,key);else if(a.type==='hidden')body=hiddenHTML(a,key);else if(a.type==='choiceDraw')body=choiceDrawHTML(a,key);return `<div class="card activity"><h3>🎮 ${activityTitle(a.type)}</h3><div class="activityPrompt">${esc(a.prompt)}</div>${body}<div class="feedback" id="feedback"></div><div class="scoreline"><span>Activity: <span class="mini-stars">${score===undefined?'—':score+' / 2'}</span></span><span>Material: <span class="mini-stars">${state.materialAwarded[key]?'⭐':'—'}</span></span></div></div>`}
function activityTitle(t){return ({sort:'Sort It',wordsearch:'Word Search',crossword:'Mini Crossword',choose:'Pick the Clues',lens:'Bible Reading Lens',scenario:'Decision Helper',order:'Put It In Order',timeline:'Future Timeline',match:'Match It',path:'Build the Path',picture:'Picture Puzzle',hidden:'Explore the Scene',evidence:'Jehovah Qualities',choiceDraw:'Pick & Draw'})[t]||'Game'}
function sortHTML(a,key){return `<div class="dropBoard">${a.targets.map((t,i)=>`<div class="dropZone" data-target="${i}"><h4>${esc(t)}</h4><div class="zoneItems"></div></div>`).join('')}</div><div class="pool" id="dragPool">${a.cards.map((c,i)=>`<div class="dragCard" draggable="true" data-drag="${i}">${esc(c[0])}</div>`).join('')}</div><div class="smallNote">On iPad: drag a card, or tap a card and then tap a box.</div><button class="secondary" id="checkGame" style="margin-top:10px">Check it</button>`}
function wordSearchHTML(a,key){const grid=makeWordGrid(a.words,10);return `<div class="wordList">${a.words.map(w=>`<span class="wordChip" data-word="${w}">${w}</span>`).join('')}</div><div class="wordsearch">${grid.cells.map((c,i)=>`<button class="wsCell" data-wsi="${i}" data-r="${c.r}" data-c="${c.c}">${c.letter}</button>`).join('')}</div><div class="smallNote" style="margin-top:9px">Tap the first and last letter of a word. Words can go across, down, or diagonally.</div>`}
function makeWordGrid(words,n){let cells=Array.from({length:n*n},(_,i)=>({r:Math.floor(i/n),c:i%n,letter:''}));let dirs=[[0,1],[1,0],[1,1],[-1,1]],seed=31;for(const w of words){let placed=false;for(let tries=0;tries<500&&!placed;tries++){seed=(seed*9301+49297)%233280;let r=Math.floor(seed/233280*n),c=Math.floor(((seed*17)%233280)/233280*n),d=dirs[tries%dirs.length],er=r+d[0]*(w.length-1),ec=c+d[1]*(w.length-1);if(er<0||er>=n||ec<0||ec>=n)continue;let ok=true;for(let j=0;j<w.length;j++){let x=c+d[1]*j,y=r+d[0]*j,cell=cells[y*n+x];if(cell.letter&&cell.letter!==w[j])ok=false}if(ok){for(let j=0;j<w.length;j++){let x=c+d[1]*j,y=r+d[0]*j;cells[y*n+x].letter=w[j]}placed=true}}}let letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(const cell of cells)if(!cell.letter){seed=(seed*9301+49297)%233280;cell.letter=letters[Math.floor(seed/233280*26)]}return {cells}}
function crosswordHTML(a,key){const active=new Set([0,1,2,3,4,5,9,16]);let cells=[];for(let i=0;i<49;i++){if(!active.has(i))cells.push('<div class="cwCell block"></div>');else cells.push(`<div class="cwCell"><input maxlength="1" data-cw="${i}"></div>`)}return `<div class="crossword">${cells.join('')}</div><div class="clueList"><div class="clue"><b>1 Across:</b> The question asking for a thing or idea.</div><div class="clue"><b>2 Down:</b> The question asking for a reason.</div><div class="clue"><b>3 Across:</b> The question asking for a method.</div></div><button class="secondary" id="checkGame" style="margin-top:10px">Check crossword</button>`}
function chooseHTML(a,key){return `<div class="choiceGrid">${a.choices.map((c,i)=>`<button class="answer choice" data-choice="${i}">${esc(c)}</button>`).join('')}</div><button class="secondary" id="checkGame" style="margin-top:12px">Check my choices</button>`}
function sequenceHTML(a,key){return `<div class="answers" id="sequence">${a.items.map((x,i)=>`<button class="answer orderItem" data-seq="${i}">${esc(x)} <span style="float:right">↕️</span></button>`).join('')}</div><div class="smallNote">Tap a card to move it to the bottom. Keep tapping until the order is right.</div><button class="secondary" id="checkGame" style="margin-top:12px">Check order</button>`}
function matchHTML(a,key){const rights=a.pairs.map((p,i)=>({i,text:p[1]})).sort(()=>Math.random()-.5);return `<div class="matchGrid"><div class="matchSide" id="matchLeft">${a.pairs.map((p,i)=>`<button class="matchCard" data-left="${i}">${esc(p[0])}</button>`).join('')}</div><div class="matchSide" id="matchRight">${rights.map(x=>`<button class="matchTarget" data-right="${x.i}">${esc(x.text)}</button>`).join('')}</div></div><div class="smallNote" style="margin-top:10px">Tap one on the left, then its match on the right.</div><button class="secondary" id="checkGame" style="margin-top:12px">Check matches</button>`}
function pathHTML(a,key){return `<div class="pathSteps">${a.steps.map((s,i)=>`<button class="answer pathStep" data-path="${i}">${esc(s)}</button>`).join('')}</div><div class="smallNote">Tap the steps in the order you think they happen.</div><button class="secondary" id="checkGame" style="margin-top:12px">Check path</button>`}
function pictureHTML(a,key){return `<div class="picturePuzzle">${a.tiles.map((x,i)=>`<button class="picturePiece" data-piece="${i}"><span style="font-size:44px">${x[0]}</span><br>${esc(x[1])}</button>`).join('')}</div><button class="secondary" id="checkGame" style="margin-top:12px">Check my choices</button>`}

function choiceDrawHTML(a,key){return `<div class="choiceGrid">${a.choices.map((c,i)=>`<button class="answer choice" data-choice="${i}">${esc(c)}</button>`).join('')}</div><div class="smallNote" style="margin-top:12px">Choose one quality, then draw a tiny symbol for it.</div><button class="secondary" id="activityDraw" style="margin-top:10px">✏️ Draw it</button><button class="secondary" id="checkGame" style="margin-top:10px">I’m done</button>`}

function awardMaterial(key){if(!state.materialAwarded[key]){state.materialAwarded[key]=1;state.earned[key]=(state.earned[key]||0)+1;state.stars++;save();toast('⭐ Material star earned')}}
function attemptResult(key,correct){if(state.activityStars[key]!==undefined)return;state.attempts[key]=(state.attempts[key]||0)+1;let n=state.attempts[key];if(correct){let score=n===1?2:n===2?1:0;state.activityStars[key]=score;state.earned[key]=(state.earned[key]||0)+score;state.stars+=score;save();render();toast(score?`⭐ ${score} activity star${score===1?'':'s'}`:'Completed — no activity stars this time')}else{save();let f=document.getElementById('feedback');if(f)f.textContent=n===1?'Not quite — try again.':n===2?'One more thoughtful try.':'Keep thinking about the material.'}}
function bind(){document.getElementById('drawOpen')?.addEventListener('click',openDraw);const start=document.getElementById('start');if(start)start.onclick=()=>{state={...DEFAULT,talk:document.getElementById('talk').value.trim()||'Public Talk',opening:document.getElementById('opening').value.trim(),test:!!document.getElementById('testMode')?.checked,screen:'talk',meetingStarted:Date.now()};save();render()};document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{state.talkNotes[t.dataset.note]=t.value;save()});document.getElementById('toTrans')?.addEventListener('click',()=>{state.screen='transition';save();render()});if(state.screen==='transition'&&!state.test&&!state.wtUnlocked){const c=()=>{let n=new Date(),u=new Date(n);u.setHours(10,30,0,0);if(n>=u){state.wtUnlocked=true;save();render()}else setTimeout(c,1000)};c()}document.getElementById('beginWT')?.addEventListener('click',()=>{state.screen='wt';state.unit=0;state.meetingStarted=Date.now();save();render()});if(state.screen==='wt'&&!state.test){const tick=()=>{let t=document.getElementById('timer'),n=document.getElementById('next'),e=state.meetingStarted?Date.now()-state.meetingStarted:0,r=Math.max(0,150000-e);if(t)t.textContent=fmt(r);if(n&&r===0){n.disabled=false;document.querySelector('.nextnote').textContent='Unit complete — you can move on.'}else setTimeout(tick,1000)};tick()}
let u=unit();if(state.screen==='wt'&&u){document.getElementById('actual')?.addEventListener('click',()=>{state.view='actual';awardMaterial(u.id);render()});document.getElementById('easy')?.addEventListener('click',()=>{state.view='easy';awardMaterial(u.id);render()});document.getElementById('openWT')?.addEventListener('click',()=>{awardMaterial(u.id);openWatchtowerPage(u.ps[0])});document.getElementById('scriptureBtn')?.addEventListener('click',()=>{awardMaterial(u.id);toast('Use the references in the published page.')});document.getElementById('saveQuestion')?.addEventListener('click',()=>{let v=document.getElementById('questionAnswer').value.trim();state.questionAnswers[u.id]=v;if(v)awardMaterial(u.id);save();render()});bindActivity(u.activity,u.id);document.getElementById('next')?.addEventListener('click',advance)}document.getElementById('restart')?.addEventListener('click',()=>{state={...DEFAULT,screen:'setup'};save();render()})}
function bindActivity(a,key){
 if(a.type==='sort'){setupSortTouch(a,key);}
 if(a.type==='wordsearch'){document.querySelectorAll('.wsCell').forEach(c=>c.onclick=()=>wsTap(c,key));}
 if(a.type==='crossword'){document.getElementById('checkGame')?.addEventListener('click',()=>{const vals={};document.querySelectorAll('[data-cw]').forEach(x=>vals[x.dataset.cw]=x.value.toUpperCase());const needed={0:'H',1:'O',2:'W',3:'H',4:'A',5:'T',9:'H',16:'Y'};const ok=Object.entries(needed).every(([i,v])=>vals[i]===v);attemptResult(key,ok)});}
 if(['choose','lens','scenario','evidence','picture'].includes(a.type)){document.querySelectorAll('[data-choice],[data-piece]').forEach(c=>c.onclick=()=>c.classList.toggle('selected'));document.getElementById('checkGame')?.addEventListener('click',()=>{let chosen=[...document.querySelectorAll('.selected')].map(x=>Number(x.dataset.choice??x.dataset.piece));let ok=chosen.length===a.correct.length&&chosen.every(i=>a.correct.includes(i));attemptResult(key,ok)});}
 if(['order','timeline'].includes(a.type)){document.querySelectorAll('.orderItem').forEach(b=>b.onclick=()=>{document.getElementById('sequence').appendChild(b)});document.getElementById('checkGame')?.addEventListener('click',()=>{let seq=[...document.querySelectorAll('.orderItem')].map(x=>Number(x.dataset.seq));attemptResult(key,JSON.stringify(seq)===JSON.stringify(a.correct))});}
 if(a.type==='match'){let current=null,matches={};document.querySelectorAll('[data-left]').forEach(c=>c.onclick=()=>{current=+c.dataset.left;document.querySelectorAll('[data-left]').forEach(x=>x.classList.remove('selected'));c.classList.add('selected')});document.querySelectorAll('[data-right]').forEach(c=>c.onclick=()=>{if(current===null){return feedback('Pick something on the left first.')}matches[current]=+c.dataset.right;c.classList.add('selected');document.querySelector(`[data-left=\"${current}\"]`)?.classList.add('matched');current=null});document.getElementById('checkGame')?.addEventListener('click',()=>attemptResult(key,a.pairs.every((_,i)=>matches[i]===i)));}
 if(a.type==='path'){let picked=[];document.querySelectorAll('[data-path]').forEach(c=>c.onclick=()=>{if(!picked.includes(+c.dataset.path)){picked.push(+c.dataset.path);c.classList.add('selected')}});document.getElementById('checkGame')?.addEventListener('click',()=>attemptResult(key,JSON.stringify(picked)===JSON.stringify(a.correct)));}
 if(a.type==='hidden'){document.querySelectorAll('[data-hidden]').forEach(c=>c.onclick=()=>{c.style.opacity='.25';c.classList.add('found')});document.getElementById('checkGame')?.addEventListener('click',()=>attemptResult(key,[...document.querySelectorAll('[data-hidden].found')].length===a.items.length));}
 if(a.type==='choiceDraw'){document.querySelectorAll('[data-choice]').forEach(c=>c.onclick=()=>{document.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('selected'));c.classList.add('selected')});document.getElementById('activityDraw')?.addEventListener('click',openDraw);document.getElementById('checkGame')?.addEventListener('click',()=>attemptResult(key,!!document.querySelector('[data-choice].selected')));}
}
function setupSortTouch(a,key){let selected=null;document.querySelectorAll('[data-drag]').forEach(el=>{el.addEventListener('dragstart',e=>{selected=el;e.dataTransfer.setData('text/plain',el.dataset.drag)});el.addEventListener('click',()=>{document.querySelectorAll('[data-drag]').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selected=el});el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;selected=el;el.classList.add('selected')})});document.querySelectorAll('.dropZone').forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});z.addEventListener('dragleave',()=>z.classList.remove('over'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');if(selected)placeSort(selected,z)});z.addEventListener('click',()=>{if(selected)placeSort(selected,z)})});document.getElementById('checkGame')?.addEventListener('click',()=>{const got=state.game[key]?.sort||{};const ok=a.cards.every((c,i)=>got[i]===c[1]);attemptResult(key,ok)});}
function placeSort(card,z){const key=unit().id,i=Number(card.dataset.drag);state.game[key]??={};state.game[key].sort??={};state.game[key].sort[i]=Number(z.dataset.target);const zone=z.querySelector('.zoneItems');if(!zone.querySelector(`[data-placed="${i}"]`)){const clone=card.cloneNode(true);clone.dataset.placed=i;clone.classList.remove('selected');clone.removeAttribute('draggable');zone.appendChild(clone)}card.classList.remove('selected');document.querySelectorAll(`[data-drag="${i}"]`).forEach(x=>x.style.display='none');save()}
function wsTap(el,key){state.game[key]??={};state.game[key].ws??={start:null,found:[]};const s=state.game[key].ws,all=[...document.querySelectorAll('.wsCell')];if(s.start===null){s.start=Number(el.dataset.wsi);el.classList.add('selected');return}const start=all[s.start],r1=+start.dataset.r,c1=+start.dataset.c,r2=+el.dataset.r,c2=+el.dataset.c,dr=Math.sign(r2-r1),dc=Math.sign(c2-c1),len=Math.max(Math.abs(r2-r1),Math.abs(c2-c1))+1;let word='';for(let j=0;j<len;j++){const r=r1+dr*j,c=c1+dc*j,cell=all.find(x=>+x.dataset.r===r&&+x.dataset.c===c);if(!cell){s.start=null;return}word+=cell.textContent}if(aWord(word,key)){if(!s.found.includes(word))s.found.push(word);all.forEach(x=>x.classList.remove('selected'));for(let j=0;j<len;j++){const r=r1+dr*j,c=c1+dc*j;all.find(x=>+x.dataset.r===r&&+x.dataset.c===c)?.classList.add('found')}document.querySelector(`[data-word="${word}"]`)?.classList.add('found');if(s.found.length===unit().activity.words.length)attemptResult(key,true);else toast(`Found ${word}!`)}else{all.forEach(x=>x.classList.remove('selected'));toast('Not one of the hidden words. Try another line.')}s.start=null;save()}
function aWord(word,key){return unit().activity.words.includes(word)}

function finish(){return `<section class="card finish"><div class="bigstars">🌟🌟🌟</div><div class="eyebrow">Study complete</div><h1>Great job, Maddy!</h1><p>You finished all ${units.length} study units and earned <strong>${state.stars} stars</strong>.</p><p><strong>${units.length*3}</strong> possible stars</p><button class="primary" id="restart">START A NEW MEETING</button></section>`}
function advance(){if(state.unit===units.length-1)state.screen='finish';else{state.unit++;state.view='actual';state.meetingStarted=Date.now()}save();render()}
function songPage(n){return ({12:14,28:36,141:209}[Number(n)]||null)}function song(n){let p=songPage(n);window.open(`${SONGS}${p?'#page='+p:''}`,'_blank','noopener');if(!p)toast(`Opening the lead-sheet PDF. Find song ${n} there.`)}function openWatchtowerPage(page){window.open(`${WT}#page=${page}`,'_blank','noopener')}
function toast(msg){let t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:#182033;color:#fff;padding:11px 16px;border-radius:12px;font-weight:850;box-shadow:0 8px 24px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function openDraw(){document.getElementById('drawOverlay').classList.add('open');setupCanvas()}function closeDraw(){document.getElementById('drawOverlay').classList.remove('open');saveDrawing()}function setupCanvas(){canvas=document.getElementById('drawCanvas');if(!canvas)return;let r=canvas.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);if(canvas.width!==Math.round(r.width*dpr)||canvas.height!==Math.round(r.height*dpr)){canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';if(drawState.drawing){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=drawState.drawing}}canvas.onpointerdown=e=>{drawing=true;let p=pos(e);lastX=p.x;lastY=p.y;saveHistory()};canvas.onpointermove=e=>{if(!drawing)return;let p=pos(e);ctx.strokeStyle=drawState.color;ctx.lineWidth=drawState.size;ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;saveDrawing()};canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false}function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function saveHistory(){if(canvas){drawState.history.push(canvas.toDataURL('image/png'));if(drawState.history.length>20)drawState.history.shift();drawState.redo=[]}}function saveDrawing(){if(canvas){drawState.drawing=canvas.toDataURL('image/png');try{localStorage.setItem('smb-drawing-v7',drawState.drawing)}catch(e){}}}function clearDraw(){if(!canvas)return;saveHistory();ctx.clearRect(0,0,canvas.width,canvas.height);saveDrawing()}function undoDraw(){if(!canvas||!drawState.history.length)return;drawState.redo.push(canvas.toDataURL('image/png'));let d=drawState.history.pop();restoreDrawing(d);drawState.drawing=d}function redoDraw(){if(!canvas||!drawState.redo.length)return;drawState.history.push(canvas.toDataURL('image/png'));let d=drawState.redo.pop();restoreDrawing(d);drawState.drawing=d}function restoreDrawing(d){let im=new Image();im.onload=()=>{let r=canvas.getBoundingClientRect();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,r.width,r.height)};im.src=d}function saveImage(){if(!canvas)return;let a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='maddys-meeting-drawing.png';a.click()}function initDrawing(){try{drawState.drawing=localStorage.getItem('smb-drawing-v7')||null}catch(e){}document.getElementById('closeDraw').onclick=closeDraw;document.getElementById('undoDraw').onclick=undoDraw;document.getElementById('redoDraw').onclick=redoDraw;document.getElementById('clearDraw').onclick=clearDraw;document.getElementById('saveDraw').onclick=saveImage;document.getElementById('newDraw').onclick=()=>{if(confirm('Start a new drawing?')){clearDraw();drawState.history=[];drawState.redo=[]}};document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>drawState.color=b.dataset.color);document.getElementById('penSize').oninput=e=>drawState.size=Number(e.target.value);window.addEventListener('resize',()=>{if(document.getElementById('drawOverlay').classList.contains('open'))setupCanvas()})}
initDrawing();render();
</script>
